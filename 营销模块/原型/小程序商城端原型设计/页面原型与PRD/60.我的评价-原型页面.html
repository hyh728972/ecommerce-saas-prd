<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的评价 - 苏银豆商城</title>
<link rel="stylesheet" href="../assets/common.css">
<style>
  /* Fix: page-scroll 的 min-height:100vh 未扣除顶栏+标签栏高度，产生约134px幽灵滚动，
     列表尾部被顶到折叠线下。锁定 phone-frame 为一屏、让 page-scroll 吃掉中间空间。 */
  .phone-frame {
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .page-scroll {
    flex: 1;
    min-height: 0;
  }

  /* Tab bar */
  .review-tabs-bar {
    display: flex;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border-divider);
    position: sticky;
    top: 88px;
    z-index: 50;
  }
  .review-tab {
    flex: 1;
    text-align: center;
    padding: var(--space-md) 0;
    font-size: var(--font-base);
    color: var(--text-secondary);
    cursor: pointer;
    position: relative;
  }
  .review-tab:active { background: var(--bg-input); }
  .review-tab.active {
    color: var(--text-color);
    font-weight: 600;
  }
  .review-tab.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 2px;
    background: linear-gradient(90deg, var(--primary-start), var(--price-color));
    border-radius: var(--radius-xs);
  }
  .review-tab .tab-badge {
    display: inline-block;
    background: var(--price-color);
    color: var(--card-bg);
    font-size: var(--font-xs);
    min-width: 16px;
    height: 16px;
    border-radius: var(--radius-sm);
    line-height: 16px;
    margin-left: var(--space-xs);
    padding: 0 var(--space-xs);
  }

  /* Review item */
  .review-list {
    padding: var(--space-md) 0;
  }
  .review-item {
    background: var(--card-bg);
    border-radius: 0;
    margin-bottom: var(--space-md);
    overflow: visible;
  }
  .review-item-header {
    display: flex;
    padding: 10px 12px;
    gap: 10px;
    border-bottom: 1px solid var(--bg-color);
  }
  .review-item .item-img {
    width: 72px;
    height: 72px;
    border-radius: 6px;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--bg-input);
  }
  .review-item .item-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .review-item .item-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .review-item .item-name {
    font-size: 13px;
    color: #262626;
    line-height: 1.4;
    font-weight: 400;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .review-item .item-spec {
    font-size: 12px;
    color: #999;
    line-height: 1.35;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Pending review actions (对齐我的订单 .btn-sm) */
  .review-item-footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: var(--space-sm) 12px 12px;
    gap: var(--space-sm);
  }
  .btn-review {
    padding: 6px 14px;
    border-radius: 4px;
    font-size: var(--font-sm);
    cursor: pointer;
    border: none;
    background: var(--bg-color);
    color: var(--text-color);
    text-decoration: none;
    line-height: 1.2;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .btn-review:active { opacity: 0.7; }
  .btn-review.primary {
    border: none;
    background: var(--selected-bg);
    color: var(--primary-start);
    font-weight: 600;
  }

  /* Completed review content */
  .review-content-area {
    padding: var(--space-md);
    background: var(--hover-bg);
  }
  .review-stars {
    display: flex;
    align-items: center;
    gap: 2px;
    margin-bottom: var(--space-sm);
  }
  .review-stars .star {
    font-size: var(--font-base);
    color: var(--primary-start);
  }
  .review-stars .star.empty { color: var(--text-disabled); }
  .review-text {
    font-size: var(--font-sm);
    color: var(--text-secondary);
    line-height: 1.6;
    margin-bottom: var(--space-sm);
  }
  .review-images {
    display: flex;
    gap: var(--space-sm);
    flex-wrap: wrap;
  }
  .review-images img {
    width: 60px;
    height: 60px;
    border-radius: var(--radius-xs);
    object-fit: cover;
  }
  .review-date {
    font-size: var(--font-sm);
    color: var(--text-muted);
    margin-top: var(--space-sm);
  }

  /* Empty state */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px var(--space-xl);
    color: var(--text-tertiary);
  }
  .empty-state svg {
    width: 80px;
    height: 80px;
    color: var(--text-disabled);
    margin-bottom: var(--space-lg);
  }
  .empty-state .empty-text {
    font-size: var(--font-base);
    margin-bottom: var(--space-lg);
  }
  .empty-state .go-shopping {
    background: linear-gradient(135deg, var(--primary-start), var(--price-color));
    color: var(--card-bg);
    font-size: var(--font-sm);
    padding: var(--space-sm) 24px;
    border-radius: var(--radius-xl);
    cursor: pointer;
  }

  /* Aftersale status on pending items (ref: PC评价中心) */
  .review-item.muted .item-name,
  .review-item.muted .item-spec { color: var(--text-tertiary); }
  .aftersale-tag {
    display: inline-block;
    font-size: var(--font-xs);
    color: var(--warning-color);
    background: var(--bg-color);
    border: 1px solid var(--warning-color);
    border-radius: var(--radius-xs);
    padding: 1px var(--space-xs);
    margin-top: var(--space-xs);
    align-self: flex-start;
  }
  .btn-review.disabled {
    background: var(--bg-color);
    color: var(--text-disabled);
    cursor: not-allowed;
  }

  /* Completed review meta & append (原63.我的评价并入) */
  .review-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: var(--space-sm);
  }
  .btn-append {
    padding: 6px 14px;
    border-radius: 4px;
    font-size: var(--font-sm);
    border: none;
    background: var(--selected-bg);
    color: var(--primary-start);
    font-weight: 600;
    line-height: 1.2;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .btn-append:active { opacity: 0.7; }
  .btn-append.disabled {
    background: var(--bg-color);
    color: var(--text-disabled);
    font-weight: 400;
    cursor: default;
  }
  .append-section {
    border-top: 1px dashed var(--border-color);
    padding: var(--space-md) 12px;
    background: var(--hover-bg);
  }
  .append-label {
    font-size: var(--font-sm);
    color: var(--primary-start);
    font-weight: 500;
    margin-bottom: var(--space-xs);
  }
  .append-text {
    font-size: var(--font-sm);
    color: var(--text-secondary);
    line-height: 1.5;
  }
  .append-date {
    font-size: var(--font-sm);
    color: var(--text-muted);
    margin-top: var(--space-xs);
  }
  .append-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    justify-content: center;
    align-items: flex-end;
  }
  .append-overlay.show { display: flex; }
  .append-popup {
    background: var(--card-bg);
    width: 100%;
    max-width: 430px;
    border-radius: var(--radius-lg) 16px 0 0;
    padding: var(--space-xl) 16px 24px;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .append-popup-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--space-lg);
  }
  .append-popup-header .title {
    font-size: var(--font-md);
    font-weight: 600;
    color: var(--text-color);
  }
  .append-popup-header .close-btn {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-tertiary);
  }
  .append-textarea {
    width: 100%;
    height: 100px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: var(--space-md);
    font-size: var(--font-sm);
    color: var(--text-color);
    resize: none;
    outline: none;
    box-sizing: border-box;
  }
  .append-textarea:focus { border-color: var(--primary-start); }
  .append-char-count {
    text-align: right;
    font-size: var(--font-sm);
    color: var(--text-muted);
    margin-top: var(--space-xs);
  }
  .append-submit {
    display: block;
    width: 100%;
    padding: var(--space-md);
    background: linear-gradient(135deg, var(--primary-start), var(--price-color));
    color: var(--card-bg);
    font-size: var(--font-base);
    font-weight: 500;
    border: none;
    border-radius: var(--radius-xl);
    margin-top: var(--space-lg);
    cursor: pointer;
  }
  .append-submit:active { opacity: 0.8; }
</style>
</head>

      <textarea class="append-textarea" id="appendText" maxlength="200" placeholder="对之前的评价做补充..."></textarea>
      <div class="append-char-count"><span id="appendCharCount">0</span>/200</div>
      <button class="append-submit" onclick="submitAppend()">提交追加评价</button>

</div>
<script src="../assets/common.js"></script>

  var completedReviews = [

  var currentTab = 'pending';
  var appendingId = null;

  // 售后处理中 → 禁评
  function isReviewBlocked(item) {
    return item.aftersale === 'processing';
  }

  // 售后成功 → 不再出现在待评价
  function visiblePending() {
    return pendingReviews.filter(function(item) { return item.aftersale !== 'success'; });
  }

  function updatePendingBadge() {
    var el = document.getElementById('pendingBadge');
    if (el) el.textContent = visiblePending().length;
  }

  function renderStars(count) {
    var html = '';
    for (var i = 0; i < 5; i++) {
      html += '<span class="star ' + (i < count ? '' : 'empty') + '">★</span>';
    }
    return html;
  }

  function renderList() {
    var list = document.getElementById('reviewList');
    var html = '';

    if (currentTab === 'pending') {
      var data = visiblePending();

      if (data.length === 0) {
        list.innerHTML = '<div class="empty-state">' +

        '</div>';
        updatePendingBadge();
        return;
      }

      data.forEach(function(item) {
        var blocked = isReviewBlocked(item);
        var tagHtml = blocked ? '<span class="aftersale-tag">售后处理中</span>' : '';
        var reviewBtn = blocked
          ? '<span class="btn-review disabled" onclick="alert(\'售后处理中，完成后可评价\')">去评价</span>'
          : '<a href="61.发表评价-原型页面.html" class="btn-review primary">去评价</a>';
        html += '<div class="review-item' + (blocked ? ' muted' : '') + '">' +
          '<div class="review-item-header">' +
            '<a href="21.商品详情-原型页面.html" class="item-img"><img src="' + item.img + '" alt=""></a>' +
            '<div class="item-info">' +
              '<div class="item-name">' + item.name + '</div>' +
              '<div class="item-spec">' + item.spec + '</div>' +
              tagHtml +
            '</div>' +
          '</div>' +
          '<div class="review-item-footer">' +
            '<a href="21.商品详情-原型页面.html" class="btn-review">再次购买</a>' +
            reviewBtn +
          '</div>' +
        '</div>';
      });
    } else {
      if (completedReviews.length === 0) {
        list.innerHTML = '<div class="empty-state">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>' +
          '<div class="empty-text">暂无已评价商品</div>' +
        '</div>';
        list.innerHTML = html;
        return;
      }

      completedReviews.forEach(function(item) {
        var imagesHtml = '';
        if (item.images && item.images.length > 0) {
          imagesHtml = '<div class="review-images">';
          item.images.forEach(function(img) {
            imagesHtml += '<img src="' + img + '" alt="">';
          });
          imagesHtml += '</div>';
        }

        var appendHtml = '';
        if (item.append) {
          appendHtml = '<div class="append-section">' +
            '<div class="append-label">追加评价</div>' +
            '<div class="append-text">' + item.append.text + '</div>' +
            '<div class="append-date">' + item.append.date + '</div>' +
          '</div>';

        html += '<div class="review-item">' +
          '<div class="review-item-header">' +
            '<a href="21.商品详情-原型页面.html" class="item-img"><img src="' + item.img + '" alt=""></a>' +
            '<div class="item-info">' +
              '<div class="item-name">' + item.name + '</div>' +
              '<div class="item-spec">' + item.spec + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="review-content-area">' +
            '<div class="review-stars">' + renderStars(item.stars) + '</div>' +
            '<div class="review-text">' + item.text + '</div>' +
            imagesHtml +
            '<div class="review-meta">' +
              '<span class="review-date">评价时间：' + item.date + '</span>' +
              '<span class="btn-append' + (item.append ? ' disabled' : '') + '" data-id="' + item.id + '">' +
                (item.append ? '已追评' : '追加评价') +
              '</span>' +
            '</div>' +
          '</div>' +
          appendHtml +
        '</div>';
      });

      list.innerHTML = html;
      bindAppendButtons();
      updatePendingBadge();
      return;
    }

    list.innerHTML = html;
    updatePendingBadge();
  }

  // Append review popup（原63.我的评价并入）
  function bindAppendButtons() {
    document.querySelectorAll('.btn-append').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        var id = parseInt(this.dataset.id);
        var review = completedReviews.find(function(r) { return r.id === id; });
        if (review && !review.append) {
          openAppendPopup(id);
        }
      });
    });
  }

  function openAppendPopup(id) {
    appendingId = id;
    document.getElementById('appendText').value = '';
    document.getElementById('appendCharCount').textContent = '0';
    document.getElementById('appendOverlay').classList.add('show');
  }

  window.closeAppendPopup = function() {
    document.getElementById('appendOverlay').classList.remove('show');
    appendingId = null;
  };

  document.getElementById('appendText').addEventListener('input', function() {
    document.getElementById('appendCharCount').textContent = this.value.length;
  });

  window.submitAppend = function() {
    var text = document.getElementById('appendText').value.trim();
    if (!text) {
      alert('请输入追加评价内容');
      return;
    }
    var review = completedReviews.find(function(r) { return r.id === appendingId; });
    if (review) {
      var today = new Date();
      var dateStr = today.getFullYear() + '-' +
        String(today.getMonth() + 1).padStart(2, '0') + '-' +
        String(today.getDate()).padStart(2, '0');
      review.append = { text: text, date: dateStr };
    }
    closeAppendPopup();
    renderList();
    alert('追加评价成功！');
  };

  document.getElementById('appendOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeAppendPopup();
  });

  // Tab switching
  document.querySelectorAll('.review-tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.review-tab').forEach(function(t) { t.classList.remove('active'); });
      this.classList.add('active');
      currentTab = this.dataset.tab;
      renderList();
    });
  });

  renderList();
})();
</script>
<script src="../assets/theme-switcher.js"></script>
</body>
</html>
