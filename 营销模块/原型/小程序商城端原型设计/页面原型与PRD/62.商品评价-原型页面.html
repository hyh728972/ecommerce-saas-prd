<style>
  /* Filter tags — P1 chip wrap, one row by default */
  .filter-bar {
    background: var(--card-bg);
    padding: var(--space-md) 12px var(--space-sm);
    flex-shrink: 0;
  }
  .filter-row,
  .filter-extra-row {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-sm);
    align-items: center;
  }
  .filter-extra-row {
    display: none;
    margin-top: var(--space-sm);
  }
  .filter-bar.expanded .filter-extra-row { display: flex; }
  .filter-bar.expanded .filter-more svg { transform: rotate(180deg); }
  .filter-tag {
    padding: 5px 10px;
    border-radius: 4px;
    font-size: var(--font-sm);
    color: var(--text-color);
    background: var(--bg-color);
    cursor: pointer;
    white-space: nowrap;
    line-height: 1.4;
  }
  .filter-tag:active { opacity: 0.7; }
  .filter-tag.active {
    background: var(--selected-bg);
    color: var(--primary-start);
    font-weight: 500;
  }
  .filter-tag .tag-count { font-size: var(--font-xs); margin-left: 2px; }
  .filter-more {
    width: 28px;
    height: 26px;
    margin-left: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-color);
    border-radius: 4px;
    cursor: pointer;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .filter-more svg { width: 12px; height: 12px; transition: transform 0.2s; }

  /* Fix phone-frame so the spec drawer sticks to the visible bottom */
  .phone-frame {
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .page-scroll {
    flex: 1;
    min-height: 0;
  }

  /* Sort + SKU select — P1 */
  .sort-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card-bg);
    padding: 6px 12px 12px;
    border-bottom: 1px solid var(--border-color);
    position: relative;
    gap: var(--space-sm);
    flex-shrink: 0;
  }
  .review-hint {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
    font-size: var(--font-xs);
    color: var(--text-tertiary);
  }
  .review-hint svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
  }
  .sku-select svg { width: 12px; height: 12px; }
  .sku-select {
    position: relative;
    font-size: var(--font-xs);
    color: var(--text-tertiary);
    display: flex;
    align-items: center;
    gap: 2px;
    cursor: pointer;
    max-width: 48%;
    flex-shrink: 0;
  }
  .sku-select .sku-select-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Spec drawer — aligned with 商品详情 */
  .spec-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 300;
    display: none;
  }
  .spec-overlay.show { display: block; }
  .spec-popup {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card-bg);
    border-radius: var(--radius-lg) 16px 0 0;
    z-index: 301;
    transform: translateY(100%);
    transition: transform 0.3s ease;
    max-height: 75vh;
    display: flex;
    flex-direction: column;
  }
  .spec-popup.show { transform: translateY(0); }
  .spec-popup-header {
    display: flex;
    gap: var(--space-md);
    padding: var(--space-lg);
    border-bottom: 1px solid var(--bg-color);
    position: relative;
    flex-shrink: 0;
  }
  .spec-popup-header .thumb {
    width: 72px;
    height: 72px;
    border-radius: var(--radius-sm);
    overflow: hidden;
    flex-shrink: 0;
    background: var(--bg-input);
  }
  .spec-popup-header .thumb img { width: 100%; height: 100%; object-fit: contain; }
  .spec-popup-header .info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding-top: 2px;
    padding-right: 28px;
  }
  .spec-popup-header .popup-title {
    font-size: var(--font-sm);
    font-weight: 600;
    color: var(--text-color);
    line-height: 1.4;
    word-break: break-word;
  }
  .spec-popup-header .popup-selected {
    font-size: var(--font-sm);
    color: var(--text-tertiary);
    margin-top: 6px;
  }
  .spec-popup-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-tertiary);
  }
  .spec-popup-close svg { width: 18px; height: 18px; }
  .spec-popup-body {
    padding: var(--space-lg);
    overflow-y: auto;
    flex: 1;
    min-height: 0;
  }
  .spec-group-title { font-size: var(--font-sm); color: var(--text-color); font-weight: 600; margin-bottom: var(--space-md); }
  .spec-options { display: flex; flex-wrap: wrap; gap: var(--space-sm); }
  .spec-option {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    padding: var(--space-xs);
    padding-right: 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--text-disabled);
    background: var(--card-bg);
    cursor: pointer;
  }
  .spec-option:active { opacity: 0.8; }
  .spec-option img {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-xs);
    object-fit: cover;
    flex-shrink: 0;
    background: var(--bg-input);
  }
  .spec-option span { font-size: var(--font-sm); color: var(--text-color); }
  .spec-option.selected {
    border-color: var(--primary-start);
    background: var(--selected-bg);
  }
  .spec-option.selected span { color: var(--primary-start); }
  .spec-popup-footer {
    display: flex;
    gap: var(--space-sm);
    padding: var(--space-md) 16px 20px;
    flex-shrink: 0;
  }
  .spec-clear-btn,
  .spec-confirm-btn {
    flex: 1;
    height: 44px;
    border: none;
    border-radius: var(--radius-xl);
    font-size: var(--font-md);
    font-weight: 600;
    cursor: pointer;
  }
  .spec-clear-btn {
    background: var(--warning-bg);
    color: var(--text-color);
  }
  .spec-confirm-btn {
    background: linear-gradient(135deg, var(--primary-start), var(--price-color));
    color: var(--card-bg);
  }
  .spec-clear-btn:active,
  .spec-confirm-btn:active { opacity: 0.85; }

  /* Review list */
  .review-list {
    background: var(--card-bg);
  }
  .review-card {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 16px;
    border-bottom: 1px solid var(--bg-color);
  }
  .review-card:last-child { border-bottom: none; }
  .review-card .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--border-divider);
    flex-shrink: 0;
  }
  .review-card .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .review-card .avatar-text {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary-start), var(--price-color));
    color: var(--card-bg);
    font-size: var(--font-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .review-card-main {
    flex: 1;
    min-width: 0;
  }
  .review-card-main .nickname {
    font-size: var(--font-base);
    font-weight: 600;
    color: var(--text-color);
    margin-bottom: 4px;
    line-height: 1.3;
  }
  .review-card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-sm);
    margin-bottom: 10px;
    min-width: 0;
    font-size: var(--font-sm);
    color: var(--text-tertiary);
  }
  .review-card-meta .meta-left {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    flex: 1;
  }
  .review-card-meta .stars {
    display: flex;
    gap: 1px;
    flex-shrink: 0;
  }
  .review-card-meta .stars .star { font-size: var(--font-sm); color: var(--primary-start); }
  .review-card-meta .stars .star.empty { color: var(--text-disabled); }
  .review-card-meta .sep {
    width: 1px;
    height: 10px;
    background: var(--border-color);
    flex-shrink: 0;
  }
  .review-card-meta .bought {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: var(--font-sm);
    color: var(--text-tertiary);
  }
  .review-card-meta .date {
    flex-shrink: 0;
    font-size: var(--font-sm);
    color: var(--text-tertiary);
  }
  .review-card-body {
    font-size: 14px;
    color: var(--text-color);
    line-height: 1.5;
    margin-bottom: var(--space-sm);
  }
  .review-card-images {
    display: flex;
    gap: var(--space-sm);
    flex-wrap: wrap;
  }
  .review-card-images img {
    width: 80px;
    height: 80px;
    border-radius: var(--radius-sm);
    object-fit: cover;
  }

  /* Empty */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px var(--space-xl);
    color: var(--text-tertiary);
  }
  .empty-state svg { width: 60px; height: 60px; color: var(--text-disabled); margin-bottom: var(--space-md); }
  .empty-state .empty-text { font-size: var(--font-sm); }
</style>
</head>

    }
  ];

  var currentFilter = 'all';
  var currentSku = 'all';

  function renderStars(count) {
    var html = '';
    for (var i = 0; i < 5; i++) {
      html += '<span class="star ' + (i < count ? '' : 'empty') + '">★</span>';
    }
    return html;
  }

  function getFilteredReviews() {
    return reviews.filter(function(r) {
      var filterOk = true;
      if (currentFilter === 'good') filterOk = r.stars >= 4;
      else if (currentFilter === 'mid') filterOk = r.stars === 3;
      else if (currentFilter === 'bad') filterOk = r.stars <= 2;
      else if (currentFilter === 'img') filterOk = r.images && r.images.length > 0;

      var skuOk = currentSku === 'all' || r.spec.indexOf(currentSku) !== -1;
      return filterOk && skuOk;
    });
  }

  function renderList() {
    var list = document.getElementById('reviewList');
    var data = getFilteredReviews();

    if (data.length === 0) {
      list.innerHTML = '<div class="empty-state">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>' +
        '<div class="empty-text">暂无符合条件的评价</div>' +
      '</div>';
      return;
    }

    var html = '';
    data.forEach(function(r) {
      var imagesHtml = '';
      if (r.images && r.images.length > 0) {
        imagesHtml = '<div class="review-card-images">';
        r.images.forEach(function(img) {
          imagesHtml += '<img src="' + img + '" alt="">';
        });
        imagesHtml += '</div>';
      }

      var avatarHtml = r.avatarText
        ? '<div class="avatar-text">' + r.avatarText + '</div>'
        : '<div class="avatar"><img src="' + r.avatar + '" alt=""></div>';

      html += '<div class="review-card">' +
        avatarHtml +
        '<div class="review-card-main">' +
          '<div class="nickname">' + r.nickname + '</div>' +
          '<div class="review-card-meta">' +
            '<div class="meta-left">' +
              '<div class="stars">' + renderStars(r.stars) + '</div>' +
              '<span class="sep"></span>' +
              '<span class="bought">已购 ' + r.spec + '</span>' +
            '</div>' +
            '<span class="date">' + r.date + '</span>' +
          '</div>' +
          '<div class="review-card-body">' + r.text + '</div>' +
          imagesHtml +
        '</div>' +
      '</div>';
    });
    list.innerHTML = html;
  }

  // Filter tag switching
  document.querySelectorAll('.filter-tag').forEach(function(tag) {
    tag.addEventListener('click', function() {
      document.querySelectorAll('.filter-tag').forEach(function(t) { t.classList.remove('active'); });
      this.classList.add('active');
      currentFilter = this.dataset.filter;
      renderList();
    });
  });

  document.getElementById('filterMore').addEventListener('click', function() {
    document.getElementById('filterBar').classList.toggle('expanded');
  });

  // Spec drawer
  var pendingSku = 'all';
  var skuSelect = document.getElementById('skuSelect');
  var skuSelectLabel = document.getElementById('skuSelectLabel');
  var specOverlay = document.getElementById('specOverlay');
  var specPopup = document.getElementById('specPopup');
  var specSelectedHint = document.getElementById('specSelectedHint');

  function skuLabel(sku) {
    return sku === 'all' ? '全部规格' : sku;
  }

  function syncSpecOptions() {
    document.querySelectorAll('#specOptions .spec-option').forEach(function(o) {
      o.classList.toggle('selected', o.dataset.sku === pendingSku);
    });
    specSelectedHint.textContent = pendingSku === 'all' ? '请选择规格' : ('已选：' + pendingSku);
  }

  function openSpec() {
    pendingSku = currentSku;
    syncSpecOptions();
    specOverlay.classList.add('show');
    specPopup.classList.add('show');
  }

  function closeSpec() {
    specOverlay.classList.remove('show');
    specPopup.classList.remove('show');
  }

  skuSelect.addEventListener('click', openSpec);
  specOverlay.addEventListener('click', closeSpec);
  document.getElementById('specClose').addEventListener('click', closeSpec);

  document.querySelectorAll('#specOptions .spec-option').forEach(function(opt) {
    opt.addEventListener('click', function() {
      pendingSku = this.dataset.sku;
      syncSpecOptions();
    });
  });

  document.getElementById('specClearBtn').addEventListener('click', function() {
    pendingSku = 'all';
    currentSku = 'all';
    skuSelectLabel.textContent = skuLabel(currentSku);
    closeSpec();
    renderList();
  });

  document.getElementById('specConfirmBtn').addEventListener('click', function() {
    currentSku = pendingSku;
    skuSelectLabel.textContent = skuLabel(currentSku);
    closeSpec();
    renderList();
  });

  renderList();
})();
</script>
<script src="../assets/theme-switcher.js"></script>
</body>
</html>
