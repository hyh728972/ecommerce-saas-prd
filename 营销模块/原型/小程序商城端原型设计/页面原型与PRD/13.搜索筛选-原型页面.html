<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>搜索结果 - 苏银豆商城</title>
<link rel="stylesheet" href="../assets/common.css">
<style>
  /* Filter header */
  .filter-header {
    background: var(--card-bg);
    padding: var(--space-md);
    display: flex;
    gap: var(--space-sm);
    border-bottom: 1px solid var(--border-divider);
  }
  .filter-search {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--bg-color);
    border-radius: var(--radius-xl);
    padding: var(--space-sm) 12px;
    gap: var(--space-sm);
  }
  .filter-search svg { width: 16px; height: 16px; color: var(--text-tertiary); }
  .filter-search input {
    flex: 1;
    border: none;
    outline: none;
    font-size: var(--font-base);
    background: transparent;
    color: var(--text-color);
  }
  .filter-search input::placeholder { color: var(--text-muted); }
  .filter-cancel {
    font-size: var(--font-base);
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
  }

  /* Filter tabs */
  .filter-tabs {
    display: flex;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border-divider);
    padding: 0 var(--space-md);
  }
  .filter-tab {
    flex: 1;
    text-align: center;
    padding: var(--space-md) 0;
    font-size: var(--font-base);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-xs);
  }
  .filter-tab:active { background: var(--bg-input); }
  .filter-tab.active { color: var(--primary-start); font-weight: 600; }
  .filter-tab svg { width: 12px; height: 12px; }
  .filter-tab.asc svg { transform: rotate(180deg); }

  /* Filter panel */
  .filter-panel {
    background: var(--card-bg);
    padding: var(--space-lg);
    display: none;
    border-bottom: 1px solid var(--border-divider);
  }
  .filter-panel.show { display: block; }
  .filter-row {
    margin-bottom: var(--space-lg);
  }
  .filter-row:last-child { margin-bottom: 0; }
  .filter-label {
    font-size: var(--font-sm);
    color: var(--text-secondary);
    margin-bottom: var(--space-md);
  }
  .filter-options {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-sm);
  }
  .filter-option {
    padding: var(--space-sm) 14px;
    background: var(--bg-color);
    border-radius: var(--radius-lg);
    font-size: var(--font-sm);
    color: var(--text-secondary);
    cursor: pointer;
  }
  .filter-option:active { background: var(--border-color); }
  .filter-option.active {
    background: var(--selected-bg);
    color: var(--primary-start);
    border: 1px solid var(--primary-start);
  }

  /* Price range */
  .price-range {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
  }
  .price-input {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--bg-color);
    border-radius: var(--radius-sm);
    padding: var(--space-sm) 12px;
  }
  .price-input input {
    width: 100%;
    border: none;
    outline: none;
    font-size: var(--font-base);
    background: transparent;
    color: var(--text-color);
    text-align: center;
  }
  .price-input input::placeholder { color: var(--text-muted); }
  .price-sep {
    color: var(--text-tertiary);
  }

  /* Filter buttons */
  .filter-buttons {
    display: flex;
    gap: var(--space-md);
    margin-top: var(--space-lg);
    padding-top: var(--space-lg);
    border-top: 1px solid var(--bg-color);
  }
  .btn-reset {
    flex: 1;
    padding: var(--space-md);
    border: 1px solid var(--text-disabled);
    border-radius: var(--radius-xl);
    background: var(--card-bg);
    color: var(--text-secondary);
    font-size: var(--font-base);
    cursor: pointer;
  }
  .btn-reset:active { background: var(--bg-color); }
  .btn-apply {
    flex: 2;
    padding: var(--space-md);
    border: none;
    border-radius: var(--radius-xl);
    background: linear-gradient(135deg, var(--primary-start), var(--price-color));
    color: var(--card-bg);
    font-size: var(--font-base);
    cursor: pointer;
  }
  .btn-apply:active { opacity: 0.85; }

  /* Result header */
  .result-header {
    padding: var(--space-md) 16px;
    font-size: var(--font-sm);
    color: var(--text-tertiary);
    background: var(--bg-color);
  }
  .result-header span { color: var(--primary-start); }

  /* Product list */
  .product-list {
    padding: var(--space-md);
  }
  .product-item {
    background: var(--card-bg);
    border-radius: var(--radius-md);
    margin-bottom: var(--space-md);
    display: flex;
    gap: var(--space-md);
    padding: var(--space-md);
    cursor: pointer;
  }
  .product-item:active { opacity: 0.95; }
  .product-img {
    width: 100px;
    height: 100px;
    border-radius: var(--radius-sm);
    overflow: hidden;
    flex-shrink: 0;
    background: var(--bg-input);
  }
  .product-img img { width: 100%; height: 100%; object-fit: cover; }
  .product-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .product-name {
    font-size: var(--font-base);
    color: var(--text-color);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .product-tags {
    display: flex;
    gap: var(--space-xs);
    margin-top: var(--space-sm);
  }
  .product-tag {
    font-size: var(--font-xs);
    padding: 2px var(--space-sm);
    border-radius: var(--radius-xs);
    background: var(--selected-bg);
    color: var(--primary-start);
  }
  .product-bottom {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }
  .product-price {
    font-size: var(--font-lg);
    font-weight: 700;
    color: var(--price-color);
  }
  .product-price small { font-size: var(--font-sm); }
  .product-sales {
    font-size: var(--font-sm);
    color: var(--text-tertiary);
  }

  /* Active filters */
  .active-filters {
    display: flex;
    gap: var(--space-sm);
    padding: var(--space-md) 12px;
    background: var(--card-bg);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .active-filters::-webkit-scrollbar { display: none; }
  .active-filter {
    display: flex;
    align-items: center;
    gap: var(--space-xs);
    padding: var(--space-xs) 10px;
    background: var(--selected-bg);
    border-radius: var(--radius-lg);
    font-size: var(--font-sm);
    color: var(--primary-start);
    white-space: nowrap;
  }
  .active-filter svg { width: 12px; height: 12px; cursor: pointer; }
</style>
</head>
<body>
<div class="phone-frame">

  <!-- Search Header -->
  <div class="filter-header">
    <div class="filter-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="搜索商品" id="searchInput" value="保温杯">
    </div>
    <span class="filter-cancel" onclick="history.back()">取消</span>
  </div>

  <!-- Filter Tabs -->
  <div class="filter-tabs">
    <div class="filter-tab active" data-filter="default">综合</div>
    <div class="filter-tab" data-filter="sales">销量</div>
    <div class="filter-tab" data-filter="price">价格 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>
    <div class="filter-tab" data-filter="filter" id="filterTab">筛选 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></div>
  </div>

  <!-- Filter Panel -->
  <div class="filter-panel" id="filterPanel">
    <div class="filter-row">
      <div class="filter-label">价格区间</div>
      <div class="price-range">
        <div class="price-input"><input type="number" placeholder="最低价" id="minPrice"></div>
        <span class="price-sep">-</span>
        <div class="price-input"><input type="number" placeholder="最高价" id="maxPrice"></div>
      </div>
    </div>
    <div class="filter-row">
      <div class="filter-label">品牌</div>
      <div class="filter-options" id="brandOptions">
        <div class="filter-option active" data-value="all">全部</div>
        <div class="filter-option" data-value="haers">哈尔斯</div>
        <div class="filter-option" data-value="thermos">膳魔师</div>
        <div class="filter-option" data-value="zojirushi">象印</div>
        <div class="filter-option" data-value="tiger">虎牌</div>
      </div>
    </div>
    <div class="filter-row">
      <div class="filter-label">容量</div>
      <div class="filter-options" id="capacityOptions">
        <div class="filter-option active" data-value="all">全部</div>
        <div class="filter-option" data-value="350">350ml</div>
        <div class="filter-option" data-value="500">500ml</div>
        <div class="filter-option" data-value="750">750ml</div>
        <div class="filter-option" data-value="1000">1000ml</div>
      </div>
    </div>
    <div class="filter-row">
      <div class="filter-label">发货地</div>
      <div class="filter-options" id="locationOptions">
        <div class="filter-option active" data-value="all">全部</div>
        <div class="filter-option" data-value="jiangsu">江苏</div>
        <div class="filter-option" data-value="shanghai">上海</div>
        <div class="filter-option" data-value="zhejiang">浙江</div>
        <div class="filter-option" data-value="guangdong">广东</div>
      </div>
    </div>
    <div class="filter-buttons">
      <button class="btn-reset" onclick="resetFilters()">重置</button>
      <button class="btn-apply" onclick="applyFilters()">确定</button>
    </div>
  </div>

  <!-- Active Filters -->
  <div class="active-filters" id="activeFilters" style="display:none;"></div>

  <!-- Scrollable Content -->
  <div class="page-scroll" style="padding-bottom: 16px;">
    <div class="result-header">
      为您找到 <span>128</span> 个相关商品
    </div>
    <div class="product-list" id="productList"></div>
  </div>

</div>
<script src="../assets/common.js"></script>
<script>
(function() {
  // Get keyword from URL
  var urlParams = new URLSearchParams(window.location.search);
  var keyword = urlParams.get('keyword') || '';

  var searchInput = document.getElementById('searchInput');
  if (keyword) {
    searchInput.value = keyword;
  }

  var products = [
    { id: 1, name: '日本进口保温杯 不锈钢真空便携水杯500ml', price: 68, sales: 2863, tags: ['新品', '热销'], img: '../assets/unsplash/1602143407151-7111542de6e8.jpg' },
    { id: 2, name: '膳魔师保温杯 大容量户外运动水壶1000ml', price: 158, sales: 1524, tags: ['旗舰店'], img: '../assets/unsplash/1570831739435-6601aa3fa4fb.jpg' },
    { id: 3, name: '象印保温杯 商务办公不锈钢真空杯350ml', price: 99, sales: 986, tags: ['自营'], img: '../assets/unsplash/1523362628745-0c100150b504.jpg' },
    { id: 4, name: '虎牌保温杯 儿童学生吸管杯500ml', price: 128, sales: 2156, tags: ['儿童专用'], img: '../assets/unsplash/1570586437263-ab629fccc818.jpg' },
    { id: 5, name: '哈尔斯保温杯 户外运动大容量水杯750ml', price: 49, sales: 3521, tags: ['限时特惠'], img: '../assets/unsplash/1548839140-29a749e1cf4d.jpg' }
  ];

  var productList = document.getElementById('productList');
  var filterPanel = document.getElementById('filterPanel');
  var filterTab = document.getElementById('filterTab');
  var activeFilters = document.getElementById('activeFilters');

  // Search input event
  searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      var kw = this.value.trim();
      if (kw) {
        // Update URL and search
        var newUrl = '13.搜索筛选-原型页面.html?keyword=' + encodeURIComponent(kw);
        history.replaceState(null, '', newUrl);
        renderProducts(products);
      }
    }
  });

  function renderProducts(data) {
    var html = '';
    data.forEach(function(item) {
      html += '<a href="21.商品详情-原型页面.html" class="product-item">' +
        '<div class="product-img"><img src="' + item.img + '" alt=""></div>' +
        '<div class="product-info">' +
          '<div>' +
            '<div class="product-name">' + item.name + '</div>' +
            '<div class="product-tags">' +
              item.tags.map(function(t) { return '<span class="product-tag">' + t + '</span>'; }).join('') +
            '</div>' +
          '</div>' +
          '<div class="product-bottom">' +
            '<span class="product-price"><small>&yen;</small>' + item.price + '</span>' +
            '<span class="product-sales">已售' + item.sales + '</span>' +
          '</div>' +
        '</div>' +
      '</a>';
    });
    productList.innerHTML = html;
  }

  // Filter tabs
  document.querySelectorAll('.filter-tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      if (this.dataset.filter === 'filter') {
        filterPanel.classList.toggle('show');
        this.classList.toggle('active');
        return;
      }

      filterPanel.classList.remove('show');
      document.querySelectorAll('.filter-tab').forEach(function(t) {
        if (t.dataset.filter !== 'filter') t.classList.remove('active');
      });
      this.classList.add('active');

      // Toggle sort direction for price/sales
      if (this.dataset.filter === 'price') {
        this.classList.toggle('asc');
      }

      renderProducts(products);
    });
  });

  // Filter options
  document.querySelectorAll('.filter-options').forEach(function(options) {
    options.querySelectorAll('.filter-option').forEach(function(opt) {
      opt.addEventListener('click', function() {
        options.querySelectorAll('.filter-option').forEach(function(o) { o.classList.remove('active'); });
        this.classList.add('active');
      });
    });
  });

  function resetFilters() {
    document.querySelectorAll('.filter-options').forEach(function(options) {
      options.querySelectorAll('.filter-option').forEach(function(opt, idx) {
        opt.classList.toggle('active', idx === 0);
      });
    });
    document.getElementById('minPrice').value = '';
    document.getElementById('maxPrice').value = '';
  }

  function applyFilters() {
    filterPanel.classList.remove('show');
    filterTab.classList.remove('active');

    // Build active filters display
    var filters = [];
    var minPrice = document.getElementById('minPrice').value;
    var maxPrice = document.getElementById('maxPrice').value;
    if (minPrice || maxPrice) {
      filters.push({ label: (minPrice || '0') + '-' + (maxPrice || '∞') + '元', type: 'price' });
    }

    if (filters.length > 0) {
      activeFilters.style.display = 'flex';
      var html = '';
      filters.forEach(function(f) {
        html += '<div class="active-filter">' +
          '<span>' + f.label + '</span>' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
        '</div>';
      });
      activeFilters.innerHTML = html;
    } else {
      activeFilters.style.display = 'none';
    }

    renderProducts(products);
  }

  window.resetFilters = resetFilters;
  window.applyFilters = applyFilters;

  renderProducts(products);
})();
</script>
<script src="../assets/theme-switcher.js"></script>
</body>
</html>
