<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>组合商品详情 - 供应链管理平台</title>
<style>
:root {
  --bg-app: #f4f3f0; --bg-sidebar: #1e1e22; --bg-surface: #ffffff;
  --bg-hover: #f7f6f4; --bg-input: #f9f8f7;
  --border: #e6e4e0; --border-light: #f0eeeb;
  --text-primary: #1a1a1c; --text-secondary: #6b6b70; --text-muted: #99999d;
  --text-sidebar: #c4c4c9; --text-sidebar-active: #ffffff;
  --accent: #2d2d33; --accent-soft: #f0eeeb;
  --red: #da3e3a; --red-bg: #fef4f3; --red-border: #fcd9d7;
  --orange: #d97706; --orange-bg: #fffbf0; --orange-border: #fde8c4;
  --blue: #2563eb; --blue-bg: #f5f8ff; --blue-border: #d4e0fc;
  --green: #16a34a; --green-bg: #f4fdf6; --green-border: #c6f0d4;
  --purple: #7c3aed; --purple-bg: #f8f4ff; --purple-border: #e0d4fc;
  --gray: #6b7280; --gray-bg: #f8f8f7; --gray-border: #e8e6e3;
  --radius-sm: 4px; --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg: 0 4px 16px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.04);
  --transition: 160ms ease;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Microsoft YaHei",sans-serif;background:var(--bg-app);color:var(--text-primary);display:flex;min-height:100vh;-webkit-font-smoothing:antialiased;}

/* ===== Sidebar ===== */
.sidebar{width:232px;min-width:232px;background:var(--bg-sidebar);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:10;}
.sidebar-brand{padding:20px 20px 28px;border-bottom:1px solid rgba(255,255,255,.06);}
.sidebar-brand .logo{font-size:17px;font-weight:600;color:#fff;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;}
.sidebar-brand .sub{font-size:11px;color:var(--text-sidebar);margin-top:2px;letter-spacing:.02em;}
.sidebar-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px;}
.nav-section-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.25);padding:14px 10px 6px;display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;}
.nav-section-label:hover{color:rgba(255,255,255,.45);}
.section-arrow{font-size:8px;transition:transform .2s ease;flex-shrink:0;}
.nav-section.collapsed .section-arrow{transform:rotate(-90deg);}
.nav-section.collapsed .nav-section-items{display:none;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:var(--text-sidebar);font-size:13.5px;cursor:pointer;transition:all var(--transition);text-decoration:none;letter-spacing:.01em;}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff;}
.nav-item.active{background:rgba(255,255,255,.10);color:#fff;font-weight:500;}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:600;padding:1px 7px;border-radius:10px;min-width:20px;text-align:center;line-height:18px;}
.nav-icon{width:18px;height:18px;opacity:.55;flex-shrink:0;}
.nav-item.active .nav-icon{opacity:1;}

/* ===== Main ===== */
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:52px;min-height:52px;background:var(--bg-surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:16px;z-index:5;}
.topbar .breadcrumb{font-size:12.5px;color:var(--text-muted);letter-spacing:.01em;}
.topbar .breadcrumb span{color:var(--text-primary);font-weight:500;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:16px;}
.user-avatar{width:30px;height:30px;border-radius:50%;background:#e6e4e0;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);}

/* ===== Content ===== */
.content{flex:1;display:flex;flex-direction:column;padding:20px 28px 30px;overflow-y:auto;position:relative;}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;padding:5px 12px;border-radius:var(--radius-sm);font-size:12px;font-family:inherit;cursor:pointer;border:1px solid transparent;transition:all var(--transition);white-space:nowrap;font-weight:500;gap:5px;}
.btn-sm{padding:4px 10px;font-size:11.5px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{opacity:.85;}
.btn-outline{border-color:var(--border);color:var(--text-primary);background:var(--bg-surface);}
.btn-outline:hover{border-color:var(--text-muted);background:var(--bg-hover);}
.btn-link{color:var(--blue);border:none;background:none;padding:2px 4px;cursor:pointer;font-size:12px;font-family:inherit;transition:opacity var(--transition);}
.btn-link:hover{opacity:.75;}

/* ===== Edit Mode (CSS-driven) ===== */
.edit-only{display:none;}
body.edit-mode .edit-only{display:inline-block;}
body.edit-mode .view-only{display:none;}
.inline-edit{font-size:13px;font-family:inherit;border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 8px;outline:none;width:100%;max-width:300px;color:var(--text-primary);background:var(--bg-surface);transition:border-color var(--transition);}
.inline-edit:focus{border-color:var(--accent);}

/* ===== Tabs ===== */
.tabs{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--border);margin-bottom:0;}
.tab{padding:10px 20px;font-size:13.5px;font-weight:500;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;transition:all var(--transition);font-family:inherit;background:none;border-top:none;border-left:none;border-right:none;}
.tab.active{color:var(--text-primary);border-bottom-color:var(--accent);}
.tab:hover:not(.active){color:var(--text-secondary);}
.demo-toggle{display:flex;gap:6px;align-items:center;margin-left:auto;padding-right:4px;}
.demo-toggle label{font-size:11px;color:var(--text-muted);}
.demo-toggle select{font-size:11px;padding:2px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-surface);font-family:inherit;}

/* ===== View ===== */
.view{display:none;flex-direction:column;}
.view.active{display:flex;}

/* ===== Summary Bar ===== */
.summary-bar{display:flex;align-items:center;gap:16px;padding:14px 20px;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-top:12px;margin-bottom:16px;}
.summary-bar .thumb{width:52px;height:52px;border-radius:var(--radius-sm);background:var(--bg-input);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;border:1px solid var(--border-light);overflow:hidden;}
.summary-bar .info{flex:1;display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13px;align-items:center;}
.summary-bar .info .name{font-weight:600;font-size:15px;}
.summary-bar .info .code{font-family:"Microsoft YaHei",sans-serif;font-size:12px;color:var(--text-muted);}
.summary-bar .info .sep{color:var(--border);}
.summary-bar .info .meta{color:var(--text-muted);font-size:12.5px;}
.summary-bar .info .meta strong{color:var(--text-primary);font-weight:600;}

/* ===== Section Card ===== */
.section-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:14px;}
.section-card .section-title{font-size:12px;font-weight:600;color:var(--text-muted);letter-spacing:.03em;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.section-card .section-title::before{content:'';width:3px;height:14px;border-radius:2px;background:var(--accent);}
.section-card .section-title .lock-hint{font-size:11px;color:var(--text-muted);font-weight:400;margin-left:auto;}
.info-grid{display:flex;flex-direction:column;gap:0;}
.info-grid .info-row{display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--border-light);}
.info-grid .info-row:last-child{border-bottom:none;}
.info-grid .info-row .lbl{color:var(--text-muted);font-size:12px;width:110px;flex-shrink:0;font-weight:500;line-height:1.8;}
.info-grid .info-row .val{color:var(--text-primary);font-weight:500;font-size:13px;flex:1;min-width:0;line-height:1.8;}
.info-grid .info-row .val.code{font-family:"Microsoft YaHei",sans-serif;font-size:12px;}
.info-grid .info-row .val.muted{color:var(--text-muted);font-weight:400;}

/* ===== Stats Cards (聚合指标) ===== */
.stats-row{display:grid;grid-template-columns:1fr;gap:12px;}
.stats-card{background:transparent;border:none;border-radius:0;padding:10px 0;border-bottom:1px solid var(--border-light);display:flex;flex-direction:column;gap:2px;}
.stats-card:last-child{border-bottom:none;}
.stats-card .card-title{font-size:11.5px;color:var(--text-muted);letter-spacing:.02em;}
.stats-card .card-value{font-size:20px;font-weight:600;color:var(--text-primary);}
.stats-card .card-value.price{font-family:"Microsoft YaHei",sans-serif;color:var(--orange);}
.stats-card .card-sub{font-size:11.5px;color:var(--text-muted);}

/* ===== Table ===== */
.table-wrap{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{background:#fafaf9;text-align:left;padding:10px 12px;font-weight:500;font-size:12px;color:var(--text-muted);letter-spacing:.02em;border-bottom:1px solid var(--border);white-space:nowrap;}
thead th:first-child{padding-left:18px;}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border-light);vertical-align:middle;}
tbody td:first-child{padding-left:18px;}
tbody tr{transition:background var(--transition);}
tbody tr:hover{background:var(--bg-hover);}
tbody tr:last-child td{border-bottom:none;}
.price{font-family:"Microsoft YaHei",sans-serif;font-size:12.5px;}
.cell-muted{color:var(--text-muted);font-size:12px;}
.role-tag{display:inline-flex;align-items:center;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:600;}
.role-tag.main{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border);}
.role-tag.bundle{background:var(--gray-bg);color:var(--gray);border:1px solid var(--gray-border);}
.role-tag.gift{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border);}
/* BOM 表 sticky 列（参考单品 SKU 表） */
.bom-table-wrap .table-scroll{overflow-x:auto;}
.bom-table-wrap table{min-width:2130px;}
.bom-table-wrap th.sticky-left,.bom-table-wrap td.sticky-left{position:sticky;left:0;z-index:2;background:var(--bg-surface);box-shadow:2px 0 4px rgba(0,0,0,.04);}
.bom-table-wrap th.sticky-right,.bom-table-wrap td.sticky-right{position:sticky;right:0;z-index:2;background:var(--bg-surface);box-shadow:-2px 0 4px rgba(0,0,0,.04);}
.bom-table-wrap thead th.sticky-left,.bom-table-wrap thead th.sticky-right{background:#fafaf9;z-index:3;}
.bom-table-wrap tbody tr:hover td.sticky-left,.bom-table-wrap tbody tr:hover td.sticky-right{background:var(--bg-hover);}

/* ===== Tag ===== */
.tag{display:inline-flex;align-items:center;padding:2px 10px;border-radius:100px;font-size:11.5px;font-weight:500;letter-spacing:.01em;white-space:nowrap;gap:4px;}
.tag-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border);}
.tag-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);}
.tag-blue{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border);}
.tag-gray{background:var(--gray-bg);color:var(--gray);border:1px solid var(--gray-border);}
.tag-orange{background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange-border);}
.tag-purple{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border);}

/* ===== Copy icon btn ===== */
.copy-icon-btn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;padding:0;border:none;background:transparent;color:var(--text-muted);cursor:pointer;border-radius:4px;flex-shrink:0;vertical-align:middle;transition:color var(--transition),background var(--transition);opacity:0;visibility:hidden;}
.copy-icon-btn:hover{opacity:1;visibility:visible;color:var(--text-secondary);background:var(--bg-hover);}
tr:hover .copy-icon-btn{opacity:1;visibility:visible;}
.copy-icon-btn svg{display:block;pointer-events:none;}

/* ===== Thumb strip ===== */
.thumb-strip{display:flex;gap:8px;margin-top:8px;}
.thumb-strip .tmb{width:72px;height:72px;border-radius:var(--radius-sm);background:var(--bg-input);border:1px solid var(--border-light);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-muted);overflow:hidden;}

/* ===== Filter Bar ===== */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 16px;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:14px;}
.filter-bar select,.filter-bar input{height:34px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:var(--bg-surface);color:var(--text-primary);outline:none;transition:border-color var(--transition);}
.filter-bar select{min-width:140px;}
.filter-bar select:focus,.filter-bar input:focus{border-color:var(--accent);}
.filter-bar .filter-extra{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text-muted);}
.btn-reset{height:36px;padding:0 14px;background:transparent;color:var(--text-secondary);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;cursor:pointer;transition:all var(--transition);}
.btn-reset:hover{border-color:var(--text-muted);color:var(--text-primary);}

/* ===== Log dot ===== */
.log-type-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;flex-shrink:0;}
.log-type-dot.gray{background:var(--gray);}
.log-type-dot.green{background:var(--green);}
.log-type-dot.blue{background:var(--blue);}
.log-type-dot.purple{background:var(--purple);}
.log-type-dot.orange{background:var(--orange);}

/* ===== Empty State ===== */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;color:var(--text-muted);font-size:14px;text-align:center;gap:12px;}
.empty-state .empty-icon{font-size:48px;opacity:.3;}
.empty-state h3{font-size:15px;color:var(--text-secondary);font-weight:500;}
.empty-state p{font-size:12.5px;}

/* ===== Toast ===== */
.toast-container{position:fixed;top:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--bg-sidebar);color:#fff;padding:12px 18px;border-radius:var(--radius);font-size:13px;box-shadow:var(--shadow-lg);animation:toastIn .25s ease;display:flex;align-items:center;gap:8px;}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}
.toast.success{border-left:3px solid var(--green);}
.toast.info{border-left:3px solid var(--blue);}
.toast.warn{border-left:3px solid var(--orange);}

.hidden{display:none !important;}
.muted{color:var(--text-muted);}
</style>
</head>
<body class="tab1">

<!-- ===== Sidebar ===== -->
<aside class="sidebar" id="app-sidebar"></aside>

<!-- ===== Main ===== -->
<main class="main">
  <div class="topbar">
    <div class="breadcrumb">商品管理 / 组合商品管理 / <span>组合商品详情</span></div>
    <div class="topbar-right">
      <span style="font-size:12px;color:var(--text-muted);">采购专员</span>
      <div class="user-avatar">李</div>
    </div>
  </div>

  <div class="content" id="contentArea">
    <!-- Tabs + 演示切换 + 编辑按钮 -->
    <div class="tabs">
      <button class="tab active" data-tab="tab1">组合信息</button>
      <button class="tab" data-tab="tab2">履约信息</button>
      <button class="tab" data-tab="tab3">商品日志</button>
      <span class="demo-toggle">
        <label>演示状态：</label>
        <select id="statusSwitcher" onchange="switchDemoStatus(this.value)">
          <option value="published">已发布</option>
          <option value="pending">待审批</option>
          <option value="draft">草稿</option>
        </select>
      </span>
      <span id="editActions" style="display:flex;align-items:center;gap:8px;padding-left:8px;"></span>
    </div>

    <!-- Summary Bar -->
    <div class="summary-bar" id="summaryBar">
      <div class="thumb" id="summaryThumb" style="display:flex;align-items:center;justify-content:center;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity=".25"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
      </div>
      <div class="info">
        <span class="name" id="summaryName">—</span>
        <span class="sep">|</span>
        <span class="meta">供应链SPU编码: <strong class="code" id="summaryCode">—</strong></span>
        <span class="sep">|</span>
        <span class="meta">品牌: <strong id="summaryBrand">—</strong></span>
        <span class="sep">|</span>
        <span class="meta">类目: <strong id="summaryCat">—</strong></span>
      </div>
    </div>

    <!-- ========== TAB1: 组合信息 ========== -->
    <div class="view active" id="tab1">
      <!-- 基本信息 + 聚合指标 同行 -->
      <div style="display:flex;gap:14px;align-items:stretch;">
        <!-- 组合基本信息 -->
        <div class="section-card" style="flex:1;min-width:0;">
          <div class="section-title">组合基本信息</div>
          <div style="display:flex;gap:24px;">
            <div style="flex-shrink:0;">
              <div style="width:270px;height:270px;border:1px solid var(--border);border-radius:var(--radius);background:#f3eefa;display:flex;align-items:center;justify-content:center;font-size:80px;font-weight:600;color:var(--purple);" id="comboCover">Z</div>
            </div>
            <div class="info-grid" id="comboProps" style="flex:1;min-width:0;"></div>
          </div>
        </div>
        <!-- 聚合指标 -->
        <div class="section-card" style="width:340px;flex-shrink:0;">
          <div class="section-title">聚合指标</div>
          <div class="stats-row" id="aggStats"></div>
        </div>
      </div>

      <!-- BOM 子件清单 -->
      <div class="section-card">
        <div class="section-title">
          BOM 子件清单
          <span class="lock-hint">🔒 BOM 结构锁定（子件/用量/角色不可改），仅「推荐供应商」可切换</span>
        </div>
        <div class="table-wrap bom-table-wrap">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th width="300" class="sticky-left">子件商品信息</th>
                  <th width="80">角色</th>
                  <th width="70">用量</th>
                  <th width="190">推荐供应商 <span style="font-weight:400;color:var(--text-muted);">(可切换)</span></th>
                  <th width="150">含税含运一件代发供货价(元)</th>
                  <th width="180">SKU商品条形码(69开头)</th>
                  <th width="130">一件代发发货时效</th>
                  <th width="90">库存</th>
                  <th width="100">电商价</th>
                  <th width="120">商品链接</th>
                  <th width="90">计量单位</th>
                  <th width="110">物流重量</th>
                  <th width="120">物流模板</th>
                  <th width="100">供货状态</th>
                  <th width="90" class="sticky-right">操作</th>
                </tr>
              </thead>
              <tbody id="bomTbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 商品内容（封面/详情图） -->
      <div class="section-card">
        <div class="section-title">商品内容</div>
        <div id="comboContent"></div>
      </div>
    </div>

    <!-- ========== TAB2: 履约信息 ========== -->
    <div class="view" id="tab2">
      <div class="empty-state">
        <div class="empty-icon">📦</div>
        <h3>暂时未上线，敬请期待</h3>
        <p>组合商品的订单履约 / 拆单信息将在履约链路上线后展示</p>
      </div>
    </div>

    <!-- ========== TAB3: 商品日志 ========== -->
    <div class="view" id="tab3">
      <div class="filter-bar">
        <select id="logTypeFilter" onchange="renderLogTable()">
          <option value="">全部类型</option>
          <option value="组合商品创建">组合商品创建</option>
          <option value="提交审批">提交审批</option>
          <option value="审批通过">审批通过</option>
          <option value="子件供方变更">子件供方变更</option>
          <option value="信息编辑">信息编辑</option>
        </select>
        <button class="btn-reset" onclick="resetLogFilter()">重置</button>
        <div class="filter-extra" id="logResultInfo"></div>
      </div>
      <div class="table-wrap">
        <div class="table-scroll">
          <table>
            <thead><tr><th>时间</th><th>操作类型</th><th>操作人</th><th>内容</th><th>变更</th></tr></thead>
            <tbody id="logTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<script src="../assets/common-copy-btn.js"></script>
<script>
// ========================================
// DATA (mock，基于 05 列表 c1 扩展为完整详情)
// ========================================
const combo = {
  id:'c1', name:'3M防护标准套装', code:'ZDZH-A00001', sku:'HZZH-A00001-001', comboMode:'combo',
  brand:'3M', catL3:'劳保用品 > 防护口罩 > KN95口罩',
  status:'published',
  creator:'王芳', created:'2026-06-20 10:00',
  shippingNote:'24h内发货，套装独立包装，附赠品贺卡',
  components:[
    { role:'主件', name:'3M 9001V KN95口罩', spec:'{白,常规}', supplySku:'HZ-A00001-001', qty:1,
      barcode:'6938123456789', ecomPrice:'129.00', ecomLink:'tmall.com/xxx', unit:'个', weight:'0.05', taxRate:'13%', logisticsTpl:'标准快递',
      suppliers:[
        {name:'星辰商贸', price:'15.00', preferred:true, status:'合作中', moq:100, leadTime:'3天', stock:5000},
        {name:'恒通供应链', price:'16.80', preferred:false, status:'合作中', moq:200, leadTime:'2天', stock:8000},
        {name:'环球优选', price:'14.00', preferred:false, status:'合作中', moq:150, leadTime:'4天', stock:4000}
      ], selectedSupp:0 },
    { role:'配件', name:'3M护目镜 防雾防尘', spec:'{标准}', supplySku:'HZ-B00002-001', qty:1,
      barcode:'6938123456701', ecomPrice:'79.00', ecomLink:'jd.com/xxx', unit:'个', weight:'0.20', taxRate:'13%', logisticsTpl:'标准快递',
      suppliers:[
        {name:'星辰商贸', price:'25.00', preferred:true, status:'合作中', moq:50, leadTime:'2天', stock:1200},
        {name:'鹏程优品', price:'23.00', preferred:false, status:'合作中', moq:100, leadTime:'3天', stock:2000}
      ], selectedSupp:0 }
  ],
  logs:[
    {time:'2026-06-20 10:00', type:'组合商品创建', dot:'gray', actor:'王芳', content:'创建组合商品「3M防护标准套装」', change:'组合套装 · 含2款商品，共2件'},
    {time:'2026-06-20 11:30', type:'提交审批', dot:'blue', actor:'王芳', content:'提交审批', change:''},
    {time:'2026-06-21 09:30', type:'审批通过', dot:'green', actor:'陈主任（审批管理）', content:'审批通过，组合商品已入池', change:'ZDZH-A00001 入供应链商品池'},
    {time:'2026-07-12 14:20', type:'子件供方变更', dot:'purple', actor:'王芳', content:'子件「3M护目镜」切换供方：鹏程优品 → 星辰商贸', change:'供货价 ¥23.00 → ¥25.00'},
    {time:'2026-07-15 10:00', type:'信息编辑', dot:'gray', actor:'王芳', content:'修改订单发货备注', change:'追加「附赠品贺卡」'}
  ]
};

const STATUS_MAP = {
  draft:{label:'草稿',cls:'tag-gray'},
  pending:{label:'待审批',cls:'tag-orange'},
  published:{label:'已发布',cls:'tag-green'}
};

// ========================================
// 聚合计算
// ========================================
function aggSupplyPrice(){
  return combo.components.reduce(function(s,c){
    var sup = c.suppliers[c.selectedSupp];
    return s + parseFloat(sup.price) * c.qty;
  }, 0).toFixed(2);
}
function aggStock(){
  return Math.min.apply(null, combo.components.map(function(c){ var sup=c.suppliers[c.selectedSupp]; return Math.floor((sup.stock||0) / c.qty); }));
}
function supplierCount(){
  var set = {};
  combo.components.forEach(function(c){ set[c.suppliers[c.selectedSupp].name] = true; });
  return Object.keys(set).length;
}

// ========================================
// EDIT MODE
// ========================================
function inEditMode(){ return document.body.classList.contains('edit-mode'); }
function renderEditActions(){
  var el = document.getElementById('editActions');
  if(combo.status === 'pending'){
    el.innerHTML = '<span style="font-size:12px;color:var(--text-muted);">待审批中，不可编辑</span>';
    return;
  }
  el.innerHTML = inEditMode()
    ? '<button class="btn btn-outline btn-sm" onclick="cancelEdit()">取消</button> <button class="btn btn-primary btn-sm" onclick="saveEdit()">保存</button>'
    : '<button class="btn btn-outline btn-sm" onclick="enterEdit()">编辑</button>';
}
function enterEdit(){
  document.body.classList.add('edit-mode');
  renderEditActions();
  renderComboProps();
  renderBom();
  renderContent();
  toast('已进入编辑模式，BOM 结构锁定，仅供方可切换','info');
}
function cancelEdit(){
  document.body.classList.remove('edit-mode');
  renderEditActions();
  renderAll();
  toast('已取消编辑','info');
}
function saveEdit(){
  // 读取可编辑字段
  var nameEl = document.querySelector('.inline-edit[data-field="name"]');
  if(nameEl) combo.name = nameEl.value.trim() || combo.name;
  var noteEl = document.querySelector('.inline-edit[data-field="shippingNote"]');
  if(noteEl) combo.shippingNote = noteEl.value.trim();
  // 读取 BOM 供方下拉
  combo.components.forEach(function(c,idx){
    var sel = document.getElementById('suppSel_'+idx);
    if(sel) c.selectedSupp = parseInt(sel.value);
  });
  document.body.classList.remove('edit-mode');
  renderEditActions();
  renderAll();
  toast('保存成功，聚合供货价已重算','success');
}

// 演示状态切换
function switchDemoStatus(s){
  if(inEditMode()){ document.getElementById('statusSwitcher').value = combo.status; toast('请先保存或取消编辑','warn'); return; }
  combo.status = s;
  renderEditActions();
  renderSummary();
  renderComboProps();
  toast('已切换演示状态：' + STATUS_MAP[s].label, 'info');
}

// ========================================
// RENDER
// ========================================
function renderAll(){
  renderSummary();
  renderComboProps();
  renderAggStats();
  renderBom();
  renderContent();
  renderLogTable();
}

function renderSummary(){
  document.getElementById('summaryName').textContent = combo.name;
  document.getElementById('summaryCode').textContent = combo.code;
  document.getElementById('summaryBrand').textContent = combo.brand;
  document.getElementById('summaryCat').textContent = combo.catL3;
}

function renderComboProps(){
  var st = STATUS_MAP[combo.status];
  var modeStr = combo.comboMode === 'gift' ? '营销买赠' : '组合套装';
  var html = '';
  html += '<div class="info-row"><span class="lbl">组合商品名称</span><span class="val"><span class="view-only">' + combo.name + '</span><input class="edit-only inline-edit" data-field="name" value="' + combo.name + '"></span></div>';
  html += '<div class="info-row"><span class="lbl">供应链SKU</span><span class="val code">' + (combo.sku || '—') + '</span></div>';
  html += '<div class="info-row"><span class="lbl">组合模式</span><span class="val"><span class="tag tag-purple">' + modeStr + '</span></span></div>';
  html += '<div class="info-row"><span class="lbl">所属品牌</span><span class="val">' + combo.brand + '</span></div>';
  html += '<div class="info-row"><span class="lbl">系统类目</span><span class="val">' + combo.catL3 + '</span></div>';
  html += '<div class="info-row"><span class="lbl">状态</span><span class="val"><span class="tag ' + st.cls + '">' + st.label + '</span></span></div>';
  html += '<div class="info-row"><span class="lbl">创建人</span><span class="val muted">' + combo.creator + '</span></div>';
  html += '<div class="info-row"><span class="lbl">创建时间</span><span class="val muted">' + combo.created + '</span></div>';
  html += '<div class="info-row"><span class="lbl">订单发货备注</span><span class="val"><span class="view-only">' + (combo.shippingNote || '—') + '</span><input class="edit-only inline-edit" data-field="shippingNote" value="' + (combo.shippingNote||'') + '"></span></div>';
  document.getElementById('comboProps').innerHTML = html;
}

function renderAggStats(){
  var supplyStatus = '<span class="tag tag-green">正常供货</span>';
  var html = '';
  html += '<div class="stats-card"><div class="card-title">聚合供货价（Σ 子件供方价 × 用量）</div><div class="card-value price">¥' + aggSupplyPrice() + '</div></div>';
  html += '<div class="stats-card"><div class="card-title">瓶颈库存（min(子件库存 ÷ 用量)）</div><div class="card-value">' + aggStock().toLocaleString() + '</div></div>';
  html += '<div class="stats-card"><div class="card-title">子件款数（主件 + 配件）</div><div class="card-value">' + combo.components.length + ' 款</div></div>';
  html += '<div class="stats-card"><div class="card-title">涉及供方（当前选定供方）</div><div class="card-value">' + supplierCount() + ' 家</div></div>';
  html += '<div class="stats-card"><div class="card-value" style="font-size:15px;">' + supplyStatus + '</div></div>';
  document.getElementById('aggStats').innerHTML = html;
}

function renderBom(){
  var html = '';
  combo.components.forEach(function(c, idx){
    var sup = c.suppliers[c.selectedSupp];
    var roleCls = c.role === '主件' ? 'main' : (c.role === '赠品' ? 'gift' : 'bundle');
    var specDisplay = c.spec.replace(/[{}]/g,'');
    html += '<tr>';
    // 1. 子件商品信息 (sticky-left)
    html += '<td class="sticky-left" style="padding:8px 12px;">';
    html += '<div style="display:flex;gap:10px;align-items:center;">';
    html += '<div style="width:44px;height:44px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-input);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-muted);">' + c.name.charAt(0) + '</div>';
    html += '<div style="flex:1;min-width:0;">';
    html += '<div style="font-weight:500;font-size:13px;line-height:1.5;">' + c.name + ' ' + specDisplay + '</div>';
    html += '<div style="font-family:"Microsoft YaHei",sans-serif;font-size:11px;color:var(--text-muted);line-height:1.5;">' + c.supplySku + copyIconButton("copyText('" + c.supplySku + "','已复制子件供应链SKU')",'复制') + '</div>';
    html += '</div></div></td>';
    // 2. 角色
    html += '<td><span class="role-tag ' + roleCls + '">' + c.role + '</span></td>';
    // 3. 用量
    html += '<td>×' + c.qty + '</td>';
    // 4. 供方（可切换）
    html += '<td>';
    html += '<span class="view-only">' + sup.name + (sup.preferred ? ' <span class="tag tag-green" style="padding:1px 5px;font-size:10px;">优选</span>' : '') + '</span>';
    html += '<select class="edit-only inline-edit" id="suppSel_' + idx + '" style="max-width:160px;">';
    c.suppliers.forEach(function(s,si){
      html += '<option value="' + si + '"' + (si === c.selectedSupp ? ' selected' : '') + '>' + s.name + (s.preferred ? '(优选)' : '') + ' ¥' + s.price + '</option>';
    });
    html += '</select></td>';
    // 5. 供方供货价
    html += '<td><span class="price">¥' + sup.price + '</span></td>';
    // 6. SKU条码
    html += '<td><span style="font-family:"Microsoft YaHei",sans-serif;font-size:11.5px;">' + (c.barcode||'—') + '</span></td>';
    // 7. 发货时效
    html += '<td>' + (sup.leadTime||'—') + '</td>';
    // 9. 库存
    html += '<td>' + (sup.stock||0).toLocaleString() + '</td>';
    // 10. 电商价
    html += '<td>' + (c.ecomPrice ? '<span class="price">¥' + c.ecomPrice + '</span>' : '<span class="cell-muted">—</span>') + '</td>';
    // 11. 商品链接
    html += '<td>' + (c.ecomLink ? '<span style="color:var(--blue);cursor:pointer;font-size:12px;" onclick="window.open(\'#\',\'_blank\')">点击跳转</span>' : '<span class="cell-muted">—</span>') + '</td>';
    // 12. 计量单位
    html += '<td>' + (c.unit||'—') + '</td>';
    // 13. 物流重量
    html += '<td>' + (c.weight ? c.weight + ' kg' : '—') + '</td>';
    // 15. 物流模板
    html += '<td>' + (c.logisticsTpl||'—') + '</td>';
    // 16. 供货状态
    html += '<td>' + (sup.stock === 0 ? '<span class="tag tag-red">供应商下架</span>' : '<span class="tag tag-green">正常供货</span>') + '</td>';
    // 17. 操作 (sticky-right)
    html += '<td class="sticky-right"><button class="btn-link" onclick="window.open(\'04a.供应链商品详情页-原型页面.html\',\'_blank\')">查看</button></td>';
    html += '</tr>';
  });
  document.getElementById('bomTbody').innerHTML = html;
}

function renderContent(){
  var html = '';
  html += '<div style="margin-bottom:12px;"><strong style="font-size:13px;">组合封面主图集</strong> <span class="cell-muted">[共3张]</span> <button class="btn-link edit-only" onclick="toast(\'管理组合封面主图集（演示）\',\'info\')">[管理]</button></div>';
  html += '<div class="thumb-strip"><div class="tmb">封面1</div><div class="tmb">封面2</div><div class="tmb">封面3</div></div>';
  html += '<div style="margin-top:14px;margin-bottom:12px;"><strong style="font-size:13px;">组合详情图</strong> <span class="cell-muted">[SKU详情图]</span> <button class="btn-link edit-only" onclick="toast(\'上传组合详情图（演示）\',\'info\')">[更换]</button></div>';
  html += '<div style="font-size:12px;color:var(--text-muted);background:var(--bg-input);padding:20px;border-radius:var(--radius-sm);text-align:center;">图文详情</div>';
  document.getElementById('comboContent').innerHTML = html;
}

function renderLogTable(){
  var typeFilter = document.getElementById('logTypeFilter').value;
  var logs = combo.logs;
  if(typeFilter) logs = logs.filter(function(l){ return l.type === typeFilter; });
  if(logs.length === 0){
    document.getElementById('logTbody').innerHTML = '<tr><td colspan="5"><div class="empty-state" style="padding:40px;"><div class="empty-icon">📋</div>暂无操作记录</div></td></tr>';
    document.getElementById('logResultInfo').textContent = '0 条';
    return;
  }
  var html = '';
  logs.forEach(function(l){
    html += '<tr>';
    html += '<td>' + l.time + '</td>';
    html += '<td><span class="log-type-dot ' + l.dot + '"></span>' + l.type + '</td>';
    html += '<td>' + l.actor + '</td>';
    html += '<td>' + l.content + '</td>';
    html += '<td class="cell-muted">' + (l.change || '—') + '</td>';
    html += '</tr>';
  });
  document.getElementById('logTbody').innerHTML = html;
  document.getElementById('logResultInfo').textContent = logs.length + ' 条';
}

function resetLogFilter(){
  document.getElementById('logTypeFilter').value = '';
  renderLogTable();
}

// ========================================
// TOAST + COPY
// ========================================
function copyText(text,msg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(msg,'success'); });
  } else { toast(msg,'info'); }
}
function toast(msg, type){
  type = type || 'info';
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(function(){ el.remove(); }, 2500);
}

// ========================================
// INIT
// ========================================
document.addEventListener('DOMContentLoaded', function(){
  // Tab switching
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
      this.classList.add('active');
      document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
      document.getElementById(this.dataset.tab).classList.add('active');
      document.body.classList.remove('tab1','tab2','tab3');
      document.body.classList.add(this.dataset.tab);
    });
  });
  renderEditActions();
  renderAll();
});
</script>
