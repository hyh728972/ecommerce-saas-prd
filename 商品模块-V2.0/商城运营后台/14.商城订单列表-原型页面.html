<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商城订单列表 - 商城运营平台</title>
<style>
:root {
  --bg-app:#f4f3f0; --bg-sidebar:#1e1e22; --bg-surface:#ffffff; --bg-hover:#f7f6f4; --bg-input:#f9f8f7;
  --border:#e6e4e0; --border-light:#f0eeeb;
  --text-primary:#1a1a1c; --text-secondary:#6b6b70; --text-muted:#99999d; --text-sidebar:#c4c4c9;
  --accent:#2d2d33; --accent-soft:#f0eeeb;
  --blue:#2563eb; --blue-bg:#f5f8ff; --blue-border:#d4e0fc;
  --red:#da3e3a; --red-bg:#fef4f3; --red-border:#fcd9d7;
  --green:#16a34a; --green-bg:#f4fdf6; --green-border:#c6f0d4;
  --orange:#d97706; --orange-bg:#fffbf0; --orange-border:#fde8c4;
  --purple:#7c3aed; --purple-bg:#faf8ff; --purple-border:#e4dcfc;
  --gray:#6b7280; --gray-bg:#f8f8f7; --gray-border:#e8e6e3;
  --radius-sm:4px; --radius:8px; --radius-lg:12px;
  --shadow:0 1px 3px rgba(0,0,0,.06); --shadow-lg:0 4px 16px rgba(0,0,0,.10);
  --transition:160ms ease;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Microsoft YaHei",sans-serif;background:var(--bg-app);color:var(--text-primary);display:flex;min-height:100vh;-webkit-font-smoothing:antialiased;}
.sidebar{width:232px;min-width:232px;background:var(--bg-sidebar);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:10;}
.sidebar-brand{padding:20px 20px 28px;border-bottom:1px solid rgba(255,255,255,.06);}
.sidebar-brand .logo{font-size:17px;font-weight:600;color:#fff;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;}
.sidebar-brand .sub{font-size:11px;color:var(--text-sidebar);margin-top:2px;}
.sidebar-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px;}
.nav-section-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.25);padding:14px 10px 6px;display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;}
.nav-section-label:hover{color:rgba(255,255,255,.45);}
.section-arrow{font-size:8px;transition:transform .2s ease;flex-shrink:0;}
.nav-section.collapsed .section-arrow{transform:rotate(-90deg);}
.nav-section.collapsed .nav-section-items{display:none;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:var(--text-sidebar);font-size:13.5px;cursor:pointer;transition:all var(--transition);text-decoration:none;letter-spacing:.01em;}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff;}
.nav-item.active{background:rgba(255,255,255,.10);color:#fff;font-weight:500;}
.nav-icon{width:18px;height:18px;opacity:.55;flex-shrink:0;}
.nav-item.active .nav-icon{opacity:1;}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:600;padding:1px 7px;border-radius:10px;min-width:20px;text-align:center;line-height:18px;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:52px;min-height:52px;background:var(--bg-surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:16px;z-index:5;}
.topbar .breadcrumb{font-size:12.5px;color:var(--text-muted);letter-spacing:.01em;}
.topbar .breadcrumb span{color:var(--text-primary);font-weight:500;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:16px;}
.user-avatar{width:30px;height:30px;border-radius:50%;background:#e6e4e0;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);}
.content{flex:1;display:flex;flex-direction:column;padding:24px 28px;padding-bottom:70px;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:16px;}
.page-header h1{font-size:22px;font-weight:600;letter-spacing:-.02em;}
.page-header p{font-size:13px;color:var(--text-muted);margin-top:2px;}
.page-header-actions{display:flex;gap:8px;align-items:center;flex-shrink:0;}
.export-dropdown{position:relative;}
.export-dropdown .action-menu{min-width:180px;right:0;left:auto;}
.stats-row{display:flex;gap:14px;margin-bottom:20px;}
.stat-card{flex:1;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;gap:14px;min-width:0;overflow:visible;}
.stat-icon{width:42px;height:42px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stat-icon.blue{background:var(--blue-bg);color:var(--blue);}
.stat-icon.green{background:var(--green-bg);color:var(--green);}
.stat-icon.orange{background:var(--orange-bg);color:var(--orange);}
.stat-icon.red-bg{background:var(--red-bg);color:var(--red);}
.stat-card>div:not(.stat-icon){min-width:0;overflow:visible;}
.stat-value{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.2;white-space:nowrap;overflow:visible;}
.stat-label{font-size:12px;color:var(--text-muted);margin-top:1px;}
.table-panel{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;}
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 16px;background:var(--bg-surface);}
.table-panel>.filter-bar{margin-bottom:0;border:none;border-bottom:1px solid var(--border);border-radius:var(--radius-lg) var(--radius-lg) 0 0;}
.filter-bar input,.filter-bar select{height:36px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:var(--bg-surface);color:var(--text-primary);outline:none;transition:border-color var(--transition);}
.filter-bar input[type="text"]{width:220px;}
.filter-bar input.filter-keyword{width:320px;}
.filter-bar input::placeholder{color:var(--text-muted);}
.filter-bar select{min-width:150px;}
.filter-bar > input:focus,.filter-bar > select:focus,.time-range:focus-within{border-color:var(--accent);}
.time-range{position:relative;display:inline-flex;align-items:center;width:220px;height:36px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 12px;background:var(--bg-surface);cursor:pointer;transition:border-color var(--transition);}
.time-range-label{font-size:13px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;user-select:none;}
.time-range.has-value .time-range-label{color:var(--text-primary);}
.time-range-pickers{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none;}
.btn-filter{height:36px;padding:0 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;cursor:pointer;font-weight:500;transition:opacity var(--transition);}
.btn-filter:hover{opacity:.88;}
.btn-reset{height:36px;padding:0 14px;background:transparent;color:var(--text-secondary);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;cursor:pointer;transition:all var(--transition);}
.btn-reset:hover{border-color:var(--text-muted);color:var(--text-primary);}
.filter-bar .filter-extra{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;padding:5px 12px;border-radius:var(--radius-sm);font-size:12px;font-family:inherit;cursor:pointer;border:1px solid transparent;transition:all var(--transition);white-space:nowrap;font-weight:500;gap:5px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{opacity:.88;}
.btn-outline{border-color:var(--border);color:var(--text-primary);background:var(--bg-surface);}
.btn-outline:hover{border-color:var(--text-muted);background:var(--bg-hover);}
.btn-sm{padding:4px 10px;font-size:11.5px;}
.table-wrap{flex:1;display:flex;flex-direction:column;min-height:0;}
.table-scroll{overflow-x:auto;flex:1;}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px;min-width:1660px;}
thead th{background:#fafaf9;text-align:left;padding:12px 14px;font-weight:500;font-size:12px;color:var(--text-muted);letter-spacing:.02em;border-bottom:1px solid var(--border);white-space:nowrap;}
thead th:first-child,tbody td:first-child{padding-left:20px;}
tbody td{padding:13px 14px;border-bottom:1px solid var(--border-light);vertical-align:middle;}
tbody tr{transition:background var(--transition);}
tbody tr.order-item-row:hover{background:var(--bg-hover);}
tbody tr.order-item-row:hover td,
tbody tr.order-item-row:hover td:first-child{background:var(--bg-hover);}
tbody tr.order-header-row:hover{background:transparent;}
tbody tr.order-header-row td{padding:0;border-bottom:none;background:#f5f5f4;vertical-align:middle;}
tbody tr.order-header-row:hover td{background:#eeede9;}
tbody tr.order-block-last td{border-bottom:1px solid var(--border);}
.order-header-row:not(:first-child) td{border-top:6px solid var(--bg-app);}
.order-header-bar{display:flex;align-items:center;gap:0;flex-wrap:nowrap;padding:10px 20px;background:transparent;font-size:12.5px;}
.order-header-bar .oh-item{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:0 0 auto;padding-right:16px;min-width:0;box-sizing:border-box;}
.order-header-bar .oh-item .oh-value{overflow:hidden;text-overflow:ellipsis;min-width:0;}
.order-header-bar .oh-col-mainno{width:188px;flex-basis:188px;}
.order-header-bar .oh-code-line{display:inline-flex;align-items:center;gap:2px;overflow:visible;flex-shrink:0;max-width:calc(100% - 56px);}
.order-header-bar .oh-code-line .mono{overflow:hidden;text-overflow:ellipsis;min-width:0;}
.order-header-bar .oh-col-count{width:124px;flex-basis:124px;}
.order-header-bar .oh-col-time{width:164px;flex-basis:164px;}
.order-header-bar .oh-col-mall{width:164px;flex-basis:164px;}
.order-header-bar .oh-col-customer{width:164px;flex-basis:164px;}
.order-header-bar .oh-col-amount{width:320px;flex-basis:320px;overflow:visible;}
.order-header-bar .oh-col-amount .oh-value.price-total{flex-shrink:0;overflow:visible;text-overflow:unset;}
.order-header-bar .oh-col-amount .price-total-note{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;}
.order-header-bar .oh-col-freight{width:84px;flex-basis:84px;padding-right:0;}
.order-header-bar .oh-col-remark{flex:1 1 160px;min-width:120px;max-width:240px;padding-right:0;}
.order-header-bar .oh-label{color:var(--text-muted);font-size:12px;flex-shrink:0;}
.order-header-bar .oh-value{color:var(--text-primary);font-weight:500;}
.order-header-bar .oh-check{display:inline-flex;align-items:center;flex:0 0 16px;width:16px;margin-right:8px;}
.order-header-bar .oh-expand{display:inline-flex;align-items:center;flex:0 0 12px;width:12px;margin-right:12px;}
.order-header-bar.collapsible{cursor:pointer;}
.expand-arrow{display:inline-flex;align-items:center;justify-content:center;transition:transform var(--transition);color:var(--text-muted);}
.expand-arrow.expanded{transform:rotate(90deg);}
.order-header-row.order-block-last td{border-bottom:1px solid var(--border);}
.order-header-bar .oh-remark{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.order-header-row td.order-header-actions-cell{padding:10px 14px;}
.order-item-row td{vertical-align:top;padding-top:12px;padding-bottom:12px;}
.order-item-row td:first-child{background:#fafaf9;border-right:1px solid var(--border-light);}
.order-item-row td:nth-child(2){overflow:hidden;}
.product-detail-stack{display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden;}
.product-name-link{color:var(--blue);font-weight:500;font-size:13px;line-height:1.35;cursor:default;display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden;}
.product-name-link>*{flex-shrink:0;}
.product-name-link>.name-ellipsis{flex:1 1 0;}
.name-ellipsis{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.product-spec-inline{font-size:11.5px;color:var(--text-muted);font-weight:400;}
.sup-tag{background:var(--accent-soft);color:var(--text-secondary);border:1px solid var(--border);border-radius:100px;padding:1px 8px;font-size:11px;white-space:nowrap;flex-shrink:0;}
.combo-fold-link{color:var(--blue);font-size:12px;cursor:pointer;user-select:none;line-height:1.35;}
.combo-fold-link:hover{text-decoration:underline;}
.product-meta-line{font-size:11.5px;color:var(--text-muted);line-height:1.4;}
.product-meta-line .mono{color:var(--text-secondary);}
.placeholder-cell{color:var(--text-muted);font-size:12px;}
.waybill-stack{display:flex;flex-direction:column;gap:3px;min-width:0;}
.waybill-express{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--text-primary);line-height:1.35;}
.waybill-no-line{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted);line-height:1.35;}
.waybill-no-line .mono{font-family:"Microsoft YaHei",sans-serif;font-size:11.5px;color:var(--text-secondary);}
.supply-stack{display:flex;flex-direction:column;gap:4px;min-width:0;}
.supply-name{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--text-primary);line-height:1.35;white-space:nowrap;}
.supply-sku-line{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--text-muted);line-height:1.35;white-space:nowrap;}
.supply-sku-line .mono{font-family:"Microsoft YaHei",sans-serif;font-size:11px;color:var(--text-secondary);flex-shrink:0;}
.copy-icon-btn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;padding:0;border:none;background:transparent;color:var(--text-muted);cursor:pointer;border-radius:4px;flex-shrink:0;transition:color var(--transition),background var(--transition);opacity:0;visibility:hidden;}
.copy-icon-btn:hover{opacity:1;visibility:visible;color:var(--text-secondary);background:var(--bg-hover);}
	tr:hover .copy-icon-btn{opacity:1;visibility:visible;}
.copy-icon-btn svg{display:block;pointer-events:none;}
.checkbox{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
.mono{font-family:"Microsoft YaHei",sans-serif;font-size:11.5px;}
.product-cell{display:flex;align-items:flex-start;gap:10px;min-width:0;overflow:hidden;}
.product-cell>.product-detail-stack{flex:1;min-width:0;}
.product-thumb{width:48px;height:48px;border-radius:var(--radius-sm);background:var(--accent-soft);flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--text-muted);}
.price{font-family:"Microsoft YaHei",sans-serif;font-weight:500;color:var(--text-primary);}
.price-total{font-weight:600;color:var(--text-primary);white-space:nowrap;}
.price-discount{color:var(--orange);font-weight:500;}
.price-total-note{font-size:11px;color:var(--text-muted);font-weight:400;font-family:inherit;}
.tag{display:inline-flex;align-items:center;padding:2px 10px;border-radius:100px;font-size:11.5px;font-weight:500;letter-spacing:.01em;white-space:nowrap;border:1px solid transparent;}
.tag-pending{background:var(--orange-bg);color:var(--orange);border-color:var(--orange-border);}
.tag-paid{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-border);}
.tag-shipped{background:var(--green-bg);color:var(--green);border-color:var(--green-border);}
.tag-completed,.tag-cancelled{background:var(--gray-bg);color:var(--gray);border-color:var(--gray-border);}
.tag-after-none{background:var(--gray-bg);color:var(--gray);border-color:var(--gray-border);}
.tag-after-active{background:var(--orange-bg);color:var(--orange);border-color:var(--orange-border);}
.tag-after-done{background:var(--green-bg);color:var(--green);border-color:var(--green-border);}
.ship-time-cell{min-width:120px;}
.ship-time{display:inline-block;font-size:12.5px;font-weight:500;line-height:1.35;cursor:default;color:var(--text-primary);}
.ship-time-warning{color:var(--orange);}
.ship-time-overdue{color:var(--red);}
.actions{display:flex;align-items:center;gap:8px;white-space:nowrap;flex-wrap:wrap;}
.actions .action-link{color:var(--blue);font-size:12.5px;cursor:pointer;text-decoration:none;background:transparent;border:none;padding:0;font-family:inherit;}
.order-header-actions-cell .actions .action-link{font-size:12.5px;}
.actions .action-link:hover{text-decoration:underline;}
.action-menu{display:none;position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);min-width:120px;z-index:20;}
.action-menu.open{display:block;}
.action-menu button{display:block;width:100%;text-align:left;padding:8px 12px;border:none;background:none;font-size:12.5px;cursor:pointer;font-family:inherit;}
.action-menu button:hover{background:var(--bg-hover);}
.page-footer-fixed{position:fixed;bottom:0;left:232px;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 28px;background:#fafaf9;border-top:1px solid var(--border);z-index:100;box-shadow:0 -2px 8px rgba(0,0,0,.06);}
.page-footer-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.page-footer-right{display:flex;align-items:center;}
.pagination{display:flex;align-items:center;gap:4px;}
.pagination .page-btn{min-width:32px;width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-surface);cursor:pointer;font-size:12px;color:var(--text-primary);transition:all var(--transition);}
.pagination .page-btn:hover{border-color:var(--text-muted);}
.pagination .page-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.pagination .page-btn.disabled{opacity:.35;pointer-events:none;}
@media (max-width:900px){.page-footer-fixed{left:0;}.stats-row{flex-wrap:wrap;}.stat-card{min-width:calc(50% - 7px);}}
.toast-container{position:fixed;top:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--bg-sidebar);color:#fff;padding:12px 18px;border-radius:var(--radius);font-size:13px;box-shadow:var(--shadow-lg);}
.toast.success{border-left:3px solid var(--green);}
.toast.info{border-left:3px solid var(--blue);}
.ops-remark-cell{max-width:120px;font-size:12.5px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg-surface);border-radius:var(--radius-lg);width:100%;max-width:440px;box-shadow:var(--shadow-lg);}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal-header h3{font-size:15px;font-weight:600;}
.modal-close{background:none;border:none;font-size:16px;color:var(--text-muted);cursor:pointer;padding:4px;}
.modal-body{padding:20px;}
.modal-body .form-group{margin-bottom:14px;}
.modal-body .form-group:last-child{margin-bottom:0;}
.modal-body label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px;}
.modal-body textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;resize:vertical;outline:none;}
.modal-body textarea:focus{border-color:var(--accent);}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border);}
</style>
</head>
<body>

<aside class="sidebar" id="app-sidebar"></aside>
<script src="../assets/common-sidebar.js"></script>

<div class="main">
  <div class="topbar">
    <div class="breadcrumb">订单监控 / <span>商城订单列表</span></div>
    <div class="topbar-right">
      <span style="font-size:12px;color:var(--text-muted);">运营专员</span>
      <div class="user-avatar">李</div>
    </div>
  </div>
  <div class="content">
    <div class="page-header">
      <div>
        <h1>商城订单列表</h1>
        <p>集中管理各品牌商城交易订单；子订单按商品拆分（同商品多件合并一行），主订单汇总支付与收货信息</p>
      </div>
      <div class="page-header-actions">
        <button class="btn btn-primary" onclick="showToast('info','演示：跳转导入线下订单页')">+ 导入线下订单</button>
        <div class="export-dropdown">
          <button class="btn btn-outline" onclick="toggleExportMenu(event)">全量订单导出 ▾</button>
          <div class="action-menu" id="fullExportMenu">
            <button type="button" onclick="exportAllOrders(event)">导出全部订单</button>
            <button type="button" onclick="exportFilteredOrders(event)">导出全部筛选订单</button>
          </div>
        </div>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat-card">

function fmtMoney(n){return '¥'+n.toFixed(2);}
function fmtStatMoney(n){return '¥'+n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}

function orderDiscountTotal(order){return (order.couponDiscount||0)+(order.pointsOffset||0);}
function orderGrossAmount(order){return order.totalAmount+orderDiscountTotal(order);}
function amountHeaderItem(order){
  var discount=orderDiscountTotal(order);
  var html='<span class="oh-item oh-col-amount"><span class="oh-label">订单总金额</span><span class="oh-value price price-total">'+fmtMoney(orderGrossAmount(order))+'</span>';
  if(discount>0){
    var parts=[];
    if(order.couponDiscount>0)parts.push('优惠券 '+fmtMoney(order.couponDiscount));
    if(order.pointsOffset>0)parts.push('积分 '+fmtMoney(order.pointsOffset));
    html+='<span class="price-total-note" title="含优惠 -¥'+discount.toFixed(2)+'（'+parts.join(' · ')+'）">，含优惠<span class="price-discount">-¥'+discount.toFixed(2)+'</span>（'+parts.join(' · ')+'）</span>';
  }
  return html+'</span>';
}
function tagHtml(map,key){var t=map[key]||{label:key,cls:'tag-after-none'};return '<span class="tag '+t.cls+'">'+t.label+'</span>';}
function itemOrderStatusCell(item){
  return '<td>'+tagHtml(STATUS_MAP,item.status)+'</td>';
}

function afterSaleCell(item){
  var as=item.afterSale||'none';
  if(as==='none')return '<td><span class="placeholder-cell">—</span></td>';
  return '<td>'+tagHtml(AFTER_MAP,as)+'</td>';
}

function comboComponents(item){
  return (item&&item.components)||[];
}
function comboSpecText(comps){
  return comps.map(function(c){
    var n=(c.brand?c.brand+' ':'')+c.name+(c.spec?' '+c.spec:'');
    return (c.role||'子件')+'('+n+')×'+(c.qty||1);
  }).join(' + ');
}
function isComboExpanded(subNo){
  return expandedComboSubs.has(subNo);
}
function toggleComboExpand(subNo,e){
  if(e)e.stopPropagation();
  if(expandedComboSubs.has(subNo))expandedComboSubs.delete(subNo);
  else expandedComboSubs.add(subNo);
  renderTable();
}
function comboFoldLink(item,expanded){
  return '<span class="combo-fold-link" onclick="toggleComboExpand(\''+item.subNo+'\',event)">'+(expanded?'收起 ▴':'展开 ▾')+'</span>';
}
function waybillBlock(express,waybill,role){
  var html='<div class="waybill-stack">';
  html+='<div class="waybill-express">'+(role?'<span class="sup-tag">'+role+'</span> ':'')+express+'</div>';
  html+='<div class="waybill-no-line"><span class="mono">'+waybill+'</span>'
    +copyIconButton("copyWaybill('"+waybill+"',event)",'复制运单号')
    +'</div></div>';
  return html;
}
function logisticsCell(item){
  if(item.type==='virtual'){
    if(item.status==='pending')return '<td><span class="placeholder-cell">—</span></td>';
    return '<td><div class="waybill-stack"><div class="waybill-express">卡密发放</div></div></td>';
  }
  var comps=comboComponents(item);
  if(comps.length){
    var exp=isComboExpanded(item.subNo);
    if(!exp){
      var shipped=comps.filter(function(c){return c.express&&c.waybill;});
      var summary=shipped.length?shipped[0].express:'—';
      if(shipped.length>1)summary+=' 等'+shipped.length+'单';
      return '<td><div class="waybill-stack"><div class="waybill-express">'+summary+'</div>'+comboFoldLink(item,false)+'</div></td>';
    }
    var blocks=[];
    comps.forEach(function(c){
      if(c.express&&c.waybill)blocks.push(waybillBlock(c.express,c.waybill,c.role));
      else blocks.push('<div class="waybill-stack"><div class="waybill-express"><span class="sup-tag">'+c.role+'</span></div><span class="placeholder-cell">—</span></div>');
    });
    return '<td>'+blocks.join('<div style="height:8px"></div>')+comboFoldLink(item,true)+'</td>';
  }
  if(!item.express||!item.waybill)return '<td><span class="placeholder-cell">—</span></td>';

}

function copyText(text,doneMsg,e){

function firstWaybillItem(item){
  var comps=comboComponents(item);
  for(var i=0;i<comps.length;i++){
    if(comps[i].express&&comps[i].waybill)return comps[i];
  }
  return item;
}
function hasLogistics(item){
  var comps=comboComponents(item);
  if(comps.length){
    return comps.some(function(c){return c.express&&c.waybill&&(c.status==='shipped'||c.status==='completed');});
  }
  return !!(item.express&&item.waybill&&(item.status==='shipped'||item.status==='completed'));
}

function fmtDateTime(ts){
  var d=new Date(ts);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '
    +String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

function getShipDeadlineTs(item,order){
  if(item.shipDeadline)return parseOrderTime(item.shipDeadline);
  if(item.status!=='paid')return null;
  var paidAt=item.paidTime||order.orderTime;
  return parseOrderTime(paidAt)+SHIP_PROMISE_HOURS*3600000;
}

function getPaidTimeText(item,order){
  return item.paidTime||order.orderTime;
}

function formatHoursFromMs(ms){
  var h=Math.abs(ms)/3600000;
  var s=h.toFixed(1);
  if(s.endsWith('.0'))s=s.slice(0,-2);
  return s+'h';
}

function formatRemainingShipTime(ms){
  if(ms<=0)return {state:'overdue',text:'已超时'+formatHoursFromMs(ms)};
  var warnMs=2*3600000;
  var text=formatHoursFromMs(ms);
  if(ms<warnMs)return {state:'warning',text:text};
  return {state:'normal',text:text};
}

function shipTimeTooltip(order,item,deadlineTs,fmt){
  var paid=getPaidTimeText(item,order);
  return '下单时间：'+paid+' | 承诺时效：'+SHIP_PROMISE_HOURS+'h | 剩余：'+fmt.text;
}

function shipTimeInnerHtml(fmt){
  return fmt.text;
}

function shipTimeClass(state){
  return state==='normal'?'ship-time':'ship-time ship-time-'+state;
}

function shipTimeCell(order,item){
  if(item.status!=='paid')return '<td class="ship-time-cell"><span class="placeholder-cell">—</span></td>';
  var deadlineTs=getShipDeadlineTs(item,order);
  if(!deadlineTs)return '<td class="ship-time-cell"><span class="placeholder-cell">—</span></td>';
  var remainingMs=deadlineTs-Date.now();
  var fmt=formatRemainingShipTime(remainingMs);
  var paid=getPaidTimeText(item,order);
  var tooltip=shipTimeTooltip(order,item,deadlineTs,fmt);
  return '<td class="ship-time-cell"><span class="'+shipTimeClass(fmt.state)+'" data-ship-deadline="'+deadlineTs+'" data-ship-paid="'+paid+'" title="'+tooltip+'">'
    +shipTimeInnerHtml(fmt)+'</span></td>';
}

function updateShipTimeCells(){
  document.querySelectorAll('[data-ship-deadline]').forEach(function(el){
    var deadlineTs=parseInt(el.getAttribute('data-ship-deadline'),10);
    var paid=el.getAttribute('data-ship-paid')||'';
    var remainingMs=deadlineTs-Date.now();
    var fmt=formatRemainingShipTime(remainingMs);
    el.className=shipTimeClass(fmt.state);
    el.title='下单时间：'+paid+' | 承诺时效：'+SHIP_PROMISE_HOURS+'h | 剩余：'+fmt.text;
    el.textContent=shipTimeInnerHtml(fmt);
  });
}

function startShipTimeTimer(){
  if(shipTimeTimer)clearInterval(shipTimeTimer);
  shipTimeTimer=setInterval(updateShipTimeCells,30000);
}

function initMockShipDeadlines(){
  var now=Date.now();
  var configs=[
    {subNo:'ORD2026032300103',remainingMs:6*3600000+18*60000,paidOffsetMs:-10*3600000},
    {subNo:'ORD2026032300104',remainingMs:1*3600000+30*60000,paidOffsetMs:-20*3600000},
    {subNo:'ORD2026032300105',remainingMs:-3*3600000,paidOffsetMs:-51*3600000},
    {subNo:'ORD2026032100702',remainingMs:2*86400000+3*3600000,paidOffsetMs:-24*3600000},
    {subNo:'ORD2026082401401',remainingMs:8*3600000,paidOffsetMs:-16*3600000},
    {subNo:'ORD2026082401501',remainingMs:12*3600000,paidOffsetMs:-12*3600000}
  ];
  configs.forEach(function(cfg){
    var item=findItemBySubNo(cfg.subNo);
    if(!item||item.status!=='paid')return;
    item.paidTime=fmtDateTime(now+cfg.paidOffsetMs);
    item.shipDeadline=fmtDateTime(now+cfg.remainingMs);
  });
}

function itemActionsCell(item){

function opsRemarkCell(item){

  return '<td class="ops-remark-cell" title="'+text+'">'+text+'</td>';

function findItemBySubNo(subNo){
  for(var i=0;i<orderData.length;i++){
    for(var j=0;j<orderData[i].items.length;j++){
      if(orderData[i].items[j].subNo===subNo)return orderData[i].items[j];
    }
  }
  return null;
}

function findOrderByMainNo(mainNo){
  for(var i=0;i<orderData.length;i++){
    if(orderData[i].mainNo===mainNo)return orderData[i];
  }
  return null;
}

function findFilteredOrderByMainNo(mainNo){
  for(var i=0;i<filteredOrders.length;i++){
    if(filteredOrders[i].mainNo===mainNo)return filteredOrders[i];
  }
  return null;
}

function cloneOrderWithItems(order,items){
  return {
    mainNo:order.mainNo,
    mall:order.mall,
    orderTime:order.orderTime,
    customer:order.customer,
    totalAmount:order.totalAmount,
    freight:order.freight,
    couponDiscount:order.couponDiscount,
    pointsOffset:order.pointsOffset,
    remark:order.remark,
    items:items
  };
}

function narrowOrdersByStatus(orders,status){
  if(!status)return orders;
  return orders.map(function(o){
    return cloneOrderWithItems(o,o.items.filter(function(it){return it.status===status;}));
  }).filter(function(o){return o.items.length>0;});
}

function toggleOrderRow(mainNo,e){

  if(expandedOrders.has(mainNo))expandedOrders.delete(mainNo);
  else expandedOrders.add(mainNo);
  allOrdersExpanded=false;
  renderTable();

function getCollapsibleOrders(orders){
  return orders.filter(isCollapsibleOrder);
}

function expandAllOrders(){
  allOrdersExpanded=!allOrdersExpanded;
  expandedOrders.clear();
  if(allOrdersExpanded){
    getCollapsibleOrders(filteredOrders).forEach(function(o){expandedOrders.add(o.mainNo);});
  }
  renderTable();
}

function updateExpandAllBtn(){
  var btn=document.getElementById('btnExpandAll');
  if(!btn)return;
  var collapsible=getCollapsibleOrders(filteredOrders);
  if(!collapsible.length){
    btn.textContent='全部展开 ▾';
    allOrdersExpanded=false;
    return;
  }
  if(allOrdersExpanded&&collapsible.every(function(o){return expandedOrders.has(o.mainNo);})){
    btn.textContent='全部收起 ▴';
  }else if(expandedOrders.size===0){
    btn.textContent='全部展开 ▾';
    allOrdersExpanded=false;
  }else{
    btn.textContent='全部展开 ▾';
    allOrdersExpanded=false;
  }
}

}

function parseOrderTime(str){

}

function getRangeTimestamp(dateId,timeId,isEnd){

  if(!d)return null;
  var t=document.getElementById(timeId).value;
  if(!t)t=isEnd?'23:59':'00:00';

function formatRangePart(dateVal,timeVal){

function focusTimeRange(e){

function isOrderFullySelected(order){
  return order.items.length>0&&order.items.every(function(it){return selectedSubs.has(it.subNo);});
}

function isOrderPartiallySelected(order){
  var n=order.items.filter(function(it){return selectedSubs.has(it.subNo);}).length;
  return n>0&&n<order.items.length;
}

function syncMainCheckbox(mainNo){
  var order=findFilteredOrderByMainNo(mainNo);
  if(!order)return;
  document.querySelectorAll('.order-check[data-main="'+mainNo+'"]').forEach(function(cb){
    cb.checked=isOrderFullySelected(order);
    cb.indeterminate=isOrderPartiallySelected(order);
  });
}

function syncAllMainCheckboxes(){
  filteredOrders.forEach(function(o){syncMainCheckbox(o.mainNo);});
}

function toggleSelectMain(mainNo,checked){
  var order=findFilteredOrderByMainNo(mainNo);
  if(!order)return;
  order.items.forEach(function(it){
    if(checked)selectedSubs.add(it.subNo);
    else selectedSubs.delete(it.subNo);
  });
  document.querySelectorAll('.sub-check[data-main="'+mainNo+'"]').forEach(function(cb){
    cb.checked=checked;
  });
  syncMainCheckbox(mainNo);
  updateSelectedInfo();
}

function toggleSelectSub(mainNo,subNo,checked){
  if(checked)selectedSubs.add(subNo);
  else selectedSubs.delete(subNo);
  syncMainCheckbox(mainNo);
  updateSelectedInfo();
}

function getSelectedItemsInFilter(){
  var items=[];
  filteredOrders.forEach(function(o){
    o.items.forEach(function(it){
      if(selectedSubs.has(it.subNo))items.push(it);
    });
  });
  return items;
}

function updateSelectedInfo(){
  var selectedItems=getSelectedItemsInFilter();
  var subCount=selectedItems.length;
  var qtyTotal=0;
  var amountTotal=0;
  var paidCount=0;
  selectedItems.forEach(function(it){
    qtyTotal+=it.qty;
    amountTotal+=itemSubtotal(it);
    if(it.status==='paid')paidCount++;
  });
  document.getElementById('selectedInfo').textContent=
    '已选 '+subCount+' 笔子订单 | 商品总数 '+qtyTotal+' 件 | 订单总额 '+fmtStatMoney(amountTotal)+' | 待发货 '+paidCount+' 笔';
  var all=document.getElementById('selectAll');
  if(!all)return;
  var totalSubs=countSubOrders(filteredOrders);
  var selectedInFilter=selectedItems.length;
  all.checked=totalSubs>0&&selectedInFilter===totalSubs;
  all.indeterminate=selectedInFilter>0&&selectedInFilter<totalSubs;
}

function toggleSelectAll(checked){
  filteredOrders.forEach(function(o){
    o.items.forEach(function(it){
      if(checked)selectedSubs.add(it.subNo);
      else selectedSubs.delete(it.subNo);
    });
  });
  renderTable();
}

function renderTable(){
  var tbody=document.getElementById('orderTableBody');
  var html='';
  var totalPages=Math.max(1,Math.ceil(filteredOrders.length/PAGE_SIZE));
  if(currentPage>totalPages)currentPage=totalPages;
  if(currentPage<1)currentPage=1;
  var pageOrders=filteredOrders.slice((currentPage-1)*PAGE_SIZE,currentPage*PAGE_SIZE);
  pageOrders.forEach(function(order){
    var isExp=expandedOrders.has(order.mainNo);
    html+=orderHeaderRow(order);
    if(isExp){
      order.items.forEach(function(item,idx){
        html+=orderItemRow(order,item,idx===order.items.length-1);
      });
    }
  });
  tbody.innerHTML=html||'<tr><td colspan="'+ORDER_COLS+'" style="text-align:center;padding:40px;color:var(--text-muted);">暂无符合条件的订单</td></tr>';
  renderPagination('共 '+filteredOrders.length+' 个主订单 · '+countSubOrders(filteredOrders)+' 条子订单 · '+countAllItemsQty(filteredOrders)+' 件商品',totalPages);
  syncAllMainCheckboxes();
  updateSelectedInfo();
  updateExpandAllBtn();
}
function goToPage(p){currentPage=p;renderTable();document.querySelector('.table-panel').scrollIntoView({behavior:'smooth',block:'start'});}
function changePageSize(){PAGE_SIZE=parseInt(document.getElementById('pageSizeSelect').value,10)||10;currentPage=1;renderTable();}
function jumpToPage(){var p=parseInt(document.getElementById('jumpPageInput').value,10);if(!p||p<1)p=1;if(p>lastTotalPages)p=lastTotalPages;document.getElementById('jumpPageInput').value=p;goToPage(p);}
function renderPagination(totalText,totalPages){
  lastTotalPages=totalPages;
  var bar=document.getElementById('paginationBar');
  var html='';
  html+='<div class="page-btn'+(currentPage<=1?' disabled':'')+'" onclick="'+(currentPage>1?'goToPage('+(currentPage-1)+')':'')+'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></div>';
  var maxBtns=5;
  var startP=Math.max(1,currentPage-Math.floor(maxBtns/2));
  var endP=Math.min(totalPages,startP+maxBtns-1);
  if(endP-startP<maxBtns-1)startP=Math.max(1,endP-maxBtns+1);
  for(var i=startP;i<=endP;i++){
    html+='<div class="page-btn'+(i===currentPage?' active':'')+'" onclick="goToPage('+i+')">'+i+'</div>';
  }
  html+='<div class="page-btn'+(currentPage>=totalPages?' disabled':'')+'" onclick="'+(currentPage<totalPages?'goToPage('+(currentPage+1)+')':'')+'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>';
  bar.innerHTML=html;
  document.getElementById('totalCount').textContent=totalText;
}

document.addEventListener('click',function(){
  document.querySelectorAll('.action-menu.open').forEach(function(m){m.classList.remove('open');});
});

function applyFilters(){
  var keyword=document.getElementById('fKeyword').value.trim();
  var keywordLower=keyword.toLowerCase();
  var status=document.getElementById('fStatus').value;
  var afterSale=document.getElementById('fAfterSale').value;
  var mall=document.getElementById('fMall').value;
  var supplier=document.getElementById('fSupplier').value;
  var startTs=getRangeTimestamp('fDateStart','fTimeStart',false);
  var endTs=getRangeTimestamp('fDateEnd','fTimeEnd',true);
  filteredOrders=orderData.filter(function(o){
    if(keyword){
      var mainMatch=o.mainNo.toLowerCase().indexOf(keywordLower)>=0;
      var subMatch=o.items.some(function(it){return it.subNo.toLowerCase().indexOf(keywordLower)>=0;});
      var productMatch=o.items.some(function(it){
        var names=[it.name,it.comboName];
        if(names.some(function(n){return n&&n.toLowerCase().indexOf(keywordLower)>=0;}))return true;
        return comboComponents(it).some(function(c){
          return ((c.brand||'')+' '+(c.name||'')).toLowerCase().indexOf(keywordLower)>=0;
        });
      });
      var skuMatch=o.items.some(function(it){
        if((it.skuMall&&it.skuMall.toLowerCase().indexOf(keywordLower)>=0)
          ||(it.skuLogistics&&it.skuLogistics.toLowerCase().indexOf(keywordLower)>=0))return true;
        return comboComponents(it).some(function(c){return (c.skuLogistics||'').toLowerCase().indexOf(keywordLower)>=0;});
      });
      var phoneMatch=o.customer.phone.indexOf(keyword)>=0;
      var receiverMatch=o.customer.name.indexOf(keyword)>=0;
      if(!mainMatch&&!subMatch&&!productMatch&&!skuMatch&&!phoneMatch&&!receiverMatch)return false;
    }
    if(status&&!o.items.some(function(it){return it.status===status;}))return false;
    if(afterSale&&!o.items.some(function(it){return (it.afterSale||'none')===afterSale;}))return false;
    if(mall&&o.mall!==mall)return false;
    if(supplier&&!o.items.some(function(it){
      if(it.supplier===supplier)return true;
      return comboComponents(it).some(function(c){return c.supplier===supplier;});
    }))return false;
    if(startTs||endTs){
      var ts=parseOrderTime(o.orderTime);
      if(startTs&&ts<startTs)return false;
      if(endTs&&ts>endTs)return false;
    }
    return true;
  });
  filteredOrders=narrowOrdersByStatus(filteredOrders,status);
  currentPage=1;
  renderTable();
}

function resetFilters(){
  ['fKeyword','fDateStart','fTimeStart','fDateEnd','fTimeEnd'].forEach(function(id){document.getElementById(id).value='';});
  ['fStatus','fAfterSale','fMall','fSupplier'].forEach(function(id){document.getElementById(id).selectedIndex=0;});
  filteredOrders=orderData.slice();
  initExpandedState();
  updateTimeRangeLabel();
  currentPage=1;
  renderTable();
}

function initExpandedState(){
  expandedOrders.clear();
  getCollapsibleOrders(filteredOrders).forEach(function(o){expandedOrders.add(o.mainNo);});
  allOrdersExpanded=true;
}

function exportSelected(){
  if(!selectedSubs.size){showToast('info','请先勾选要导出的子订单');return;}
  showToast('success','已导出 '+selectedSubs.size+' 条子订单（演示）');
}

function toggleExportMenu(e){
  e.stopPropagation();
  var menu=document.getElementById('fullExportMenu');
  document.querySelectorAll('.action-menu.open').forEach(function(m){if(m!==menu)m.classList.remove('open');});
  menu.classList.toggle('open');
}

function exportAllOrders(e){
  if(e)e.stopPropagation();
  document.getElementById('fullExportMenu').classList.remove('open');
  var subCount=countSubOrders(orderData);
  showToast('success','已导出全部 '+orderData.length+' 个主订单 · '+subCount+' 条子订单（演示）');
}

function exportFilteredOrders(e){
  if(e)e.stopPropagation();
  document.getElementById('fullExportMenu').classList.remove('open');
  if(!filteredOrders.length){showToast('info','当前筛选结果为空，无可导出订单');return;}
  var subCount=countSubOrders(filteredOrders);
  showToast('success','已导出筛选结果 '+filteredOrders.length+' 个主订单 · '+subCount+' 条子订单（演示）');
}

function batchUrgeShip(){
  var urgeSubs=[];
  selectedSubs.forEach(function(subNo){
    var item=findItemBySubNo(subNo);
    if(item&&item.status==='paid')urgeSubs.push(subNo);
  });
  if(!urgeSubs.length){showToast('info','请先勾选待发货子订单');return;}
  showToast('success','已向 '+urgeSubs.length+' 个待发货子订单发送催办提醒（演示）');
}

function urgeShipSub(subNo,e){
  if(e)e.stopPropagation();
  var item=findItemBySubNo(subNo);
  if(!item||item.status!=='paid'){showToast('info','仅待发货子订单可催办');return;}
  showToast('success','已向子订单 '+subNo+' 发送催办提醒（演示）');
}

function urgeShipMain(mainNo,e){
  if(e)e.stopPropagation();
  var order=findOrderByMainNo(mainNo);
  if(!order)return;
  var count=order.items.filter(function(it){return it.status==='paid';}).length;
  if(!count){showToast('info','该主订单无待发货子订单');return;}
  showToast('success','已向主订单 '+mainNo+' 下 '+count+' 个待发货子订单发送催办提醒（演示）');
}

initMockShipDeadlines();
initExpandedState();
renderOrderStats();
renderTable();
startShipTimeTimer();
</script>
