*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:rgba(0,0,0,.85);background:#f4f4f4;line-height:1.5;min-width:1600px;padding-bottom:24px;-webkit-font-smoothing:antialiased}

.ck-card-hd a{font-size:13px;color:var(--text-mid);font-weight:400}

.ck-addr{display:flex;gap:16px;padding:16px;border:2px solid var(--jd-red);border-radius:var(--radius);cursor:pointer;position:relative;background:#fffafa}

.ck-goods-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid #f5f5f5}
.ck-goods-item:last-child{border-bottom:none;padding-bottom:0}

.ck-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:14px;color:#666;border-bottom:1px solid #f9f9f9}

.pay-modal-channel{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;background:#fafafa;border-radius:var(--radius);margin-bottom:20px;font-size:14px}

<script>
SiteTopBar.init({ logged: true, cartCount: 15 });
const HOME='01.首页-原型页面.html',SUCCESS='08.支付成功-原型页面.html',ORDER='10.订单页-原型页面.html';
const PAY_FAIL='09.支付失败-订单关闭-原型页面.html';
const BEAN_RATE=0.01;
let BEAN_BALANCE=128560;
let payChannel='wechat';
let useBeans=null;
let beansOn=false;
let countdownSec=15*60;
let modalTimerSec=15*60;
let modalTimerId=null;

let selectedCoupon={id:'c1',title:'满2000减100',discount:100};
let selectedGiftCards=[];
function currentAddress(){return AddressSelect.getSelected();}

let items=[
  {id:1,name:'OPPO Find X9 5G 旗舰手机',spec:'12GB+256GB 钛色',price:4299,qty:1,img:IMG.oppo},
  {id:2,name:'Apple AirPods Pro 第三代',spec:'白色 主动降噪',price:1899,qty:1,img:IMG.headphone}
];

const params=new URLSearchParams(location.search);
const isPayOnly=params.get('mode')==='pay';
const orderNo=params.get('order')||'SY202606150001';
if(params.get('beans'))BEAN_BALANCE=Math.max(0,parseInt(params.get('beans'),10)||BEAN_BALANCE);
const forcePointsPay=params.get('pay')==='points';

function guardBeans(fee){
  if(!fee.beansUsed||fee.beansUsed<=BEAN_BALANCE)return true;
  BeansInsufficient.open({need:fee.beansUsed,balance:BEAN_BALANCE});
  return false;
}

function goPayFail(reason){
  closePayModal();
  location.href=PAY_FAIL+'?reason='+(reason||'fail')+'&order='+encodeURIComponent(orderNo);
}

function formatPrice(n){return Number(n).toFixed(2)}
function goodsTotal(){return items.reduce((s,i)=>s+i.price*i.qty,0)}
function beanToYuan(b){return b*BEAN_RATE}
function maxBeansForOrder(afterCoupon){return Math.round(afterCoupon/BEAN_RATE)}

function giftCardTotal(){return selectedGiftCards.reduce((s,c)=>s+(c.remain||0),0)}

// 优惠券与礼品卡互斥：返回当前应优先扣减的券或卡金额
function getPreDeduct(goods){
  if(selectedCoupon)return{coupon:selectedCoupon.discount,giftUsed:0};
  if(selectedGiftCards.length)return{coupon:0,giftUsed:Math.min(giftCardTotal(),goods)};
  return{coupon:0,giftUsed:0};
}

function maxUseBeans(){
  const goods=goodsTotal();
  const ded=getPreDeduct(goods);
  const afterCoupon=Math.max(0,goods-ded.coupon-ded.giftUsed);
  const pointsNeeded=Math.round(afterCoupon/BEAN_RATE);
  if(BEAN_BALANCE>=pointsNeeded)return pointsNeeded;
  return Math.min(BEAN_BALANCE,maxBeansForOrder(afterCoupon));
}

function clampUseBeans(){
  const max=maxUseBeans();
  if(useBeans===null)useBeans=max;
  else useBeans=Math.max(0,Math.min(max,useBeans));
}

function calcFee(){
  const goods=goodsTotal();
  const freight=0;
  const ded=getPreDeduct(goods);
  const coupon=ded.coupon,giftUsed=ded.giftUsed;
  const afterDiscount=Math.max(0,goods-coupon-giftUsed);
  const pointsNeeded=Math.round(afterDiscount/BEAN_RATE);
  const maxUse=Math.min(BEAN_BALANCE,pointsNeeded);
  let beansUsed=0;
  if(forcePointsPay){
    return{goods,freight,beansUsed:pointsNeeded,cashDue:0,coupon,giftUsed,payMode:'points',maxUse:pointsNeeded};
  }
  if(beansOn&&maxUse>0){
    clampUseBeans();
    beansUsed=useBeans;
  }else{
    useBeans=0;
  }
  const cashDue=Math.max(0,afterDiscount-beanToYuan(beansUsed));
  const payMode=cashDue<=0?((beansUsed>0||giftUsed>0)?'points':'cash'):((beansUsed>0||giftUsed>0)?'combo':'cash');
  return{goods,freight,beansUsed,cashDue,coupon,giftUsed,payMode,maxUse};
}

function sideBeansHtml(fee){
  if(fee.maxUse<=0)return'';
  const checked=beansOn;
  const b=fee.beansUsed;
  const y=formatPrice(beanToYuan(b));
  return`<div class="ck-beans-block">
    <label class="ck-beans-toggle">
      <span class="ck-beans-check"><input type="checkbox" id="beansSwitch"${checked?' checked':''}></span>
      <span class="ck-beans-label">使用苏银豆</span>
      <span class="ck-beans-balance">余额 ${BEAN_BALANCE.toLocaleString()}</span>
    </label>
    <div class="ck-beans-expand${checked?' show':''}" id="beansExpand">
      <div class="ck-beans-use-row">
        <span class="ck-beans-use-label">本次使用：</span>
        <input type="text" id="beansInput" class="ck-beans-input" value="${b}" inputmode="numeric">
        <span class="ck-beans-unit">豆</span>
        <span class="ck-beans-deduct" id="beansDeductText">(可抵 <em>¥${y}</em>)</span>
        <button type="button" class="ck-beans-pill" id="beansMaxBtn">最大</button>
        <button type="button" class="ck-beans-pill" id="beansClearBtn">清空</button>
      </div>
    </div>
  </div>`;
}

function updateSidebarNumbers(fee){
  const side=document.getElementById('ckSide');
  if(!side)return;
  side.querySelector('.ck-pay-auto-type').textContent=payModeLabel(fee.payMode);
  side.querySelector('.ck-pay-auto-tip').textContent=payTipText(fee);
  const channelBox=side.querySelector('#channelBox');
  if(channelBox)channelBox.classList.toggle('show',fee.cashDue>0);
  const feeRows=side.querySelectorAll('.ck-fee-row');
  feeRows.forEach(el=>{
    const label=el.querySelector('span:first-child')?.textContent;
    if(label==='商品金额')el.querySelector('span:last-child').textContent='¥'+formatPrice(fee.goods);
    if(label==='运费')el.querySelector('span:last-child').textContent='¥'+formatPrice(fee.freight);
    if(label==='优惠券')el.querySelector('span:last-child').textContent='-¥'+formatPrice(fee.coupon);
    if(label==='礼品卡抵扣')el.querySelector('span:last-child').textContent='-¥'+formatPrice(fee.giftUsed);
    if(label==='苏银豆抵扣')el.querySelector('span:last-child').textContent='-¥'+formatPrice(beanToYuan(fee.beansUsed))+'（'+fee.beansUsed.toLocaleString()+' 豆）';
    if(label==='现金支付')el.querySelector('span:last-child').textContent='¥'+formatPrice(fee.cashDue);
  });
  const beansDisc=side.querySelector('.ck-fee-row.discount[data-fee=beans]');
  if(beansDisc){
    beansDisc.style.display=fee.beansUsed?'':'none';
    if(fee.beansUsed)beansDisc.querySelector('span:last-child').textContent='-¥'+formatPrice(beanToYuan(fee.beansUsed))+'（'+fee.beansUsed.toLocaleString()+' 豆）';
  }
  const cashRow=side.querySelector('.ck-fee-row[data-fee=cash]');
  if(cashRow){
    const showCash=fee.cashDue>0&&(fee.beansUsed>0||fee.giftUsed>0);
    cashRow.style.display=showCash?'':'none';
    if(showCash)cashRow.querySelector('span:last-child').textContent='¥'+formatPrice(fee.cashDue);
  }
  side.querySelector('.ck-fee-total em').textContent='¥'+formatPrice(fee.cashDue);
  const btn=side.querySelector('#submitBtn');
  if(btn)btn.textContent=fee.payMode==='points'?(fee.giftUsed>0?'确认支付':'确认兑换'):fee.payMode==='combo'?'组合支付':'立即支付';
}

function updateSidebarFee(fee){
  const side=document.getElementById('ckSide');
  if(!side)return;
  const beansBlock=side.querySelector('.ck-beans-block');
  if(beansBlock)beansBlock.outerHTML=sideBeansHtml(fee);
  updateSidebarNumbers(fee);
  bindBeansEvents();
}

function applyBeansVal(val){
  const max=maxUseBeans();
  if(isNaN(val)||val<0)val=0;
  if(val>BEAN_BALANCE){ProtoToast.warn('不能超过账户余额');val=BEAN_BALANCE;}
  if(val>max){ProtoToast.warn('不能超过本单可用上限');val=max;}
  beansOn=document.getElementById('beansSwitch')?.checked??(val>0);
  useBeans=val===0?0:(val===max?null:val);
  updateSidebarFee(calcFee());
}

function bindBeansEvents(){
  document.getElementById('beansSwitch')?.addEventListener('change',function(){
    beansOn=this.checked;
    if(beansOn)useBeans=null;else useBeans=0;
    updateSidebarFee(calcFee());
  });
  document.getElementById('beansMaxBtn')?.addEventListener('click',()=>{
    beansOn=true;
    useBeans=null;
    updateSidebarFee(calcFee());
  });
  document.getElementById('beansClearBtn')?.addEventListener('click',()=>{
    beansOn=true;
    useBeans=0;
    updateSidebarFee(calcFee());
  });
  const input=document.getElementById('beansInput');
  if(input){
    input.addEventListener('blur',()=>applyBeansVal(parseInt(input.value.replace(/,/g,''),10)));
    input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();input.blur();}});
  }
}

function payModeLabel(mode){
  if(mode==='points')return'纯积分';
  if(mode==='cash')return'纯现金';
  return'组合支付';
}

// 顶部「支付方式」自动提示文案（含礼品卡 / 苏银豆明细）
function payTipText(fee){
  if(fee.cashDue<=0){
    const parts=[];
    if(fee.giftUsed>0)parts.push('礼品卡抵扣 ¥'+formatPrice(fee.giftUsed));
    if(fee.beansUsed>0)parts.push('苏银豆抵扣 '+fee.beansUsed.toLocaleString()+' 豆');
    return parts.length?parts.join('，')+'，无需现金支付':'全额苏银豆兑换';
  }
  const parts=[];
  if(fee.giftUsed>0)parts.push('礼品卡抵扣 ¥'+formatPrice(fee.giftUsed));
  if(fee.beansUsed>0)parts.push('苏银豆抵扣 '+fee.beansUsed.toLocaleString()+' 豆');
  return parts.length?parts.join('，')+'，剩余 ¥'+formatPrice(fee.cashDue)+' 现金支付':'本单不使用苏银豆，全额现金支付';
}

function couponRowLabel(){
  if(selectedGiftCards.length)return'<span style="color:#bbb">与礼品卡互斥</span>';
  if(!selectedCoupon)return CouponSelect.usableCount(goodsTotal())+'张可用 ›';
  return selectedCoupon.title+' 已选 ›';
}

function giftCardRowLabel(){
  if(selectedCoupon)return'<span style="color:#bbb">与优惠券互斥</span>';
  if(!selectedGiftCards.length)return GiftCardSelect.usableCount()+'张可用 ›';
  if(selectedGiftCards.length===1)return selectedGiftCards[0].name+' 已选 ›';
  return'已选'+selectedGiftCards.length+'张礼品卡 ›';
}

function renderCheckout(){
  document.body.classList.remove('ck-pay-only');
  document.getElementById('ckSteps').innerHTML='<span class="active">1. 确认订单</span><i>›</i><span>2. 付款</span><i>›</i><span>3. 支付成功</span>';
  const fee=calcFee();
  const address=currentAddress();
  document.getElementById('ckLeft').innerHTML=`
    <div class="ck-card">
      <div class="ck-card-hd">收货地址 <a href="javascript:void(0)" id="switchAddress">切换地址</a></div>
      <div class="ck-addr" id="pickAddress">
        ${address.isDefault?'<span class="ck-addr-tag">默认</span>':''}
        <div class="ck-addr-body">
          <div class="ck-addr-name">${address.name} <em>${address.phone}</em></div>
          <div class="ck-addr-detail">${address.addr}</div>
        </div>
        <span class="ck-addr-arrow">›</span>
      </div>
      <div class="ck-zigzag"></div>
    </div>
    <div class="ck-card">
      <div class="ck-card-hd">商品清单</div>
      ${items.map((it,i)=>`<div class="ck-goods-item" data-idx="${i}">
        <img src="${it.img}" alt="">
        <div class="ck-goods-info">
          <div class="ck-goods-name">${it.name}</div>
          <div class="ck-goods-spec">${it.spec}</div>
          <div class="ck-qty-ctrl">
            <button type="button" class="qty-min"${it.qty<=1?' disabled':''}>−</button>
            <input type="text" value="${it.qty}" readonly>
            <button type="button" class="qty-plus">+</button>
          </div>
        </div>
        <div class="ck-goods-right">
          <div class="ck-goods-price">¥${formatPrice(it.price)}</div>
        </div>
      </div>`).join('')}
    </div>
    <div class="ck-card">
      <div class="ck-row"><span>配送方式</span><strong>快递 免邮</strong></div>
      <div class="ck-row"><span>优惠券</span><span class="link" id="pickCoupon">${couponRowLabel()}</span></div>
      <div class="ck-row"><span>礼品卡</span><span class="link" id="pickGiftCard">${giftCardRowLabel()}</span></div>
    </div>
    <div class="ck-card ck-msg">
      <div class="ck-card-hd" style="margin-bottom:10px">买家留言</div>
      <textarea id="orderMsg" maxlength="200" placeholder="选填，可告知配送时间等（最多200字）"></textarea>
      <div class="ck-msg-count"><span id="msgCount">0</span>/200</div>
    </div>`;

  document.getElementById('ckSide').innerHTML=`
    <div class="ck-card">
      <div class="ck-pay-auto">
        <div class="ck-pay-auto-type">${payModeLabel(fee.payMode)}</div>
        <div class="ck-pay-auto-tip">${payTipText(fee)}</div>
      </div>
      ${fee.cashDue>0?`<div class="ck-pay-extra show" id="channelBox">
        <div>支付渠道</div>
        <div class="ck-channel">
          <label><input type="radio" name="channel" value="wechat"${payChannel==='wechat'?' checked':''}> 微信支付</label>
          <label><input type="radio" name="channel" value="alipay"${payChannel==='alipay'?' checked':''}> 支付宝</label>
        </div>
      </div>`:''}
      ${sideBeansHtml(fee)}
      <div class="ck-fee-row"><span>商品金额</span><span>¥${formatPrice(fee.goods)}</span></div>
      <div class="ck-fee-row"><span>运费</span><span>¥${formatPrice(fee.freight)}</span></div>
      ${fee.coupon?`<div class="ck-fee-row discount"><span>优惠券</span><span>-¥${formatPrice(fee.coupon)}</span></div>`:''}
      ${fee.giftUsed?`<div class="ck-fee-row discount" data-fee="gift"><span>礼品卡抵扣</span><span>-¥${formatPrice(fee.giftUsed)}</span></div>`:''}
      <div class="ck-fee-row discount" data-fee="beans" style="display:${fee.beansUsed?'':'none'}"><span>苏银豆抵扣</span><span>-¥${formatPrice(beanToYuan(fee.beansUsed))}（${fee.beansUsed.toLocaleString()} 豆）</span></div>
      <div class="ck-fee-row" data-fee="cash" style="display:${fee.cashDue>0&&(fee.beansUsed>0||fee.giftUsed>0)?'':'none'}"><span>现金支付</span><span>¥${formatPrice(fee.cashDue)}</span></div>
      <div class="ck-fee-total">
        <span>合计</span>
        <em>¥${formatPrice(fee.cashDue)}</em>
      </div>
      <button type="button" class="ck-submit" id="submitBtn">${fee.payMode==='points'?(fee.giftUsed>0?'确认支付':'确认兑换'):fee.payMode==='combo'?'组合支付':'立即支付'}</button>
    </div>`;

  bindCheckoutEvents();
}

function renderPayOnly(){
  document.body.classList.add('ck-pay-only');
  document.getElementById('ckSteps').innerHTML='<span>1. 确认订单</span><i>›</i><span class="active">2. 付款</span><i>›</i><span>3. 支付成功</span>';
  document.getElementById('ckSide').innerHTML='';
  const payBeans=20000;
  const payCash=2299;
  const payMode=payCash<=0?'points':payBeans>0?'combo':'cash';
  document.getElementById('ckLeft').innerHTML=`
    <div class="ck-card ck-pay-panel">
      <div class="ck-pay-amount">${payMode==='points'?'应付积分':'应付金额'}<em>${payMode==='points'?payBeans.toLocaleString()+' 苏银豆':'¥'+formatPrice(payCash)}</em></div>
      <div class="ck-pay-timer" id="payTimer">支付剩余时间 15:00</div>
      <div class="ck-pay-order">订单号：${orderNo}</div>
      <div class="ck-pay-balance">${payMode==='points'?'全额苏银豆支付，余额充足':payMode==='combo'?`苏银豆已抵扣 ${payBeans.toLocaleString()} 豆，剩余现金 <em>¥${formatPrice(payCash)}</em>`:'全额现金支付'}</div>
      ${payCash>0?`<div class="ck-pay-methods">
        <label class="ck-pay-method active" data-channel="wechat"><input type="radio" name="payonly" checked> <span class="ck-pay-method-icon">${ProtoIcon.html('wechat',{size:24})}</span><div class="ck-pay-method-info"><h4>微信支付</h4><p>推荐使用</p></div></label>
        <label class="ck-pay-method" data-channel="alipay"><input type="radio" name="payonly"> <span class="ck-pay-method-icon">${ProtoIcon.html('alipay',{size:24})}</span><div class="ck-pay-method-info"><h4>支付宝</h4><p>数亿用户的选择</p></div></label>
      </div>`:''}
      <button type="button" class="ck-submit" id="payOnlyBtn">${payMode==='points'?'确认兑换':'确认支付'}</button>
      <button type="button" class="ck-cancel-btn" id="cancelPayBtn">取消支付</button>
      <a class="ck-cs-link" href="#" data-cs-open data-cs-topic="order">支付遇到问题？<i>联系客服</i></a>
    </div>`;
  document.getElementById('payOnlyBtn').onclick=()=>{
    const fee={payMode,beansUsed:payBeans,cashDue:payCash};
    if(payMode==='points'){
      if(!guardBeans(fee))return;
      location.href=SUCCESS+'?type=points&beans='+payBeans+'&order='+orderNo;
    }else{
      if(payBeans&&!guardBeans(fee))return;
      openPayModal(fee);
    }
  };
  startCountdown();
  document.getElementById('cancelPayBtn').onclick=()=>{
    location.href='11.订单详情-原型页面.html?order='+encodeURIComponent(orderNo);
  };
  document.querySelectorAll('.ck-pay-method').forEach(el=>{
    el.onclick=()=>{
      document.querySelectorAll('.ck-pay-method').forEach(m=>m.classList.remove('active'));
      el.classList.add('active');
      payChannel=el.dataset.channel;
    };
  });
}

function bindCheckoutEvents(){
  document.querySelectorAll('input[name=channel]').forEach(el=>{
    el.onchange=()=>{payChannel=el.value;};
  });
  bindBeansEvents();
  document.getElementById('orderMsg')?.addEventListener('input',e=>{
    document.getElementById('msgCount').textContent=e.target.value.length;
  });
  document.getElementById('pickAddress')?.addEventListener('click',()=>{
    AddressSelect.open(function(){renderCheckout();});
  });
  document.getElementById('switchAddress')?.addEventListener('click',(e)=>{
    e.preventDefault();
    e.stopPropagation();
    AddressSelect.open(function(){renderCheckout();});
  });
  document.getElementById('pickCoupon')?.addEventListener('click',()=>{
    CouponSelect.setSelected(selectedCoupon);
    CouponSelect.open(goodsTotal(),function(c){
      selectedCoupon=c;
      selectedGiftCards=[];          // 互斥：选券清空礼品卡
      useBeans=null;
      beansOn=false;
      renderCheckout();
    });
  });
  document.getElementById('pickGiftCard')?.addEventListener('click',()=>{
    GiftCardSelect.setSelected(selectedGiftCards);
    GiftCardSelect.open(goodsTotal(),function(cards){
      selectedGiftCards=cards||[];   // 互斥：选卡清空优惠券
      selectedCoupon=null;
      useBeans=null;
      beansOn=false;
      renderCheckout();
    });
  });
  document.querySelectorAll('.qty-min').forEach(btn=>{
    btn.onclick=()=>{
      const idx=+btn.closest('.ck-goods-item').dataset.idx;
      if(items[idx].qty>1){items[idx].qty--;useBeans=null;beansOn=true;renderCheckout();}
    };
  });
  document.querySelectorAll('.qty-plus').forEach(btn=>{
    btn.onclick=()=>{items[+btn.closest('.ck-goods-item').dataset.idx].qty++;useBeans=null;beansOn=true;renderCheckout();};
  });
  document.getElementById('submitBtn').onclick=()=>{
    const addr=currentAddress();
    if(!addr||!addr.name){ProtoToast.warn('请选择收货地址');return;}
    const fee=calcFee();
    if(!guardBeans(fee))return;
    if(fee.payMode==='points'&&fee.beansUsed>BEAN_BALANCE){ProtoToast.warn('苏银豆余额不足，请调整');return;}
    if(fee.payMode!=='points'&&fee.beansUsed>BEAN_BALANCE){ProtoToast.warn('苏银豆余额不足，请调整');return;}
    if(items.some(it=>it.qty>99)){ProtoToast.warn('商品库存不足，请调整数量');return;}
    if(fee.payMode==='points'){
      location.href=SUCCESS+'?type=points&beans='+fee.beansUsed+'&order='+orderNo;
    }else{
      openPayModal(fee);
    }
  };
}

function qrData(channel,amount){return encodeURIComponent(channel+'-pay-'+orderNo+'-'+amount)}
function channelLabel(ch){return ch==='wechat'?'微信支付':'支付宝'}

function openPayModal(fee){
  fee=fee||calcFee();
  clearModalTimer();
  modalTimerSec=15*60;
  document.getElementById('payModalTitle').textContent=channelLabel(payChannel)+'扫码支付';
  renderPayQr(fee);
  document.getElementById('payModal').classList.add('active');
  startModalTimer();
}

function closePayModal(){
  document.getElementById('payModal').classList.remove('active');
  clearModalTimer();
}

function renderPayQr(fee){
  const ch=payChannel;
  const isWechat=ch==='wechat';
  document.getElementById('payModalTitle').textContent=channelLabel(ch)+'扫码支付';
  document.getElementById('payModalBody').innerHTML=`
    <div class="pay-qr-wrap">
      <div class="pay-modal-amt"><p>应付金额</p><em>¥${formatPrice(fee.cashDue)}</em></div>
      ${fee.giftUsed?`<div class="pay-modal-detail">礼品卡已抵扣 ¥${formatPrice(fee.giftUsed)}</div>`:''}
      ${fee.beansUsed?`<div class="pay-modal-detail">苏银豆已抵扣 ${fee.beansUsed.toLocaleString()} 豆（¥${formatPrice(beanToYuan(fee.beansUsed))}）</div>`:''}
      <div class="pay-qr-box ${ch}">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${qrData(ch,fee.cashDue)}" alt="支付二维码">
      </div>
      <div class="pay-qr-tip">请使用<strong>${isWechat?'微信':'支付宝'} App</strong>扫一扫<br>扫描二维码完成支付</div>
      <div class="pay-qr-timer" id="modalPayTimer">二维码有效时间 15:00</div>
      <div class="pay-qr-status"><span class="dot"></span>等待支付中…</div>
      <div class="pay-qr-actions">
        <button type="button" class="pay-modal-btn secondary" id="qrCancelBtn">更换支付方式</button>
        <button type="button" class="pay-modal-btn" id="qrDoneBtn">我已完成支付</button>
      </div>
      <div class="pay-qr-cancel"><a href="javascript:void(0)" id="cancelPayModalBtn">取消支付，查看订单</a></div>
      <div class="pay-qr-fail"><a href="javascript:void(0)" id="qrFailBtn">支付遇到问题？</a></div>
      <div class="pay-qr-switch" id="qrSwitchBtn">切换为${isWechat?'支付宝':'微信'}支付 ›</div>
    </div>`;
  document.getElementById('qrCancelBtn').onclick=closePayModal;
  document.getElementById('qrDoneBtn').onclick=()=>goPaySuccess(fee);
  document.getElementById('qrFailBtn').onclick=()=>goPayFail('fail');
  document.getElementById('cancelPayModalBtn').onclick=()=>{
    closePayModal();
    location.href='11.订单详情-原型页面.html?order='+encodeURIComponent(orderNo);
  };
  document.getElementById('qrSwitchBtn').onclick=()=>{
    payChannel=isWechat?'alipay':'wechat';
    renderPayQr(fee);
  };
}

function goPaySuccess(fee){
  closePayModal();
  const type=fee.payMode==='points'?'points':fee.payMode==='combo'?'combo':'cash';
  location.href=SUCCESS+'?type='+type+'&cash='+fee.cashDue+'&beans='+fee.beansUsed+'&order='+orderNo+'&channel='+payChannel;
}

function startModalTimer(){
  const el=document.getElementById('modalPayTimer');
  if(!el)return;
  clearModalTimer();
  const tick=()=>{
    if(modalTimerSec<=0){goPayFail('timeout');return;}
    const m=String(Math.floor(modalTimerSec/60)).padStart(2,'0');
    const s=String(modalTimerSec%60).padStart(2,'0');
    el.textContent='二维码有效时间 '+m+':'+s;
    modalTimerSec--;
  };
  tick();
  modalTimerId=setInterval(tick,1000);
}

function clearModalTimer(){
  if(modalTimerId){clearInterval(modalTimerId);modalTimerId=null;}
}

function startCountdown(){
  const el=document.getElementById('payTimer');
  if(!el)return;
  const tick=()=>{
    if(countdownSec<=0){el.textContent='订单已超时关闭';document.getElementById('payOnlyBtn').disabled=true;return;}
    const m=String(Math.floor(countdownSec/60)).padStart(2,'0');
    const s=String(countdownSec%60).padStart(2,'0');
    el.textContent='支付剩余时间 '+m+':'+s;
    countdownSec--;
  };
  tick();
  setInterval(tick,1000);
}

document.getElementById('payModal').onclick=e=>{if(e.target.id==='payModal')closePayModal();};

if(isPayOnly){
  renderPayOnly();
}else{
  renderCheckout();
}
</script>
</body>
</html>
