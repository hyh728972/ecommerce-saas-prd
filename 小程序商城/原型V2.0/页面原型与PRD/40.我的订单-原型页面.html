<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的订单 - 苏银豆商城</title>
<link rel="stylesheet" href="../assets/common.css">
<style>
  /* Fix: page-scroll 的 min-height:100vh 未扣除顶栏+标签栏高度，产生约134px幽灵滚动，
     列表尾部被顶到折叠线下。锁定 phone-frame 为一屏、让 page-scroll 吃掉中间空间。 */
  .phone-frame {
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .page-scroll {
    flex: 1;
    min-height: 0;
  }

  /* Tab bar */
  .order-tabs-bar {
    position: sticky;
    top: 88px;
    z-index: 50;
    background: var(--card-bg);
    display: flex;
    border-bottom: 1px solid var(--border-divider);
  }
  .order-tab {
    flex: 1;
    text-align: center;
    padding: var(--space-md) 0;
    font-size: var(--font-sm);
    color: var(--text-secondary);
    cursor: pointer;
    position: relative;
  }
  .order-tab[data-tab="aftersale"] {
    display: none;
  }
  .order-tab.active {
    color: var(--text-color);
    font-weight: 600;
  }
  .order-tab.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 2px;
    background: var(--primary-start);
    border-radius: var(--radius-xs);
  }
  .order-tab .tab-badge {
    position: absolute;
    top: 6px;
    right: calc(50% - 22px);
    background: var(--price-color);
    color: var(--card-bg);
    font-size: var(--font-xs);
    min-width: 14px;
    height: 14px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 var(--space-xs);
  }

  /* Order card */
  .order-list-content {
    padding: var(--space-sm) 0;
  }
  .order-card {
    background: var(--card-bg);
    border-radius: 0;
    margin-bottom: var(--space-md);
    overflow: visible;
  }
  .order-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-md) 12px 8px;
    border-bottom: 1px solid var(--bg-color);
  }
  .order-card-header .order-no {
    font-size: var(--font-sm);
    color: var(--text-tertiary);
  }
  .order-card-header .order-status {
    font-size: var(--font-sm);
    font-weight: 600;
    color: var(--primary-start);
  }
  .order-card-header .order-status.completed,
  .order-card-header .order-status.reviewed,
  .order-card-header .order-status.cancelled,
  .order-card-header .order-status.closed {
    color: var(--text-tertiary);
  }
  .order-card-header .order-status.after-sale-header {
    font-size: var(--font-sm);
    font-weight: 600;
    color: var(--primary-start);
  }

  /* Package summary */
  .package-summary {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    padding: var(--space-sm) 12px 0;
    font-size: var(--font-sm);
    color: var(--text-tertiary);
  }
  .package-summary .pkg-tag {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 1px var(--space-sm);
    border-radius: var(--radius-xs);
    font-size: var(--font-xs);
  }
  .package-summary .pkg-tag.shipping { background: var(--warning-bg); color: var(--warning-color); }
  .package-summary .pkg-tag.pending { background: var(--info-bg); color: var(--info-color); }
  .package-summary .pkg-tag.delivered { background: var(--success-bg); color: var(--success-color); }

  .order-card-body {
    padding: 4px 12px 8px;
    cursor: pointer;
  }
  /* 商品行：图 | 标题+规格 | 右侧价/数量 */
  .order-product-row {
    display: flex;
    gap: 10px;
    padding: 10px 0;
  }
  .order-product-row .op-img {
    width: 72px;
    height: 72px;
    border-radius: 6px;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--bg-input);
  }
  .order-product-row .op-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .order-product-row .op-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .order-product-row .op-line {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .order-product-row .op-name {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    color: #262626;
    line-height: 1.4;
    font-weight: 400;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .order-product-row .op-price {
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 400;
    color: #262626;
    line-height: 1.4;
    text-align: right;
  }
  .order-product-row .op-spec {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    color: #999;
    line-height: 1.35;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .order-product-row .op-qty {
    flex-shrink: 0;
    font-size: 12px;
    color: #999;
    line-height: 1.35;
    text-align: right;
  }
  .order-product-row.is-combo-row {
    flex-wrap: wrap;
    align-items: flex-start;
    column-gap: 10px;
    row-gap: 6px;
  }
  .order-product-row .prod-combo-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1 1 100%;
    width: 100%;
    min-width: 0;
    min-height: 44px;
    padding: 6px 8px;
    background: var(--bg-color);
    border-radius: 4px;
    text-decoration: none;
    color: inherit;
    line-height: 1.35;
    cursor: pointer;
    box-sizing: border-box;
  }
  .order-product-row .prod-combo-bar:active { opacity: 0.85; }
  .order-product-row .prod-combo-bar .pcb-thumbs {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .order-product-row .prod-combo-bar .pcb-thumb {
    width: 32px;
    height: 32px;
    border-radius: 4px;
    overflow: hidden;
    background: var(--card-bg);
  }
  .order-product-row .prod-combo-bar .pcb-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .order-product-row .prod-combo-bar .pcb-text {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    color: #999;
    font-weight: 400;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .order-product-row .prod-combo-bar .pcb-arrow {
    flex-shrink: 0;
    color: var(--text-light);
    font-size: 12px;
    line-height: 1;
  }
  /* 售后进度条：挂在该商品规格下方（部分售后） */
  .op-aftersale-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    padding: 6px 8px;
    background: var(--bg-color);
    border-radius: 4px;
    text-decoration: none;
    color: inherit;
    line-height: 1.35;
  }
  .op-aftersale-bar:active { opacity: 0.85; }
  .op-aftersale-bar .op-as-text {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    color: var(--primary-start);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .op-aftersale-bar .op-as-arrow {
    flex-shrink: 0;
    color: var(--text-light);
    font-size: 12px;
    line-height: 1;
  }

  /* 待收货拆单 + 物流条（对齐 order_detail 包裹块） */
  .ol-package-block + .ol-package-block {
    border-top: 1px solid var(--bg-color);
  }
  /* 多包裹：列表仅一条物流摘要 */
  .ol-pkg-summary {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0 2px;
    padding: 8px 10px;
    background: var(--bg-color);
    border-radius: 4px;
    text-decoration: none;
    color: inherit;
  }
  .ol-pkg-summary:active { opacity: 0.85; }
  .ol-pkg-summary .ol-ps-icon {
    flex-shrink: 0;
    display: flex;
    color: var(--primary-start);
  }
  .ol-pkg-summary .ol-ps-icon svg { width: 16px; height: 16px; }
  .ol-pkg-summary .ol-ps-text {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    color: #262626;
    line-height: 1.4;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ol-pkg-summary .ol-ps-text em {
    color: var(--primary-start);
    font-style: normal;
    font-weight: 500;
  }
  .ol-pkg-summary .ol-ps-arrow {
    flex-shrink: 0;
    color: var(--text-light);
    display: flex;
  }
  .ol-pkg-summary .ol-ps-arrow svg { width: 12px; height: 12px; }
  .ol-package-products {
    padding: var(--space-sm) 12px 4px;
  }
  .order-card-footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-sm) 12px 12px;
    border-top: 1px solid var(--bg-color);
    gap: var(--space-sm) 0;
  }
  .order-card-footer .total-text {
    font-size: var(--font-sm);
    color: var(--text-secondary);
    flex: 1 1 100%;
    text-align: right;
  }
  .order-card-footer .total-text b { color: var(--text-color); font-size: var(--font-md); }
  .order-card-footer .action-btns {
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: var(--space-sm);
    margin-left: auto;
    min-width: 0;
    position: relative;
  }
  .action-more-wrap {
    position: relative;
    flex-shrink: 0;
  }
  .action-more-trigger {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 28px;
    padding: 0;
    border-radius: var(--radius-lg);
    font-size: var(--font-sm);
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    box-sizing: border-box;
    -webkit-appearance: none;
    appearance: none;
  }
  .action-more-trigger:active { opacity: 0.7; }
  .action-more-panel {
    display: none;
    position: absolute;
    left: 0;
    right: auto;
    bottom: calc(100% + 6px);
    min-width: 132px;
    background: var(--card-bg);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border-divider);
    z-index: 80;
    overflow: hidden;
  }
  .action-more-panel.is-open { display: block; }
  .btn-sm {
    padding: 6px 14px;
    border-radius: 4px;
    font-size: var(--font-sm);
    cursor: pointer;
    border: none;
    background: var(--bg-color);
    color: var(--text-color);
    text-decoration: none;
    line-height: 1.2;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .btn-sm:active { opacity: 0.7; }
  .btn-sm.primary {
    border: none;
    background: var(--selected-bg);
    color: var(--primary-start);
    font-weight: 600;
  }
  .btn-sm.danger {
    border: none;
    background: var(--selected-bg);
    color: var(--price-color);
    font-weight: 600;
  }

  /* Empty */
  .order-empty {
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 60px var(--space-xl);
    gap: var(--space-md);
  }
  .order-empty svg { width: 64px; height: 64px; color: var(--text-disabled); }
  .order-empty p { font-size: var(--font-base); color: var(--text-tertiary); }
  .order-empty a {
    background: linear-gradient(135deg, var(--primary-start), var(--price-color));
    color: var(--card-bg);
    padding: var(--space-sm) 24px;
    border-radius: var(--radius-xl);
    font-size: var(--font-base);
  }
</style>
</head>

  function getAfterSaleTypeKey(order) {

  /**
   * 渲染单个商品行 HTML（订单卡片内复用）。
   * @param {{ id: string, products: Array }} order 订单对象
   * @param {{ name: string, spec: string, price: string, qty: number, img: string, hasAfterSales?: boolean, afterSaleCase?: string }} p 商品行
   * @returns {string}
   */
  function buildOrderProductRowHtml(order, p) {
    var rowClass = 'order-product-row' + (p.comboBar ? ' is-combo-row' : '');
    var saleCaseForLine = p.afterSaleCase || order.afterSaleCase || 'refund_return_approved';
    var detailLink = '52.售后详情-原型页面.html?case=' + encodeURIComponent(saleCaseForLine) + '&orderId=' + encodeURIComponent(order.id);
    var aftersaleLinkHtml = '';
    if (shouldShowAftersaleDetailBelowProduct(order, p)) {
      aftersaleLinkHtml =
        '<a href="' + detailLink + '" class="op-aftersale-bar" onclick="event.stopPropagation()">' +
          '<span class="op-as-text">' + getAfterSaleProgressText(saleCaseForLine) + '</span>' +
          '<span class="op-as-arrow">&gt;</span>' +
        '</a>';
    }
    var comboBarHtml = '';
    if (p.comboBar) {
      var thumbs = (p.comboBar.thumbs || []).map(function(src) {
        return '<div class="pcb-thumb"><img src="' + src + '" alt=""></div>';
      }).join('');
      comboBarHtml =
        '<div class="prod-combo-bar">' +
          '<div class="pcb-thumbs">' + thumbs + '</div>' +
          '<span class="pcb-text">' + (p.comboBar.text || '含多个子件') + '</span>' +
          '<span class="pcb-arrow">&gt;</span>' +
        '</div>';
    }
    return '<div class="' + rowClass + '">' +
      '<a href="21.商品详情-原型页面.html" class="op-img" onclick="event.stopPropagation()"><img src="' + p.img + '" alt=""></a>' +
      '<div class="op-main">' +
        '<div class="op-line">' +
          '<div class="op-name">' + p.name + '</div>' +
          '<div class="op-price">' + (/^[\d.]+$/.test(String(p.price)) ? '&yen;' + p.price : p.price) + '</div>' +
        '</div>' +
        '<div class="op-line">' +
          '<div class="op-spec">' + (p.spec || '') + '</div>' +
          '<div class="op-qty">&times;' + p.qty + '</div>' +
        '</div>' +
        aftersaleLinkHtml +
      '</div>' +
      comboBarHtml +
    '</div>';
  }

  /**
   * 多包裹订单列表：商品行 + 一条物流摘要（包裹细节进详情/物流页）。
   * @param {{ packages?: Array, products: Array, id: string }} order 订单对象
   * @returns {string}
   */
  function buildPackageLogisticsSummaryHtml(order) {
    var pkgs = order.packages || [];
    var n = pkgs.length;
    if (!n) return '';
    var parts = pkgs.map(function(pkg) {
      return (pkg.no || '包裹') + (pkg.statusText || '');
    });
    var text = n + '个包裹 · ' + parts.join('，');
    return '<a href="43.物流追踪-原型页面.html" class="ol-pkg-summary" onclick="event.stopPropagation()">' +
      '<span class="ol-ps-icon">' + orderListTruckSvg + '</span>' +
      '<span class="ol-ps-text">' + text + '</span>' +
      '<span class="ol-ps-arrow">' + orderListArrowSvg + '</span>' +
    '</a>';
  }

  /**
   * 多包裹列表体：平铺商品 + 一条物流摘要（不再按包裹拆按钮）。
   * @param {{ id: string, packages: Array, products: Array }} order 订单对象
   * @returns {string}
   */
  function buildSplitPackageBodyHtml(order) {
    var html = '';
    order.products.forEach(function(p) {
      html += buildOrderProductRowHtml(order, p);
    });
    html += buildPackageLogisticsSummaryHtml(order);
    return html;
  }

  /**
   * 为订单列表绑定「更多」菜单点击（仅初始化一次，事件委托在 #orderList）。
   */
  function bindOrderListActionMoreMenusOnce() {
    var listEl = document.getElementById('orderList');
    if (!listEl || listEl.dataset.actionMoreBound === '1') return;
    listEl.dataset.actionMoreBound = '1';
    listEl.addEventListener('click', function(e) {
      var trigger = e.target.closest('.action-more-trigger');
      if (trigger) {
        e.preventDefault();
        e.stopPropagation();
        var wrap = trigger.closest('.action-more-wrap');
        var panel = wrap && wrap.querySelector('.action-more-panel');
        if (!panel) return;
        var willOpen = !panel.classList.contains('is-open');
        listEl.querySelectorAll('.action-more-panel.is-open').forEach(function(p) {
          p.classList.remove('is-open');
        });
        if (willOpen) panel.classList.add('is-open');
        return;
      }
      if (!e.target.closest('.action-more-wrap')) {
        listEl.querySelectorAll('.action-more-panel.is-open').forEach(function(p) {
          p.classList.remove('is-open');
        });
      }
    });
  }

  /**
   * 将售后相关操作插入订单底部按钮区（去重）。
   * @param {string[]} actionList 已有操作文案列表
   * @param {{ status: string, id: string, hasAfterSales?: boolean, products?: Array }} order 订单对象
   */
  function mergeAfterSaleActions(actionList, order) {
    if (order.noOnlineAfterSale) return;
    if (order.hasAfterSales) {
      if (actionList.indexOf('售后') === -1) actionList.unshift('售后');
      return;
    }
    if (order.products && order.products.length === 1 && productLineHasAfterSales(order.products[0])) {
      if (actionList.indexOf('售后') === -1) actionList.unshift('售后');
      return;
    }
    if (isUnshippedRefundOnlyPhase(order)) {
      if (actionList.indexOf('仅退款') === -1) actionList.unshift('仅退款');
      return;
    }
    if (isShippedReturnPhase(order)) {
      if (actionList.indexOf('退换/售后') === -1) {
        actionList.unshift('退换/售后');
      }
    }
  }

  function renderOrders() {
    var filtered = getFilteredOrders();
    if (filtered.length === 0) {
      document.getElementById('orderList').innerHTML =
        '<div class="order-empty" style="display:flex;">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 10h20"/></svg>' +
          '<p>暂无相关订单</p>' +
          '<a href="10.首页-原型页面.html">去逛逛</a>' +
        '</div>';
      return;
    }

    var html = '';
    filtered.forEach(function(order) {
      var deliveredView = useDeliveredTabDisplayForOrder(order);
      var useSplitLayout = useOrderListPackageSplitLayout(order);
      var prodsHtml = '';
      if (useSplitLayout) {
        prodsHtml = buildSplitPackageBodyHtml(order);
      } else {
        order.products.forEach(function(p, idx) {
          prodsHtml += buildOrderProductRowHtml(order, p);
          if (deliveredView && !order.skipLogisticsStrip) {
            prodsHtml += buildProductLogisticsStripHtml(order, idx, null);
          }
        });
      }

      var pkgHtml = '';
      if (order.packages && !useSplitLayout) {
        pkgHtml = '<div class="package-summary">';
        order.packages.forEach(function(pkg) {
          pkgHtml += '<span class="pkg-tag ' + pkg.status + '">' + pkg.no + '：' + pkg.statusText + '</span>';
        });
        pkgHtml += '</div>';
      }

      var actionsHtml = '';
      var actionList = order.actions.slice();
      mergeAfterSaleActions(actionList, order);
      actionList = actionList.filter(function(a) { return a !== '查看详情'; });
      if (useSplitLayout) {
        if (actionList.indexOf('查看物流') === -1) actionList.push('查看物流');
      }
      if (deliveredView && !order.noOnlineAfterSale && actionList.indexOf('确认收货') === -1) {
        actionList.push('确认收货');
      }
      if (currentTab === 'all' || currentTab === 'closed' || currentTab === 'shipped') {
        actionList = actionList.map(function(a) {
          return a === '售后' ? '售后详情' : a;
        });
      }
      actionList = actionList.filter(function(a) {
        return a !== '售后' && a !== '售后详情';
      });
      // 多包裹列表：卡底最多 退换/售后、查看物流、确认收货
      if (useSplitLayout) {
        var splitAllow = { '退换/售后': 1, '查看物流': 1, '确认收货': 1, '仅退款': 1 };
        actionList = actionList.filter(function(a) { return !!splitAllow[a]; });
        if (actionList.indexOf('退换/售后') !== -1) {
          actionList = actionList.filter(function(a) { return a !== '仅退款'; });
        }
        var splitOrder = ['退换/售后', '仅退款', '查看物流', '确认收货'];
        actionList.sort(function(a, b) {
          return splitOrder.indexOf(a) - splitOrder.indexOf(b);
        });
      }
      actionList.forEach(function(a, i) {
        var cls = i === actionList.length - 1 ? ' primary' : '';
        if (a === '去支付') cls = ' danger';
        var href = '#';
        if (a === '确认收货') href = getOrderDetailUrl(order);
        if (a === '查看物流') href = '43.物流追踪-原型页面.html';
        if (a === '去支付') href = '32.订单支付-原型页面.html';
        if (a === '取消订单') href = '42.取消订单-原型页面.html';
        if (a === '仅退款') href = getApplyRefundOnlyUrl(order.id);
        if (a === '退换/售后') href = '51.申请售后-原型页面.html?orderId=' + encodeURIComponent(order.id);
        if (a === '评价') href = '61.发表评价-原型页面.html';
        if (a === '再次购买') href = '21.商品详情-原型页面.html';
        if (a === '联系客服') href = '91.在线客服-原型页面.html';
        if (a === '联系商家') href = '91.在线客服-原型页面.html';
        if (a === '查看取票码') href = getOrderDetailUrl(order);
        actionsHtml += '<a href="' + href + '" class="btn-sm' + cls + '" onclick="event.stopPropagation()">' + a + '</a>';
      });

      var amountLabel = (order.status === 'pending' || order.status === 'closed') ? '待付款' : '实付款';
      var totalHtml = '共' + order.products.reduce(function(s, p) { return s + p.qty; }, 0) + '件商品 ' + amountLabel + ' ';
      if (order.payMode === 'beans') {
        totalHtml += '<b>&yen;0.00</b>';
      } else if (order.payMode === 'combo') {
        totalHtml += '<b>&yen;' + order.cashPaid + '</b>';
      } else {
        totalHtml += '<b>&yen;' + order.total + '</b>';
      }
      if (order.closeReason) {
        totalHtml += '（' + order.closeReason + '）';
      }

      var headerStatusText = order.statusText;
      var headerStatusClass = 'order-status ' + order.status;
      if (currentTab === 'aftersale') {
        headerStatusText = getAfterSaleTypeLabel(order);
        headerStatusClass = 'order-status after-sale-header type-' + getAfterSaleTypeKey(order);
      } else if (deliveredView) {
        headerStatusText = getDeliveredTabOrderStatusLabel(order);
      } else if (currentTab === 'all') {
        headerStatusText = getAllTabOrderStatusLabel(order);
      }

      html += '<div class="order-card">' +
        '<div class="order-card-header">' +
          '<span class="order-no">' + getOrderDate(order.id) + '</span>' +
          '<span class="' + headerStatusClass + '">' + headerStatusText + '</span>' +
        '</div>' +
        '<div class="order-card-body" onclick="location.href=\'' + getOrderDetailUrl(order) + '\'">' + prodsHtml + '</div>' +
        pkgHtml +
        '<div class="order-card-footer">' +
          '<span class="total-text">' + totalHtml + '</span>' +
          '<div class="action-btns">' + actionsHtml + '</div>' +
        '</div>' +
      '</div>';
    });
    document.getElementById('orderList').innerHTML = html;

    var aftersaleCount = 0;
    var deliveredCount = 0;
    orders.forEach(function(o) {
      if (orderQualifiesForAftersaleTab(o)) aftersaleCount++;
      if (isDeliveredLikeStatus(o) && !orderQualifiesForAftersaleTab(o)) deliveredCount++;
    });
    var deliveredBadge = document.getElementById('deliveredTabBadge');
    if (deliveredBadge) {
      if (deliveredCount > 0) {
        deliveredBadge.textContent = String(deliveredCount);
        deliveredBadge.style.display = 'flex';
      } else {
        deliveredBadge.style.display = 'none';
      }
    }
    var badgeEl = document.getElementById('aftersaleTabBadge');
    if (badgeEl) {
      if (aftersaleCount > 0) {
        badgeEl.textContent = String(aftersaleCount);
        badgeEl.style.display = 'flex';
      } else {
        badgeEl.style.display = 'none';
      }
    }
  }

  // Tab switch
  document.querySelectorAll('.order-tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.order-tab').forEach(function(t) { t.classList.remove('active'); });
      this.classList.add('active');
      currentTab = this.dataset.tab;
      renderOrders();
    });
  });

  // 初始 Tab 高亮与 currentTab 对齐（默认 HTML 中为 all）
  document.querySelectorAll('.order-tab').forEach(function(t) {
    t.classList.toggle('active', t.dataset.tab === currentTab);
  });

  bindOrderListActionMoreMenusOnce();
  renderOrders();
})();
</script>
<script src="../assets/theme-switcher.js"></script>
</body>
</html>
