<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>删除确认 · 弹窗</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { background: transparent; margin: 0; }
    .csm-body { width: 380px; max-width: 92vw; }
    .csm-confirm { padding: 24px 24px 8px; }
    .csm-foot { padding: 8px 20px 18px; }
  </style>
</head>
<body>
  <div class="csm-body">
    <div class="csm-confirm">
      <div class="csm-icon danger">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
      </div>
      <div class="csm-title" id="dlgTitle">确认删除？</div>
      <div class="csm-desc" id="dlgDesc">删除后不可恢复，请谨慎操作。</div>
    </div>
    <div class="csm-foot">
      <button class="btn-default" onclick="window.csModalBridge.close()">取消</button>
      <button class="btn-danger" id="confirmBtn">确认删除</button>
    </div>
  </div>

  <script src="../js/cs-modal.js"></script>
  <script>
    // 支持通过 URL 参数自定义标题/描述，一个文件复用于多处删除确认
    (function () {
      var p = new URLSearchParams(location.search);
      var t = p.get('title'), d = p.get('desc');
      if (t) document.getElementById('dlgTitle').textContent = decodeURIComponent(t);
      if (d) document.getElementById('dlgDesc').innerHTML = decodeURIComponent(d);
    })();
    document.getElementById('confirmBtn').addEventListener('click', function () {
      window.csModalBridge.confirm({ action: 'delete' });
    });
  </script>
</body>
</html>
