<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>选择客户 · 抽屉</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { background:#fff; margin:0; }
    .dw-body { display:flex; flex-direction:column; height:100vh; }
    .drawer-head { padding:16px 24px; border-bottom:1px solid var(--cs-border-light); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
    .drawer-head .title { font-size:16px; font-weight:600; }
    .drawer-head .close { font-size:20px; color:var(--cs-text-tertiary); cursor:pointer; line-height:1; }
    .drawer-body { flex:1; min-height:0; overflow-y:auto; padding:12px 24px; }

    /* 搜索框(现有 picker 都没有,本选择器核心差异) */
    .search-box { margin-bottom:12px; }
    .search-box input { width:100%; padding:8px 12px; border:1px solid var(--cs-border); border-radius:var(--cs-radius-sm); font-size:13px; font-family:inherit; outline:none; transition:border-color .15s; }
    .search-box input:focus { border-color:var(--cs-primary); box-shadow:0 0 0 2px rgba(22,119,255,0.1); }

    /* 客户列表项 */
    .cust-list { display:flex; flex-direction:column; gap:10px; }
    .cust-item { border:1px solid var(--cs-border-light); border-radius:var(--cs-radius-md); padding:12px 14px; cursor:pointer; background:#fff; position:relative; transition:border-color .15s, box-shadow .15s; display:flex; gap:12px; align-items:center; }
    .cust-item:hover { border-color:var(--cs-primary); }
    .cust-item.selected { border-color:var(--cs-primary); background:var(--cs-primary-bg); box-shadow:0 0 0 2px rgba(22,119,255,0.12); }
    .cust-item.selected::after { content:"✓"; position:absolute; top:10px; right:12px; width:18px; height:18px; border-radius:50%; background:var(--cs-primary); color:#fff; font-size:12px; line-height:18px; text-align:center; }
    .cust-avatar { width:36px; height:36px; border-radius:50%; background:var(--cs-primary-bg); color:var(--cs-primary); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; flex-shrink:0; }
    .cust-info { flex:1; min-width:0; }
    .cust-name { font-size:14px; font-weight:600; color:var(--cs-text); }
    .cust-meta { font-size:12px; color:var(--cs-text-tertiary); margin-top:2px; }
    .cust-tags { margin-top:5px; display:flex; gap:4px; flex-wrap:wrap; }
    .cust-tag { font-size:11px; padding:1px 6px; border-radius:3px; background:var(--cs-bg-header); color:var(--cs-text-secondary); }
    .cust-tag.vip { background:#fff7e6; color:var(--cs-orange); }

    .empty-state { text-align:center; padding:48px 16px; color:var(--cs-text-tertiary); }
    .empty-state .es-text { font-size:13px; }

    .drawer-foot { padding:12px 24px; border-top:1px solid var(--cs-border-light); display:flex; justify-content:flex-end; gap:8px; flex-shrink:0; }
    .drawer-foot .btn-default { padding:7px 16px; border:1px solid var(--cs-border); border-radius:var(--cs-radius-sm); background:#fff; font-size:13px; cursor:pointer; color:var(--cs-text-secondary); }
    .drawer-foot .btn-primary { padding:7px 16px; border:none; border-radius:var(--cs-radius-sm); background:var(--cs-primary); color:#fff; font-size:13px; cursor:pointer; }
    .drawer-foot .btn-primary:disabled { background:var(--cs-border); cursor:not-allowed; }
  </style>
</head>
<body>
  <div class="dw-body">
    <div class="drawer-head">
      <div class="title">选择客户</div>
      <div class="close" onclick="window.csModalBridge.close()">×</div>
    </div>
    <div class="drawer-body">
      <div class="search-box"><input id="searchInput" placeholder="搜索 手机号 / 昵称 / 用户ID" /></div>
      <div class="cust-list" id="custList"><!-- JS 渲染 --></div>
    </div>
    <div class="drawer-foot">
      <button class="btn-default" onclick="window.csModalBridge.close()">取消</button>
      <button class="btn-primary" id="confirmBtn" disabled>确认选择</button>
    </div>
  </div>

  <script src="../js/cs-modal.js"></script>
  <script>
    /* mock 客户数据(1 期;正式接口 GET /api/backend/customer/search?keyword=) */
    var CUSTOMERS = [
      { user_id:'U20260710001', name:'陈芳',   phone:'138****2891', level:'黄金会员', tags:['高价值','常客'] },
      { user_id:'U20260710002', name:'刘洋',   phone:'139****5678', level:'普通会员', tags:[] },
      { user_id:'U20260710003', name:'周婷婷', phone:'137****1024', level:'白银会员', tags:['退货多'] },
      { user_id:'U20260710004', name:'赵磊',   phone:'135****8821', level:'黄金会员', tags:[] },
      { user_id:'U20260710005', name:'王志强', phone:'159****6601', level:'普通会员', tags:[] },
      { user_id:'U20260710006', name:'陈思雨', phone:'186****0452', level:'VIP',      tags:['VIP','高净值'] },
      { user_id:'U20260710007', name:'孙莉',   phone:'136****4477', level:'白银会员', tags:[] },
      { user_id:'U20260710008', name:'吴强',   phone:'133****6290', level:'普通会员', tags:[] }
    ];
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }

    var listEl = document.getElementById('custList');
    var confirmBtn = document.getElementById('confirmBtn');
    var searchInput = document.getElementById('searchInput');
    var selectedCust = null;

    function render(keyword) {
      var kw = (keyword || '').trim().toLowerCase();
      var filtered = CUSTOMERS.filter(function (c) {
        if (!kw) return true;
        return (c.name || '').toLowerCase().indexOf(kw) >= 0
            || (c.phone || '').indexOf(kw) >= 0
            || (c.user_id || '').toLowerCase().indexOf(kw) >= 0;
      });
      listEl.innerHTML = '';
      if (!filtered.length) {
        listEl.innerHTML = '<div class="empty-state"><div class="es-text">未找到匹配客户</div></div>';
        return;
      }
      filtered.forEach(function (c) {
        var div = document.createElement('div');
        div.className = 'cust-item';
        var tagsHtml = (c.tags || []).map(function (t) {
          return '<span class="cust-tag' + (t === 'VIP' ? ' vip' : '') + '">' + esc(t) + '</span>';
        }).join('');
        if (c.level) tagsHtml += '<span class="cust-tag">' + esc(c.level) + '</span>';
        div.innerHTML =
            '<div class="cust-avatar">' + esc((c.name || '?').charAt(0)) + '</div>'
          + '<div class="cust-info">'
          +   '<div class="cust-name">' + esc(c.name) + '</div>'
          +   '<div class="cust-meta">' + esc(c.phone) + ' · ' + esc(c.user_id) + '</div>'
          +   '<div class="cust-tags">' + tagsHtml + '</div>'
          + '</div>';
        div.addEventListener('click', function () {
          var all = listEl.querySelectorAll('.cust-item');
          for (var i = 0; i < all.length; i++) all[i].classList.remove('selected');
          div.classList.add('selected');
          selectedCust = c;
          confirmBtn.disabled = false;
        });
        listEl.appendChild(div);
      });
    }
    searchInput.addEventListener('input', function () { render(searchInput.value); });
    render('');

    confirmBtn.addEventListener('click', function () {
      if (!selectedCust) return;
      window.csModalBridge.confirm({
        user_id: selectedCust.user_id, name: selectedCust.name,
        phone: selectedCust.phone, level: selectedCust.level, tags: selectedCust.tags
      });
    });
  </script>
</body>
</html>
