<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>分配留言处理人 · 抽屉</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { background: #fff; margin: 0; }
    .dw-body { display: flex; flex-direction: column; height: 100vh; }
    .drawer-head {
      padding: 16px 24px; border-bottom: 1px solid var(--cs-border-light);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .drawer-head .title { font-size: 16px; font-weight: 600; }
    .drawer-head .close { font-size: 20px; color: var(--cs-text-tertiary); cursor: pointer; line-height: 1; }
    .drawer-body { flex: 1; min-height:0; overflow-y: auto; padding: 20px 24px; }
    .drawer-foot {
      padding: 12px 24px; border-top: 1px solid var(--cs-border-light);
      display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0;
    }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 13px; color: var(--cs-text-secondary); margin-bottom: 6px; }
    .form-label .required { color: var(--cs-danger); margin-left: 2px; }
    .form-select, .form-textarea {
      width: 100%; border: 1px solid var(--cs-border); border-radius: 6px;
      padding: 8px 12px; font-size: 13px; font-family: inherit; background: #fff;
      outline: none; transition: border-color 0.15s;
    }
    .form-select { height: 36px; cursor: pointer; }
    .form-select:focus, .form-textarea:focus { border-color: var(--cs-primary); box-shadow: 0 0 0 2px rgba(22,119,255,0.1); }
    .form-textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
    .msg-detail-box {
      background: #f6f8fa; border: 1px solid var(--cs-border-light);
      border-radius: 6px; padding: 12px 14px; margin-bottom: 18px;
    }
    .msg-detail-box .detail-row { display: flex; font-size: 13px; padding: 4px 0; }
    .msg-detail-box .detail-label { color: var(--cs-text-tertiary); width: 70px; flex-shrink: 0; }
    .msg-detail-box .detail-content { color: var(--cs-text); }
    .msg-detail-box .detail-msg {
      margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e8e8e8;
      font-size: 13px; color: var(--cs-text-secondary); line-height: 1.6;
    }
    .tag-urgent { display: inline-block; padding: 2px 8px; background: var(--cs-danger-bg); color: var(--cs-danger); border: 1px solid #ffccc7; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="dw-body">
    <div class="drawer-head">
      <div class="title">分配留言处理人</div>
      <div class="close" onclick="window.csModalBridge.close()">×</div>
    </div>
    <div class="drawer-body">
      <div class="msg-detail-box">
        <div class="detail-row"><span class="detail-label">留言人</span><span class="detail-content">李婷婷 · 138****6621</span></div>
        <div class="detail-row"><span class="detail-label">分类</span><span class="detail-content"><span class="tag-urgent">退款/退货</span></span></div>
        <div class="detail-row"><span class="detail-label">提交时间</span><span class="detail-content">06-11 09:32（25 分钟前）</span></div>
        <div class="detail-msg">订单 #20260611039 申请退款两天了还没到账，麻烦尽快处理，谢谢！</div>
      </div>

      <div class="form-group">
        <label class="form-label">处理人 <span class="required">*</span></label>
        <select class="form-select" id="assignee">
          <option value="">请选择处理人</option>
          <option value="王小明">王小明（退款专员 · 在线）</option>
          <option value="李娜">李娜（售后客服 · 在线）</option>
          <option value="赵强">赵强（综合客服 · 离线）</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">优先级</label>
        <select class="form-select" id="priority">
          <option value="normal">普通</option>
          <option value="urgent" selected>紧急</option>
          <option value="critical">非常紧急</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">分配备注（可选）</label>
        <textarea class="form-textarea" id="note" placeholder="给处理人的说明，如：用户较急，建议优先处理退款到账问题..."></textarea>
      </div>
    </div>
    <div class="drawer-foot">
      <button class="btn-default" onclick="window.csModalBridge.close()">取消</button>
      <button class="btn-primary" id="confirmBtn">确认分配</button>
    </div>
  </div>

  <script src="../js/cs-modal.js"></script>
  <script>
    document.getElementById('confirmBtn').addEventListener('click', function () {
      var sel = document.getElementById('assignee');
      if (!sel.value) {
        sel.style.borderColor = 'var(--cs-danger)'; sel.focus();
        setTimeout(function () { sel.style.borderColor = ''; }, 1500);
        return;
      }
      window.csModalBridge.confirm({
        assignee: sel.value,
        priority: document.getElementById('priority').value,
        note: document.getElementById('note').value.trim()
      });
    });
  </script>
</body>
</html>
