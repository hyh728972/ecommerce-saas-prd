<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>结束会话 · 弹窗</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { background: transparent; margin: 0; }
    .csm-body { width: 380px; max-width: 92vw; }
    .csm-confirm { padding: 24px 24px 8px; }
    .csm-foot { padding: 8px 20px 18px; }
  </style>
</head>
<body>
  <div class="csm-body">
    <div class="csm-confirm">
      <div class="csm-icon warn">!</div>
      <div class="csm-title">确认结束本次会话？</div>
      <div class="csm-desc">结束后会话状态变为「已关闭」，<br/>将向用户推送满意度评价邀请。</div>
    </div>
    <div class="csm-foot">
      <button class="btn-default" onclick="window.csModalBridge.close()">取消</button>
      <button class="btn-primary" id="confirmBtn">确认结束</button>
    </div>
  </div>

  <script src="../js/cs-modal.js"></script>
  <script>
    document.getElementById('confirmBtn').addEventListener('click', function () {
      window.csModalBridge.confirm({ action: 'end' });
    });
  </script>
</body>
</html>
