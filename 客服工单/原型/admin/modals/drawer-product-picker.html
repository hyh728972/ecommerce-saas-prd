<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>选择商品发送 · 抽屉</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { background: #fff; margin: 0; }
    .dw-body { display: flex; flex-direction: column; height: 100vh; }
    .drawer-head {
      padding: 16px 24px; border-bottom: 1px solid var(--cs-border-light);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .drawer-head .title { font-size: 16px; font-weight: 600; }
    .drawer-head .title .sub { font-size: 12px; font-weight: 400; color: var(--cs-text-tertiary); margin-left: 8px; }
    .drawer-head .close { font-size: 20px; color: var(--cs-text-tertiary); cursor: pointer; line-height: 1; }
    .drawer-body { flex: 1; min-height:0; overflow-y: auto; padding: 16px 24px; }
    .drawer-body .tip {
      font-size: 12px; color: var(--cs-text-tertiary); margin-bottom: 12px;
      padding: 8px 10px; background: var(--cs-primary-bg); border-radius: var(--cs-radius-sm);
    }

    /* 商品列表项 */
    .product-list { display: flex; flex-direction: column; gap: 10px; }
    .product-item {
      border: 1px solid var(--cs-border-light); border-radius: var(--cs-radius-md);
      padding: 12px 14px; cursor: pointer; background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s; position: relative;
    }
    .product-item:hover { border-color: var(--cs-primary); }
    .product-item.selected {
      border-color: var(--cs-primary); background: var(--cs-primary-bg);
      box-shadow: 0 0 0 2px rgba(22,119,255,0.12);
    }
    .product-item.selected::after {
      content: "✓"; position: absolute; top: 10px; right: 12px;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--cs-primary); color: #fff;
      font-size: 12px; line-height: 18px; text-align: center;
    }
    .product-item .pi-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 6px;
    }
    .product-item .pi-name { font-size: 13px; font-weight: 600; color: var(--cs-text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 24px; }
    .product-item .pi-stock {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; font-weight: 500;
    }
    .product-item .pi-stock::before { content: ""; width: 6px; height: 6px; border-radius: 50%; }
    .product-item .pi-stock.in-stock::before { background: var(--cs-success); }
    .product-item .pi-stock.in-stock { color: var(--cs-success); }
    .product-item .pi-stock.out-stock::before { background: var(--cs-danger); }
    .product-item .pi-stock.out-stock { color: var(--cs-danger); }
    .product-item .pi-spec {
      font-size: 12px; color: var(--cs-text-secondary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      margin-bottom: 6px;
    }
    .product-item .pi-bottom {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; color: var(--cs-text-tertiary);
    }
    .product-item .pi-sku { font-size: 11px; color: var(--cs-text-tertiary); }
    .product-item .pi-price { font-size: 14px; font-weight: 600; color: var(--cs-text); }

    .empty-state { text-align: center; padding: 48px 16px; color: var(--cs-text-tertiary); }
    .empty-state .es-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.5; }
    .empty-state .es-text { font-size: 13px; }

    .drawer-foot {
      padding: 12px 24px; border-top: 1px solid var(--cs-border-light);
      display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0;
    }
    .drawer-foot .btn-default {
      padding: 7px 16px; border: 1px solid var(--cs-border); border-radius: var(--cs-radius-sm);
      background: #fff; font-size: 13px; cursor: pointer; color: var(--cs-text-secondary);
    }
    .drawer-foot .btn-primary {
      padding: 7px 16px; border: none; border-radius: var(--cs-radius-sm);
      background: var(--cs-primary); color: #fff; font-size: 13px; cursor: pointer;
    }
    .drawer-foot .btn-primary:disabled {
      background: var(--cs-border); cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="dw-body">
    <div class="drawer-head">
      <div class="title">选择商品发送<span class="sub" id="custName"></span></div>
      <div class="close" onclick="window.csModalBridge.close()">×</div>
    </div>
    <div class="drawer-body">
      <div class="tip">选择一件商品，将发送该商品卡片给客户。</div>
      <div class="product-list" id="productList"></div>
    </div>
    <div class="drawer-foot">
      <button class="btn-default" onclick="window.csModalBridge.close()">取消</button>
      <button class="btn-primary" id="confirmBtn" disabled>发送商品卡片</button>
    </div>
  </div>

  <script src="../js/cs-modal.js"></script>
  <script>
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

    // 从 URL ?d= 读取客户数据（父窗口序列化传入，绕开 iframe 跨窗口限制）
    var cust = {};
    try {
      var qs = new URLSearchParams(location.search);
      var raw = qs.get('d');
      if (raw) cust = JSON.parse(decodeURIComponent(raw));
    } catch (e) { cust = {}; }
    var nameEl = document.getElementById('custName');
    if (cust.name) nameEl.textContent = '· ' + cust.name;

    var products = (cust.products && cust.products.length) ? cust.products : [];
    var listEl = document.getElementById('productList');
    var confirmBtn = document.getElementById('confirmBtn');
    var selectedProduct = null;

    if (products.length === 0) {
      listEl.innerHTML = '<div class="empty-state"><div class="es-icon">📦</div><div class="es-text">该客户暂无商品记录</div></div>';
    } else {
      products.forEach(function (p, idx) {
        var stockNum = parseInt(String(p.stock || '').replace(/[^0-9]/g, ''), 10);
        var inStock = isNaN(stockNum) ? true : stockNum > 0;
        var stockText = isNaN(stockNum) ? (p.stock || '在售') : (inStock ? '库存 ' + stockNum + ' 件' : '缺货');
        var stockCls = inStock ? 'in-stock' : 'out-stock';
        var div = document.createElement('div');
        div.className = 'product-item';
        div.setAttribute('data-idx', idx);
        div.innerHTML =
            '<div class="pi-top">'
          +   '<span class="pi-name">' + esc(p.name || ('商品 #' + (idx + 1))) + '</span>'
          +   '<span class="pi-stock ' + stockCls + '">' + esc(stockText) + '</span>'
          + '</div>'
          + '<div class="pi-spec">' + esc(p.spec || '—') + '</div>'
          + '<div class="pi-bottom"><span class="pi-sku">SKU: ' + esc(p.sku || '—') + '</span><span class="pi-price">' + esc(p.price || '') + '</span></div>';
        div.addEventListener('click', function () {
          var all = listEl.querySelectorAll('.product-item');
          for (var i = 0; i < all.length; i++) all[i].classList.remove('selected');
          div.classList.add('selected');
          selectedProduct = p;
          confirmBtn.disabled = false;
        });
        listEl.appendChild(div);
      });
    }

    confirmBtn.addEventListener('click', function () {
      if (!selectedProduct) return;
      window.csModalBridge.confirm({
        name: selectedProduct.name,
        sku: selectedProduct.sku,
        spec: selectedProduct.spec,
        price: selectedProduct.price,
        stock: selectedProduct.stock
      });
    });
  </script>
</body>
</html>
