<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商城运营后台 - 商城列表（一键复制商城）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      color: rgba(0,0,0,.85);
      background: #f0f2f5;
      min-height: 100vh;
    }

    /* Layout */
    .layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 200px;
      background: #001529;
      color: rgba(255,255,255,.65);
      flex-shrink: 0;
    }
    .sidebar-logo {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }
    .sidebar-logo span { color: #1890ff; margin-right: 6px; }
    .menu-group { padding: 8px 0; }
    .menu-title {
      padding: 8px 16px;
      font-size: 12px;
      color: rgba(255,255,255,.45);
    }
    .menu-item {
      padding: 10px 16px 10px 40px;
      cursor: pointer;
      transition: all .2s;
    }
    .menu-item:hover { color: #fff; background: rgba(255,255,255,.08); }
    .menu-item.active {
      background: #1890ff;
      color: #fff;
    }
    .menu-parent {
      padding: 10px 16px;
      color: rgba(255,255,255,.85);
      font-weight: 500;
    }

    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .header {
      height: 48px;
      background: #fff;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .tabs { display: flex; gap: 0; }
    .tab {
      padding: 0 16px;
      height: 48px;
      line-height: 48px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      color: rgba(0,0,0,.65);
    }
    .tab.active {
      color: #1890ff;
      border-bottom-color: #1890ff;
    }
    .header-right { display: flex; align-items: center; gap: 16px; color: rgba(0,0,0,.45); }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: #1890ff; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
    }

    .content { padding: 16px 24px 24px; flex: 1; }

    /* Search */
    .search-card {
      background: #fff;
      padding: 24px 24px 8px;
      border-radius: 2px;
      margin-bottom: 16px;
    }
    .search-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 24px;
      align-items: flex-end;
    }
    .form-item { display: flex; flex-direction: column; gap: 8px; }
    .form-item label { color: rgba(0,0,0,.85); white-space: nowrap; }
    .form-item input, .form-item select {
      width: 200px;
      height: 32px;
      padding: 4px 11px;
      border: 1px solid #d9d9d9;
      border-radius: 2px;
      outline: none;
      transition: border .2s;
    }
    .form-item input:focus, .form-item select:focus { border-color: #40a9ff; box-shadow: 0 0 0 2px rgba(24,144,255,.2); }
    .search-actions { margin-left: auto; display: flex; gap: 8px; padding-bottom: 16px; }
    .btn {
      height: 32px;
      padding: 0 15px;
      border-radius: 2px;
      border: 1px solid #d9d9d9;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
    }
    .btn:hover { color: #40a9ff; border-color: #40a9ff; }
    .btn-primary {
      background: #1890ff;
      border-color: #1890ff;
      color: #fff;
    }
    .btn-primary:hover { background: #40a9ff; border-color: #40a9ff; color: #fff; }
    .btn-primary:disabled { background: #f5f5f5; border-color: #d9d9d9; color: rgba(0,0,0,.25); cursor: not-allowed; }
    .btn-link {
      border: none; background: none; color: #1890ff; padding: 0 4px; height: auto;
    }
    .btn-link:hover { color: #40a9ff; }
    .btn-link.disabled { color: rgba(0,0,0,.25); cursor: not-allowed; }

    /* Table card */
    .table-card {
      background: #fff;
      border-radius: 2px;
      padding: 16px 24px 24px;
    }
    .table-toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .dropdown-btn::after {
      content: " ▾";
      font-size: 10px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #f0f0f0;
    }
    th { background: #fafafa; font-weight: 500; color: rgba(0,0,0,.85); }
    td { color: rgba(0,0,0,.65); }
    tr:hover td { background: #fafafa; }
    .actions { display: flex; flex-wrap: wrap; gap: 4px 0; }
    .actions .btn-link + .btn-link::before { content: ""; }

    /* Tags */
    .tag {
      display: inline-block;
      padding: 0 7px;
      height: 22px;
      line-height: 20px;
      border-radius: 2px;
      font-size: 12px;
      border: 1px solid;
    }
    .tag-green { background: #f6ffed; border-color: #b7eb8f; color: #52c41a; }
    .tag-red { background: #fff2f0; border-color: #ffccc7; color: #ff4d4f; }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      color: rgba(0,0,0,.65);
    }
    .page-num {
      min-width: 32px; height: 32px;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid #d9d9d9; border-radius: 2px; cursor: pointer;
    }
    .page-num.active { border-color: #1890ff; color: #1890ff; }

    /* Modal */
    .modal-mask {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-mask.show { display: flex; }
    .modal {
      background: #fff;
      border-radius: 2px;
      width: 560px;
      max-height: 90vh;
      overflow: auto;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
    }
    .modal-sm { width: 420px; }
    .modal-header {
      padding: 16px 24px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .modal-title { font-size: 16px; font-weight: 500; color: rgba(0,0,0,.85); }
    .modal-subtitle { font-size: 13px; color: rgba(0,0,0,.45); margin-top: 4px; }
    .modal-close {
      border: none; background: none; font-size: 18px;
      color: rgba(0,0,0,.45); cursor: pointer; line-height: 1;
    }
    .modal-close:hover { color: rgba(0,0,0,.85); }
    .modal-body { padding: 24px; }
    .modal-footer {
      padding: 10px 16px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .section-title {
      font-weight: 500;
      margin-bottom: 16px;
      color: rgba(0,0,0,.85);
      padding-bottom: 8px;
      border-bottom: 1px solid #f0f0f0;
    }
    .modal-form .form-row {
      display: flex;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .modal-form .form-row label {
      width: 110px;
      flex-shrink: 0;
      line-height: 32px;
      text-align: right;
      padding-right: 12px;
      color: rgba(0,0,0,.85);
    }
    .modal-form .form-row label .req { color: #ff4d4f; margin-right: 2px; }
    .modal-form .form-row .field { flex: 1; }
    .modal-form input, .modal-form select {
      width: 100%;
      height: 32px;
      padding: 4px 11px;
      border: 1px solid #d9d9d9;
      border-radius: 2px;
    }
    .modal-form input:focus, .modal-form select:focus {
      border-color: #40a9ff;
      outline: none;
      box-shadow: 0 0 0 2px rgba(24,144,255,.2);
    }
    .date-range { display: flex; align-items: center; gap: 8px; }
    .date-range input { flex: 1; }
    .radio-group { display: flex; gap: 24px; line-height: 32px; }
    .radio-group label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: normal; width: auto; text-align: left; padding: 0; }
    .checkbox-group { display: flex; flex-direction: column; gap: 10px; }
    .checkbox-group label {
      display: flex; align-items: center; gap: 8px;
      cursor: pointer; font-weight: normal;
      width: auto; text-align: left; padding: 0; line-height: 22px;
    }
    .checkbox-group input[type=checkbox] { width: 16px; height: 16px; }
    .hint {
      font-size: 12px; color: rgba(0,0,0,.45);
      margin-top: 8px;
      display: flex; align-items: center; gap: 4px;
    }
    .error-msg { font-size: 12px; color: #ff4d4f; margin-top: 4px; display: none; }
    .error-msg.show { display: block; }

    /* Toast */
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: #fff;
      padding: 10px 20px;
      border-radius: 2px;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
      z-index: 2000;
      transition: transform .3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast-icon { color: #52c41a; font-size: 16px; }

    /* Tooltip */
    .tooltip-wrap { position: relative; display: inline-block; }
    .tooltip-wrap .tooltip {
      display: none;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.75);
      color: #fff;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 2px;
      white-space: nowrap;
      z-index: 10;
    }
    .tooltip-wrap:hover .tooltip { display: block; }

    .confirm-text { color: rgba(0,0,0,.65); line-height: 1.8; }
    .confirm-text strong { color: rgba(0,0,0,.85); }

    /* Preview modal */
    .preview-tabs {
      display: flex;
      border-bottom: 1px solid #f0f0f0;
      margin: -8px 0 24px;
    }
    .preview-tab {
      flex: 1;
      height: 40px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      color: rgba(0,0,0,.65);
      border-bottom: 2px solid transparent;
      transition: all .2s;
    }
    .preview-tab:hover { color: #1890ff; }
    .preview-tab.active {
      color: #1890ff;
      border-bottom-color: #1890ff;
      font-weight: 500;
    }
    .preview-content {
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .preview-content.is-pc {
      align-items: stretch;
      justify-content: flex-start;
      min-height: auto;
    }
    .preview-qrcode img {
      width: 180px;
      height: 180px;
      border: 1px solid #f0f0f0;
      border-radius: 4px;
    }
    .preview-tip {
      margin-top: 12px;
      font-size: 13px;
      color: rgba(0,0,0,.45);
      text-align: center;
    }
    .preview-pc {
      width: 100%;
    }
    .preview-url-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: #fafafa;
      border: 1px solid #f0f0f0;
      border-radius: 6px;
    }
    .preview-url-bar .url-icon {
      flex-shrink: 0;
      color: rgba(0,0,0,.35);
      font-size: 15px;
      line-height: 1;
    }
    .preview-url-bar .url-text {
      flex: 1;
      min-width: 0;
      color: #1890ff;
      font-size: 14px;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .preview-url-bar .url-text:hover { color: #40a9ff; }
    .preview-url-bar .url-open {
      flex-shrink: 0;
      color: rgba(0,0,0,.25);
      font-size: 14px;
      text-decoration: none;
      line-height: 1;
    }
    .preview-url-bar .url-open:hover { color: #1890ff; }
    .preview-pc-actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    .preview-pc-actions .btn {
      flex: 1;
      gap: 6px;
    }
    .preview-pc-actions .btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }
    .preview-pc-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
      font-size: 12px;
      color: rgba(0,0,0,.45);
    }
    .preview-pc-hint .hint-icon {
      width: 14px;
      height: 14px;
      border: 1px solid rgba(0,0,0,.25);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      line-height: 1;
      flex-shrink: 0;
    }
    .preview-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 0;
      color: rgba(0,0,0,.25);
    }
    .preview-empty .empty-icon {
      font-size: 48px;
      line-height: 1;
      margin-bottom: 12px;
      opacity: .6;
    }
    .preview-empty .empty-text {
      font-size: 14px;
      color: rgba(0,0,0,.45);
    }

    /* Prototype badge */
    .proto-badge {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: #722ed1;
      color: #fff;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      z-index: 999;
      box-shadow: 0 2px 8px rgba(114,46,209,.4);
    }
  </style>
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo"><span>▣</span> 商城运营后台</div>
    
    
    <div class="menu-group">
      <div class="menu-parent">品牌商城管理</div>
      <div class="menu-item active">商城列表</div>
    </div>
   
  </aside>

  <div class="main">
    <header class="header">
      <div class="tabs">
        <div class="tab">工作台首页</div>
        <div class="tab">全部商城订单</div>
        <div class="tab active">商城列表</div>
      </div>
      <div class="header-right">
        <span>↻</span>
        <span>🔔</span>
        <div class="avatar">管</div>
      </div>
    </header>

    <main class="content">
      <!-- Search -->
      <div class="search-card">
        <div class="search-row">
          <div class="form-item">
            <label>企业名称</label>
            <input type="text" placeholder="请输入">
          </div>
          <div class="form-item">
            <label>手机号</label>
            <input type="text" placeholder="请输入">
          </div>
          <div class="form-item">
            <label>K3渠道名称</label>
            <input type="text" placeholder="请输入">
          </div>
          <div class="search-actions">
            <button class="btn">展开</button>
            <button class="btn">重置</button>
            <button class="btn btn-primary">查询</button>
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="table-card">
        <div class="table-toolbar">
          <button class="btn btn-primary">新增品牌商城</button>
          <button class="btn dropdown-btn">批量操作</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>K3渠道名称</th>
              <th>K3渠道编码</th>
              <th>对接人手机号</th>
              <th>商城状态</th>
              <th>对接业务员</th>
              <th>商城有效期</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="mallTableBody"></tbody>
        </table>

        <div class="pagination">
          <span>第 1-3 条 / 总共 3 条</span>
          <span class="page-num">‹</span>
          <span class="page-num active">1</span>
          <span class="page-num">2</span>
          <span class="page-num">3</span>
          <span class="page-num">›</span>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Copy Modal -->
<div class="modal-mask" id="copyModal">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title">复制商城</div>
        <div class="modal-subtitle" id="sourceMallInfo">源商城：华夏-银行（K3编码：HT001）</div>
      </div>
      <button class="modal-close" onclick="closeCopyModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="section-title">新商城信息</div>
      <div class="modal-form">
        <div class="form-row">
          <label><span class="req">*</span>K3渠道名称</label>
          <div class="field">
            <input type="text" id="newName" placeholder="请输入新商城渠道名称" maxlength="50">
            <div class="error-msg" id="nameError">K3渠道名称已存在，请更换</div>
          </div>
        </div>
        <div class="form-row">
          <label><span class="req">*</span>K3渠道编码</label>
          <div class="field">
            <input type="text" id="newCode" placeholder="请输入新商城渠道编码">
            <div class="error-msg" id="codeError">K3渠道编码已存在，请更换</div>
          </div>
        </div>
        <div class="form-row">
          <label><span class="req">*</span>对接人手机号</label>
          <div class="field">
            <input type="text" id="newPhone" placeholder="请输入11位手机号" maxlength="11">
          </div>
        </div>
        <div class="form-row">
          <label><span class="req">*</span>对接业务员</label>
          <div class="field">
            <select id="newSales">
              <option value="">请选择</option>
              <option>张三</option>
              <option>李四</option>
              <option>王五</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <label><span class="req">*</span>商城有效期</label>
          <div class="field date-range">
            <input type="date" id="startDate">
            <span>至</span>
            <input type="date" id="endDate">
          </div>
        </div>
        <div class="form-row">
          <label>商城状态</label>
          <div class="field radio-group">
            <label><input type="radio" name="status" value="启用" checked> 启用</label>
            <label><input type="radio" name="status" value="停用"> 停用</label>
          </div>
        </div>
      </div>

      <div class="section-title" style="margin-top:8px">复制范围</div>
      <div class="checkbox-group">
        <label><input type="checkbox" checked disabled> 商城基础配置</label>
        <label><input type="checkbox" id="copyProducts" checked> 商品池 / 上架商品</label>
        <label><input type="checkbox" id="copyPages" checked> 页面装修</label>
        <label><input type="checkbox" id="copyActivity"> 营销活动</label>
      </div>
      <div class="hint">ⓘ 订单和用户数据不会被复制</div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeCopyModal()">取消</button>
      <button class="btn btn-primary" onclick="showConfirm()">确认复制</button>
    </div>
  </div>
</div>

<!-- Confirm Modal -->
<div class="modal-mask" id="confirmModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title">确认复制商城</div>
      <button class="modal-close" onclick="closeConfirm()">×</button>
    </div>
    <div class="modal-body">
      <p class="confirm-text" id="confirmText"></p>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeConfirm()">取消</button>
      <button class="btn btn-primary" onclick="submitCopy()">确认</button>
    </div>
  </div>
</div>

<!-- Preview Modal -->
<div class="modal-mask" id="previewModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div>
        <div class="modal-title">商城预览</div>
        <div class="modal-subtitle" id="previewMallInfo">华夏-银行</div>
      </div>
      <button class="modal-close" onclick="closePreviewModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="preview-tabs">
        <button class="preview-tab active" data-type="mini" onclick="switchPreviewType('mini')">小程序预览</button>
        <button class="preview-tab" data-type="h5" onclick="switchPreviewType('h5')">H5预览</button>
        <button class="preview-tab" data-type="pc" onclick="switchPreviewType('pc')">PC预览</button>
      </div>
      <div class="preview-content" id="previewContent"></div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <span class="toast-icon">✓</span>
  <span id="toastMsg">复制任务已提交</span>
</div>

<div class="proto-badge">交互原型 · 一键复制商城</div>

<script>
  /** @type {Array<{id:string,name:string,code:string,phone:string,status:string,sales:string,period:string,preview:{mini?:string,h5?:string,pc?:string}}>} */
  const malls = [
    { id: '1', name: '华夏-银行', code: 'HT001', phone: '13800138001', status: '启用', sales: '张三', period: '2025-01-01 ~ 2026-01-01', preview: { mini: 'https://mall.example.com/mini/HT001', h5: 'https://m.example.com/mall/HT001', pc: 'https://www.example.com/mall/HT001' } },
    { id: '2', name: '522品牌商城', code: '522001', phone: '13800138002', status: '启用', sales: '李四', period: '2025-03-01 ~ 2026-03-01', preview: { h5: 'https://m.example.com/mall/522001', pc: 'https://www.example.com/mall/522001' } },
    { id: '3', name: '测试商城A', code: 'TEST001', phone: '13800138003', status: '停用', sales: '王五', period: '2024-06-01 ~ 2025-06-01', preview: {} },
  ];

  let currentSource = null;
  let currentPreviewMall = null;
  let currentPreviewType = 'mini';
  let currentPcLink = '';

  /**
   * 获取状态标签 HTML
   * @param {string} status
   * @returns {string}
   */
  function getStatusTag(status) {
    const map = {
      '启用': 'tag-green',
      '停用': 'tag-red',
    };
    return `<span class="tag ${map[status] || ''}">${status}</span>`;
  }

  /**
   * 渲染操作按钮
   * @param {typeof malls[0]} mall
   * @returns {string}
   */
  function renderActions(mall) {
    const links = [];
    links.push('<button class="btn-link">详情</button>');

    if (mall.status === '启用') {
      links.push('<button class="btn-link">停用</button>');
      links.push('<button class="btn-link">进入商城</button>');
    } else if (mall.status === '停用') {
      links.push('<button class="btn-link">启用</button>');
      links.push('<button class="btn-link">进入商城</button>');
    }

    links.push('<button class="btn-link">日志</button>');
    links.push(`<button class="btn-link" onclick="openPreviewModal('${mall.id}')">商城预览</button>`);
    links.push(`<button class="btn-link" onclick="openCopyModal('${mall.id}')">复制商城</button>`);

    return `<div class="actions">${links.join(' ')}</div>`;
  }

  /**
   * 渲染表格
   */
  function renderTable() {
    const tbody = document.getElementById('mallTableBody');
    tbody.innerHTML = malls.map(m => `
      <tr>
        <td>${m.name}</td>
        <td>${m.code}</td>
        <td>${m.phone}</td>
        <td>${getStatusTag(m.status)}</td>
        <td>${m.sales}</td>
        <td>${m.period}</td>
        <td>${renderActions(m)}</td>
      </tr>
    `).join('');
  }

  /**
   * 初始化默认日期
   */
  function initDates() {
    const today = new Date();
    const nextYear = new Date(today);
    nextYear.setFullYear(nextYear.getFullYear() + 1);
    const fmt = d => d.toISOString().slice(0, 10);
    document.getElementById('startDate').value = fmt(today);
    document.getElementById('endDate').value = fmt(nextYear);
  }

  /**
   * 打开复制弹窗
   * @param {string} id
   */
  function openCopyModal(id) {
    currentSource = malls.find(m => m.id === id);
    if (!currentSource) return;

    document.getElementById('sourceMallInfo').textContent =
      `源商城：${currentSource.name}（K3编码：${currentSource.code}）`;

    document.getElementById('newName').value = currentSource.name + '-副本';
    document.getElementById('newCode').value = '';
    document.getElementById('newPhone').value = '';
    document.getElementById('newSales').value = '';
    document.getElementById('nameError').classList.remove('show');
    document.getElementById('codeError').classList.remove('show');
    initDates();

    document.getElementById('copyModal').classList.add('show');
  }

  /**
   * 关闭复制弹窗
   */
  function closeCopyModal() {
    document.getElementById('copyModal').classList.remove('show');
    currentSource = null;
  }

  /**
   * 校验表单
   * @returns {boolean}
   */
  function validateForm() {
    const name = document.getElementById('newName').value.trim();
    const code = document.getElementById('newCode').value.trim();
    const phone = document.getElementById('newPhone').value.trim();
    const sales = document.getElementById('newSales').value;

    let valid = true;
    document.getElementById('nameError').classList.remove('show');
    document.getElementById('codeError').classList.remove('show');

    if (malls.some(m => m.name === name)) {
      document.getElementById('nameError').classList.add('show');
      valid = false;
    }
    if (malls.some(m => m.code === code)) {
      document.getElementById('codeError').classList.add('show');
      valid = false;
    }
    if (!name || !code || !/^1\d{10}$/.test(phone) || !sales) {
      showToast('请填写完整的必填信息');
      valid = false;
    }
    return valid;
  }

  /**
   * 显示二次确认
   */
  function showConfirm() {
    if (!validateForm()) return;

    const newName = document.getElementById('newName').value.trim();
    document.getElementById('confirmText').innerHTML =
      `确认复制商城吗？<br><br>将从 <strong>「${currentSource.name}（${currentSource.code}）」</strong> 复制配置到新商城 <strong>「${newName}」</strong>。<br>复制完成后新商城将独立运行，互不影响。`;

    document.getElementById('confirmModal').classList.add('show');
  }

  /**
   * 关闭确认弹窗
   */
  function closeConfirm() {
    document.getElementById('confirmModal').classList.remove('show');
  }

  /**
   * 提交复制任务
   */
  function submitCopy() {
    const newName = document.getElementById('newName').value.trim();
    const newCode = document.getElementById('newCode').value.trim();
    const newPhone = document.getElementById('newPhone').value.trim();
    const sales = document.getElementById('newSales').value;
    const status = document.querySelector('input[name="status"]:checked').value;

    malls.unshift({
      id: String(Date.now()),
      name: newName,
      code: newCode,
      phone: newPhone,
      status,
      sales,
      period: document.getElementById('startDate').value + ' ~ ' + document.getElementById('endDate').value,
      preview: {},
    });

    closeConfirm();
    closeCopyModal();
    renderTable();
    showToast(`商城「${newName}」复制成功`);
  }

  /**
   * 获取各端预览地址
   * @param {typeof malls[0]} mall
   * @returns {{mini:string,h5:string,pc:string}}
   */
  function getPreviewUrls(mall) {
    const preview = mall.preview || {};
    return {
      mini: preview.mini || '',
      h5: preview.h5 || '',
      pc: preview.pc || '',
    };
  }

  /**
   * 渲染暂无数据
   * @returns {string}
   */
  function renderPreviewEmpty() {
    return `
      <div class="preview-empty">
        <div class="empty-icon">📭</div>
        <div class="empty-text">暂无数据</div>
      </div>
    `;
  }

  /**
   * 生成二维码图片地址
   * @param {string} url
   * @returns {string}
   */
  function getQrCodeUrl(url) {
    return `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(url)}`;
  }

  /**
   * 切换预览类型并渲染内容
   * @param {'pc'|'h5'|'mini'} type
   */
  function switchPreviewType(type) {
    if (!currentPreviewMall) return;
    currentPreviewType = type;

    document.querySelectorAll('.preview-tab').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.type === type);
    });

    const urls = getPreviewUrls(currentPreviewMall);
    const url = urls[type];
    const content = document.getElementById('previewContent');
    content.classList.toggle('is-pc', type === 'pc');

    if (!url) {
      currentPcLink = '';
      content.innerHTML = renderPreviewEmpty();
      return;
    }

    if (type === 'pc') {
      currentPcLink = url;
      content.innerHTML = `
        <div class="preview-pc">
          <div class="preview-url-bar">
            <span class="url-icon">🔗</span>
            <a class="url-text" href="${url}" target="_blank" rel="noopener" title="${url}">${url}</a>
            <a class="url-open" href="${url}" target="_blank" rel="noopener" title="新窗口打开">↗</a>
          </div>
          <div class="preview-pc-actions">
            <button class="btn" onclick="copyPcLink()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              复制链接
            </button>
            <a class="btn btn-primary" href="${url}" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              打开预览
            </a>
          </div>
          <div class="preview-pc-hint">
            <span class="hint-icon">i</span>
            链接将在浏览器中打开商城页面
          </div>
        </div>
      `;
      return;
    }

    const tip = type === 'mini' ? '请使用微信扫码预览小程序' : '请使用手机扫码预览 H5 商城';
    content.innerHTML = `
      <div class="preview-qrcode">
        <img src="${getQrCodeUrl(url)}" alt="${type === 'mini' ? '小程序' : 'H5'}预览二维码">
        <p class="preview-tip">${tip}</p>
      </div>
    `;
  }

  /**
   * 打开预览选择弹窗
   * @param {string} id
   */
  function openPreviewModal(id) {
    currentPreviewMall = malls.find(m => m.id === id);
    if (!currentPreviewMall) return;
    document.getElementById('previewMallInfo').textContent =
      `${currentPreviewMall.name}（${currentPreviewMall.code}）`;
    document.getElementById('previewModal').classList.add('show');
    switchPreviewType('mini');
  }

  /**
   * 关闭预览弹窗
   */
  function closePreviewModal() {
    document.getElementById('previewModal').classList.remove('show');
    currentPreviewMall = null;
    currentPreviewType = 'mini';
  }

  /**
   * 复制 PC 预览链接
   */
  function copyPcLink() {
    if (!currentPcLink) return;
    navigator.clipboard.writeText(currentPcLink).then(() => {
      showToast('链接已复制');
    }).catch(() => {
      const input = document.createElement('input');
      input.value = currentPcLink;
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      document.body.removeChild(input);
      showToast('链接已复制');
    });
  }

  /**
   * 显示 Toast
   * @param {string} msg
   */
  function showToast(msg) {
    const toast = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  renderTable();
  initDates();
</script>
</body>
</html>
