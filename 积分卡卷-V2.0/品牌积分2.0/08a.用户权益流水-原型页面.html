<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户权益流水 - 品牌商城后台</title>
<style>
:root {
  --bg-app:#f4f3f0; --bg-sidebar:#1e1e22; --bg-surface:#ffffff; --bg-hover:#f7f6f4; --bg-input:#f9f8f7;
  --border:#e6e4e0; --border-light:#f0eeeb;
  --text-primary:#1a1a1c; --text-secondary:#6b6b70; --text-muted:#99999d; --text-sidebar:#c4c4c9;
  --accent:#2d2d33; --accent-soft:#f0eeeb;
  --blue:#2563eb; --blue-bg:#f5f8ff; --blue-border:#d4e0fc;
  --red:#da3e3a; --red-bg:#fef4f3; --red-border:#fcd9d7;
  --green:#16a34a; --green-bg:#f4fdf6; --green-border:#c6f0d4;
  --orange:#d97706; --orange-bg:#fffbf0; --orange-border:#fde8c4;
  --purple:#7c3aed; --purple-bg:#faf8ff; --purple-border:#e4dcfc;
  --teal:#0d9488; --teal-bg:#ecfdf5; --teal-border:#99f6e4;
  --gray:#6b7280; --gray-bg:#f8f8f7; --gray-border:#e8e6e3;
  --radius-sm:4px; --radius:8px; --radius-lg:12px;
  --shadow:0 1px 3px rgba(0,0,0,.06); --shadow-lg:0 4px 16px rgba(0,0,0,.10);
  --transition:160ms ease;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Microsoft YaHei",sans-serif;background:var(--bg-app);color:var(--text-primary);display:flex;min-height:100vh;-webkit-font-smoothing:antialiased;}
.sidebar{width:232px;min-width:232px;background:var(--bg-sidebar);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:10;}
.sidebar-brand{padding:20px 20px 28px;border-bottom:1px solid rgba(255,255,255,.06);}
.sidebar-brand .logo{font-size:17px;font-weight:600;color:#fff;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;}
.sidebar-brand .sub{font-size:11px;color:var(--text-sidebar);margin-top:2px;}
.sidebar-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px;}
.nav-section-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.25);padding:14px 10px 6px;display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;}
.section-arrow{font-size:8px;transition:transform .2s ease;flex-shrink:0;}
.nav-section.collapsed .section-arrow{transform:rotate(-90deg);}
.nav-section.collapsed .nav-section-items{display:none;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:var(--text-sidebar);font-size:13.5px;cursor:pointer;transition:all var(--transition);text-decoration:none;letter-spacing:.01em;}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff;}
.nav-item.active{background:rgba(255,255,255,.10);color:#fff;font-weight:500;}
.nav-icon{width:18px;height:18px;opacity:.55;flex-shrink:0;}
.nav-item.active .nav-icon{opacity:1;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:52px;min-height:52px;background:var(--bg-surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:16px;z-index:5;}
.topbar .breadcrumb{font-size:12.5px;color:var(--text-muted);letter-spacing:.01em;}
.topbar .breadcrumb span{color:var(--text-primary);font-weight:500;}
.topbar .breadcrumb a{color:var(--text-muted);text-decoration:none;}
.topbar .breadcrumb a:hover{color:var(--text-primary);}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:16px;}
.user-avatar{width:30px;height:30px;border-radius:50%;background:#e6e4e0;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);}
.content{flex:1;display:flex;flex-direction:column;padding:24px 28px;padding-bottom:70px;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:16px;}
.page-header h1{font-size:22px;font-weight:600;letter-spacing:-.02em;}
.page-header p{font-size:13px;color:var(--text-muted);margin-top:2px;}

/* 用户信息卡（可点击，展开资产明细） */
.user-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:16px;display:flex;gap:18px;align-items:center;cursor:pointer;transition:border-color var(--transition),box-shadow var(--transition);}
.user-card:hover{border-color:var(--text-muted);box-shadow:var(--shadow);}
.user-avatar-lg{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.user-info{flex:1;min-width:0;}
.user-info .uname{font-size:16px;font-weight:600;color:var(--text-primary);display:flex;align-items:center;gap:10px;}
.user-info .umeta{font-size:12px;color:var(--text-muted);margin-top:6px;display:flex;gap:16px;flex-wrap:wrap;}
.user-info .umeta .mono{font-family:"Microsoft YaHei",sans-serif;color:var(--text-secondary);}
.user-info .upts{font-size:12.5px;color:var(--text-secondary);margin-top:8px;line-height:1.8;}
.user-info .upts b{font-size:18px;font-weight:600;color:var(--accent);font-family:"Microsoft YaHei",sans-serif;margin:0 2px;}
.user-info .upts .exp{color:var(--text-secondary);font-weight:600;}
.user-info .upts .terms{color:var(--text-muted);}
.user-info .upts .terms b{font-size:12px;color:var(--text-secondary);font-weight:600;}
.card-cta{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-primary);flex-shrink:0;padding:7px 14px;border:1px solid var(--border);background:var(--bg-surface);border-radius:100px;font-weight:500;transition:background var(--transition),border-color var(--transition);}
.user-card:hover .card-cta{background:var(--bg-hover);border-color:var(--text-muted);}
.card-cta svg{width:13px;height:13px;}

/* 业务标签 */
.biz-tag{display:inline;font-size:12px;font-weight:500;color:var(--text-primary);background:none;border:none;padding:0;border-radius:0;}
.biz-points,.biz-coupon{color:var(--text-primary);background:none;border:none;}

/* 表格 */
.table-panel{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;flex-direction:column;}
.content{flex:1;display:flex;flex-direction:column;padding:24px 28px;padding-bottom:60px;}
.page-footer-fixed{position:fixed;bottom:0;left:232px;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 28px;background:#fafaf9;border-top:1px solid var(--border);z-index:100;box-shadow:0 -2px 8px rgba(0,0,0,.06);}
.page-footer-left{display:flex;align-items:center;gap:12px;}
.page-footer-right{display:flex;align-items:center;}
.filter-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg-surface);border-bottom:1px solid var(--border);}
.filter-fields{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.filter-actions{display:flex;gap:8px;align-items:center;flex-shrink:0;margin-left:auto;}
.filter-bar input,.filter-bar select{height:34px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12.5px;font-family:inherit;background:var(--bg-surface);color:var(--text-primary);outline:none;transition:border-color var(--transition);}
.filter-bar select{min-width:96px;}
.filter-bar input[type="text"]{width:170px;font-family:"Microsoft YaHei",sans-serif;}
.filter-bar input::placeholder{color:var(--text-muted);}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--accent);}
.filter-bar .date-range{display:flex;align-items:center;gap:5px;}
.filter-bar .date-range input{width:124px;}
.filter-bar .date-range .date-sep{font-size:12px;color:var(--text-muted);}
.filter-bar .fl-label{font-size:12px;color:var(--text-muted);white-space:nowrap;}
.table-wrap{flex:1;display:flex;flex-direction:column;min-height:0;}
.table-scroll{overflow-x:auto;flex:1;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1040px;}
thead th{background:#fafaf9;text-align:left;padding:9px 10px;font-weight:500;font-size:11px;color:var(--text-muted);letter-spacing:.02em;border-bottom:1px solid var(--border);white-space:nowrap;}
thead th:first-child,tbody td:first-child{padding-left:18px;}
tbody td{padding:8px 10px;border-bottom:1px solid var(--border-light);vertical-align:middle;}
tbody tr:hover{background:var(--bg-hover);}
.time-cell{font-family:"Microsoft YaHei",sans-serif;font-size:11.5px;color:var(--text-secondary);white-space:nowrap;}
.ref-cell{font-family:"Microsoft YaHei",sans-serif;font-size:11px;color:var(--text-primary);cursor:pointer;border-bottom:1px dashed var(--border);transition:background var(--transition),border-color var(--transition);}
.ref-cell:hover{background:var(--bg-hover);border-bottom-color:var(--text-secondary);}
.type-tag{display:inline;font-size:12px;color:var(--text-primary);background:none;border:none;padding:0;border-radius:0;}
.type-grant,.type-card-redeem,.type-consume,.type-refund,.type-compensate,.type-expire,.type-exchange,.type-verify,.type-issue,.type-void{background:none;color:var(--text-primary);border:none;}
.term-tag{display:inline;font-size:12px;color:var(--text-primary);background:none;border:none;padding:0;border-radius:0;}
.term-tag.expiring{font-weight:600;color:var(--text-primary);}
.fs-tag{display:inline-flex;align-items:center;padding:1px 8px;border-radius:100px;font-size:11px;font-weight:500;white-space:nowrap;border:1px solid transparent;}
.fs-ok{background:var(--green-bg);color:var(--green);border-color:var(--green-border);}
.fs-info{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-border);}
.fs-warn{background:var(--orange-bg);color:var(--orange);border-color:var(--orange-border);}
.fs-end{background:var(--gray-bg);color:var(--gray);border-color:var(--gray-border);}
.fs-bad{background:var(--red-bg);color:var(--red);border-color:var(--red-border);}
.source-tag{display:inline;font-size:12px;color:var(--text-secondary);background:none;border:none;padding:0;border-radius:0;}
.source-brand,.source-platform{background:none;color:var(--text-secondary);border:none;}
.obj-cell{font-size:12px;}
.obj-cell .obj-sub{font-size:10.5px;color:var(--text-muted);margin-top:2px;}
.amount-cell{font-family:"Microsoft YaHei",sans-serif;font-size:12.5px;font-weight:600;color:var(--text-primary);}
.amount-cell.plus{color:var(--green);}
.amount-cell.minus{color:var(--red);}
.after-sub{font-size:10.5px;color:var(--text-muted);margin-top:2px;font-family:"Microsoft YaHei",sans-serif;}
.remark-cell{font-size:12px;color:var(--text-secondary);}
.actions{display:flex;align-items:center;gap:8px;white-space:nowrap;}
.action-link{color:var(--text-primary);font-size:12px;cursor:pointer;}
.action-link:hover{text-decoration:underline;}
.pagination{display:flex;align-items:center;gap:4px;}
.pagination .page-btn{min-width:30px;width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-surface);cursor:pointer;font-size:12px;color:var(--text-primary);font-family:inherit;transition:all var(--transition);}
.pagination .page-btn:hover{border-color:var(--text-muted);}
.pagination .page-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.pagination .page-btn.disabled{opacity:.35;pointer-events:none;}
.btn{display:inline-flex;align-items:center;padding:5px 12px;border-radius:var(--radius-sm);font-size:12px;font-family:inherit;cursor:pointer;border:1px solid transparent;transition:all var(--transition);white-space:nowrap;font-weight:500;gap:5px;}
.btn-outline{border-color:var(--border);color:var(--text-primary);background:var(--bg-surface);}
.btn-outline:hover{border-color:var(--text-muted);background:var(--bg-hover);}
.btn-reset{height:34px;padding:0 12px;background:transparent;color:var(--text-secondary);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12.5px;font-family:inherit;cursor:pointer;transition:all var(--transition);}
.btn-reset:hover{border-color:var(--text-muted);color:var(--text-primary);}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-primary:hover{filter:brightness(1.08);}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg-surface);border-radius:var(--radius-lg);width:100%;max-width:640px;box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto;}
.modal-lg{max-width:920px;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg-surface);z-index:2;}
.modal-header h3{font-size:15px;font-weight:600;}
.modal-close{background:none;border:none;font-size:20px;color:var(--text-muted);cursor:pointer;padding:4px;line-height:1;}
.modal-body{padding:20px;}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border);background:var(--bg-hover);position:sticky;bottom:0;}
.detail-section{margin-bottom:20px;}
.detail-section-title{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:10px;padding-left:10px;border-left:3px solid var(--accent);}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;}
.detail-row{display:flex;padding:7px 0;border-bottom:1px solid var(--border-light);}
.detail-label{width:96px;font-size:12px;color:var(--text-muted);flex-shrink:0;}
.detail-value{font-size:13px;color:var(--text-primary);flex:1;word-break:break-all;}
.detail-value.mono{font-family:"Microsoft YaHei",sans-serif;}

/* 资产明细 */
.asset-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px;}
.asset-tab{padding:10px 16px;font-size:13.5px;font-weight:500;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all var(--transition);user-select:none;}
.asset-tab:hover{color:var(--text-primary);}
.asset-tab.active{color:var(--text-primary);border-bottom-color:var(--accent);}
.asset-tab .at-count{font-size:11px;color:var(--text-muted);margin-left:6px;background:var(--bg-input);padding:1px 8px;border-radius:10px;}
.asset-tab.active .at-count{background:var(--accent-soft);color:var(--text-primary);}
.asset-summary{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.summary-chip{flex:1;min-width:150px;background:var(--bg-input);border:1px solid var(--border-light);border-radius:var(--radius);padding:12px 16px;}
.summary-chip .sc-label{font-size:11.5px;color:var(--text-muted);}
.summary-chip .sc-value{font-size:20px;font-weight:600;color:var(--text-primary);margin-top:4px;font-family:"Microsoft YaHei",sans-serif;}
.summary-chip.warn .sc-value{color:var(--text-primary);}
.summary-chip.muted .sc-value{color:var(--text-secondary);}
.asset-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.asset-table th{background:#fafaf9;text-align:left;padding:9px 12px;font-weight:500;font-size:11.5px;color:var(--text-muted);border-bottom:1px solid var(--border);white-space:nowrap;}
.asset-table td{padding:9px 12px;border-bottom:1px solid var(--border-light);vertical-align:middle;}
.asset-table tr:hover td{background:var(--bg-hover);}
.asset-empty{text-align:center;padding:36px;color:var(--text-muted);font-size:13px;}
.asset-note{font-size:11.5px;color:var(--text-secondary);background:var(--bg-input);border-radius:var(--radius-sm);padding:8px 12px;margin-top:12px;line-height:1.6;}
.toast-container{position:fixed;top:24px;right:24px;z-index:400;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--bg-sidebar);color:#fff;padding:12px 18px;border-radius:var(--radius);font-size:13px;box-shadow:var(--shadow-lg);}
.toast.success{border-left:3px solid var(--green);}
.toast.info{border-left:3px solid var(--blue);}
.toast.warning{border-left:3px solid var(--orange);}
</style>
</head>
<body>

<aside class="sidebar" id="app-sidebar" data-nav-active="user-equity-overview"></aside>
<script src="../assets/common-sidebar.js"></script>

<div class="main">
  <div class="topbar">
    <div class="breadcrumb"><a href="08.用户权益总览-原型页面.html">营销管理</a> / <a href="08.用户权益总览-原型页面.html">用户权益总览</a> / <span>用户权益流水</span></div>
    <div class="topbar-right">
      <span style="font-size:12px;color:var(--text-muted);">品牌运营 晓琳</span>
      <div class="user-avatar">晓</div>
    </div>
  </div>
  <div class="content">
    <div class="page-header">
      <div>
        <h1>用户权益流水</h1>
        <p>查看本商城 C 端用户的积分与卡券统一流水明细；点击用户卡片可查看该用户的积分剩余（含有效期）与卡券持有明细</p>
      </div>
    </div>

    <!-- 用户信息（可点击，展开资产明细） -->
    <div id="userSection"></div>

    <!-- 统一流水表 -->
    <div class="table-panel">
      <div class="filter-bar">
        <div class="filter-fields">
          <span class="fl-label">业务</span>
          <select id="fBiz" onchange="filterTable()">
            <option value="">全部</option>
            <option value="points">积分</option>
            <option value="coupon">卡券</option>
          </select>
          <span class="fl-label">时间</span>
          <div class="date-range">
            <input type="date" id="fDateFrom" onchange="filterTable()" />
            <span class="date-sep">至</span>
            <input type="date" id="fDateTo" onchange="filterTable()" />
          </div>
          <span class="fl-label">类型</span>
          <select id="fType" onchange="filterTable()">
            <option value="">全部类型</option>
          </select>
          <span class="fl-label">单号</span>
          <input type="text" id="fRef" placeholder="关联单号" oninput="filterTable()" />
        </div>
        <div class="filter-actions">
          <button class="btn-reset" onclick="resetFilter()">重置</button>
          <button class="btn btn-primary" onclick="exportData()">导出</button>
        </div>
      </div>
      <div class="table-wrap">
        <div class="table-scroll">
          <table>
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 页面底部固定操作栏 -->
<div class="page-footer-fixed">
  <div class="page-footer-left">
    <div style="font-size:12px;color:var(--text-muted);" id="tableInfo">共 0 条</div>
  </div>
  <div class="page-footer-right">
    <div class="pagination" id="pagination"></div>
    <div style="display:flex;align-items:center;gap:8px;margin-left:16px;">
      <span style="font-size:12px;color:var(--text-muted);">每页</span>
      <select id="pageSizeSelect" onchange="changePageSize()" style="height:28px;padding:0 8px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;font-family:inherit;background:var(--bg-surface);color:var(--text-primary);cursor:pointer;">
        <option value="10">10条</option>
        <option value="20" selected>20条</option>
        <option value="50">50条</option>
        <option value="100">100条</option>
      </select>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-left:16px;">
      <span style="font-size:12px;color:var(--text-muted);">跳转至</span>
      <input type="number" id="jumpPageInput" min="1" max="1" value="1" style="width:56px;height:28px;padding:0 8px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;font-family:inherit;background:var(--bg-surface);color:var(--text-primary);text-align:center;" onkeydown="if(event.key==='Enter')jumpToPage()"/>
      <span style="font-size:12px;color:var(--text-muted);">页</span>
      <button onclick="jumpToPage()" style="height:28px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;font-family:inherit;background:var(--bg-surface);color:var(--text-primary);cursor:pointer;">跳转</button>
    </div>
  </div>
</div>

<!-- 流水详情 Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header"><h3 id="detailTitle">流水详情</h3><button class="modal-close" onclick="closeDetailModal()">&times;</button></div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeDetailModal()">关闭</button>
    </div>
  </div>
</div>

<!-- 用户资产明细 Modal -->
<div class="modal-overlay" id="userAssetModal">
  <div class="modal modal-lg">
    <div class="modal-header"><h3 id="userAssetTitle">用户资产明细</h3><button class="modal-close" onclick="closeUserAssetModal()">&times;</button></div>
    <div class="modal-body" id="userAssetBody"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeUserAssetModal()">关闭</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
// ===== 类型映射 =====

// ===== 统一关联单号：积分 J+YYYYMMDD+3位 / 卡券 C+YYYYMMDD+3位，每天自增重置 =====
// 同事件(同uid+同time，同biz)共用同一单号；过期(ref='-')无单号
(function(){
  function pad3(n){n=String(n);while(n.length<3)n='0'+n;return n;}
  function genRefs(records, prefix){
    var evMap = {};
    records.forEach(function(r){
      if(r.ref==='-') return;
      var key = r.uid+'|'+r.time;
      if(!evMap[key]) evMap[key] = {uid:r.uid, time:r.time};
    });
    var evList = Object.keys(evMap).map(function(k){return evMap[k];});
    evList.sort(function(a,b){return a.time.localeCompare(b.time);});
    var seqByDay = {};
    var refMap = {};
    evList.forEach(function(ev){
      var ymd = ev.time.replace(/[-: ]/g,'').substring(0,8);  // YYYYMMDD
      seqByDay[ymd] = (seqByDay[ymd]||0)+1;
      refMap[ev.uid+'|'+ev.time] = prefix + ymd + pad3(seqByDay[ymd]);
    });
    return refMap;
  }
  var pointsRefMap = genRefs(POINTS_RECORDS, 'J');
  var couponRefMap = genRefs(COUPON_RECORDS, 'C');
  POINTS_RECORDS.forEach(function(r){ if(r.ref!=='-') r.ref = pointsRefMap[r.uid+'|'+r.time] || r.ref; });
  COUPON_RECORDS.forEach(function(r){ if(r.ref!=='-') r.ref = couponRefMap[r.uid+'|'+r.time] || r.ref; });
  // 卡券资产：未使用 -> 发放(getTime)事件单号；已使用 -> 核销/作废/过期(disposeTime)事件单号
  COUPON_HOLDINGS.forEach(function(c){
    var t = (c.status==='未使用') ? c.getTime : c.disposeTime;
    c.ref = couponRefMap[c.uid+'|'+t] || '-';
  });
})();

function showToast(type,msg){var c=document.getElementById('toastContainer'),t=document.createElement('div');t.className='toast '+type;t.textContent=msg;c.appendChild(t);setTimeout(function(){t.remove();},3000);}
function copyRef(el){
  var ref=(typeof el==='string')?el:el.textContent;
  if(!ref||ref==='-')return;
  var done=function(){showToast('success','已复制单号：'+ref);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ref).then(done).catch(function(){fallbackCopy(ref,done);});}
  else{fallbackCopy(ref,done);}
}
function fallbackCopy(ref,cb){var ta=document.createElement('textarea');ta.value=ref;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');cb();}catch(e){showToast('warning','复制失败，请手动复制');}document.body.removeChild(ta);}
function getUser(uid){return USERS.find(function(u){return u.uid===uid;});}
function onMallChange(){
  // 单品牌：currentUid 来自父页下钻（?userId=）或默认，确保有效后渲染
  if(!getUser(currentUid)){currentUid=USERS[0]?USERS[0].uid:'';}
  page=1;
  renderUser();renderTypeOptions();renderTable();
}
function renderUser(){
  var u=getUser(currentUid);if(!u)return;
  var total=u.terms.reduce(function(s,t){return s+t.amt;},0);
  var expiring=u.terms.filter(function(t){return t.expiring;});
  var expHtml=expiring.length?'<span class="exp">· 即将过期 '+expiring.map(function(t){return t.amt+' ('+t.expireDate+')';}).join('、')+'</span>':'';
  var termsHtml=u.terms.map(function(t){return t.t+' <b>'+t.amt.toLocaleString()+'</b>'+(t.expiring?'(即将过期)':'');}).join(' · ');
  var html='<div class="user-card" onclick="openUserAssetModal()">'+
    '<div class="user-avatar-lg">'+u.name.charAt(0)+'</div>'+
    '<div class="user-info">'+
      '<div class="uname">'+u.name+'</div>'+
      '<div class="umeta">'+
        '<span>手机号 <span class="mono">'+u.phone+'</span></span>'+
        '<span>注册时间 '+u.regTime+'</span>'+
      '</div>'+
      '<div class="upts">当前积分 <b>'+total.toLocaleString()+'</b> '+expHtml+'<br><span class="terms">期限分布：'+termsHtml+'</span></div>'+
    '</div>'+
    '<div class="card-cta">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11"/></svg>'+
      '查看资产明细'+
    '</div>'+
  '</div>';
  document.getElementById('userSection').innerHTML=html;
}

// ===== 统一流水：合并积分 + 卡券，按时间倒序 =====
function couponDeduct(r){
  if(r.type!=='verify')return null;
  var f=r.face||'';
  if(f.indexOf('满200减50')>=0)return '¥50';
  if(f.indexOf('满100减30')>=0)return '¥30';
  if(f.indexOf('满100减20')>=0)return '¥20';
  if(f.indexOf('满50减10')>=0)return '¥10';
  if(f.indexOf('8折')>=0)return '¥50';
  if(f.indexOf('5次')>=0)return '¥35';
  if(f.indexOf('5元')>=0)return '¥5';
  if(f.indexOf('10元')>=0)return '¥10';
  return '-';
}
function buildFlow(){
  var arr=[];
  POINTS_RECORDS.forEach(function(r){
    arr.push({biz:'points',uid:r.uid,time:r.time,type:r.type,obj:r.term,change:r.amt,after:r.after,ref:r.ref,status:POINTS_STATUS[r.type],remark:r.remark});
  });
  COUPON_RECORDS.forEach(function(r){
    var gain=(r.type==='issue'||r.type==='exchange');
    arr.push({biz:'coupon',uid:r.uid,time:r.time,type:r.type,obj:r.name,face:r.face,source:r.source,change:gain?'+1':'-1',after:'-',ref:r.ref,status:r.status,remark:r.remark,deduct:couponDeduct(r)});
  });
  arr.sort(function(a,b){return b.time.localeCompare(a.time);});
  return arr;
}
function userFlow(){return buildFlow().filter(function(r){return r.uid===currentUid;});}

function renderTypeOptions(){
  var biz=document.getElementById('fBiz').value;
  var html='<option value="">全部类型</option>';
  var groups=[{key:'points',label:'积分',map:POINTS_TYPE},{key:'coupon',label:'卡券',map:COUPON_TYPE}];
  groups.forEach(function(g){
    if(biz&&biz!==g.key)return;
    html+='<optgroup label="'+g.label+'">';
    Object.keys(g.map).forEach(function(k){html+='<option value="'+k+'">'+g.map[k].label+'</option>';});
    html+='</optgroup>';
  });
  document.getElementById('fType').innerHTML=html;
}
function getFiltered(){
  var biz=document.getElementById('fBiz').value;
  var df=document.getElementById('fDateFrom').value;
  var dt=document.getElementById('fDateTo').value;
  var t=document.getElementById('fType').value;
  var ref=(document.getElementById('fRef').value||'').trim().toUpperCase();
  return userFlow().filter(function(r){
    if(biz&&r.biz!==biz)return false;
    if(t&&r.type!==t)return false;
    if(df&&r.time.substring(0,10)<df)return false;
    if(dt&&r.time.substring(0,10)>dt)return false;
    if(ref&&(r.ref||'-').toUpperCase().indexOf(ref)<0)return false;
    return true;
  });
}
function filterTable(){page=1;renderTable();}
function resetFilter(){
  document.getElementById('fBiz').value='';
  ['fDateFrom','fDateTo','fRef'].forEach(function(id){document.getElementById(id).value='';});
  renderTypeOptions();page=1;renderTable();
}

function renderTable(){
  var list=getFiltered();
  var totalPages=Math.max(1,Math.ceil(list.length/pageSize));
  if(page>totalPages)page=totalPages;
  var start=(page-1)*pageSize;
  var pageData=list.slice(start,start+pageSize);
  var head='<tr>'+
    '<th style="width:130px;">时间</th>'+
    '<th style="width:80px;">业务</th>'+
    '<th style="width:95px;">类型</th>'+
    '<th style="width:140px;">对象</th>'+
    '<th style="width:120px;">变动/余额</th>'+
    '<th style="width:150px;">关联单号</th>'+
    '<th style="width:85px;">状态</th>'+
    '<th>备注</th>'+
    '<th style="width:80px;">操作</th>'+
  '</tr>';
  document.getElementById('tableHead').innerHTML=head;
  var html='',colspan=9;
  if(!pageData.length){
    html='<tr><td colspan="'+colspan+'" style="text-align:center;padding:40px;color:var(--text-muted);">暂无匹配的流水记录</td></tr>';
  }else{
    pageData.forEach(function(r,idx){
      var baseIdx=start+idx;
      var ti=(r.biz==='points'?POINTS_TYPE:COUPON_TYPE)[r.type];
      var bizTag=r.biz==='points'?'<span class="biz-tag biz-points">积分</span>':'<span class="biz-tag biz-coupon">卡券</span>';
      var typeTag='<span class="type-tag '+ti.cls+'">'+ti.label+'</span>';
      var objCell,changeCell;
      if(r.biz==='points'){
        var amtCls=r.change>=0?'plus':'minus';
        var amtStr=(r.change>0?'+':'')+r.change.toLocaleString();
        var termExp=r.obj==='1年期'&&r.change<0;
        objCell='<span class="term-tag'+(termExp?' expiring':'')+'">'+r.obj+'</span>';
        changeCell='<span class="amount-cell '+amtCls+'">'+amtStr+'</span><div class="after-sub">余额 '+r.after+'</div>';
      }else{
        objCell='<div class="obj-cell">'+r.obj+'<div class="obj-sub">'+r.face+'</div></div>';
        changeCell='<span class="amount-cell">'+r.change+'张</span>'+(r.deduct?'<div class="after-sub">抵扣 '+r.deduct+'</div>':'');
      }
      var stCls=statusCls(r.status);
      var refCell=r.ref==='-'?'<span style="color:var(--text-muted);">-</span>':'<span class="ref-cell" title="点击复制" onclick="copyRef(this)">'+r.ref+'</span>';
      html+='<tr>'+
        '<td><span class="time-cell">'+r.time.substring(0,16)+'</span></td>'+
        '<td>'+bizTag+'</td>'+
        '<td>'+typeTag+'</td>'+
        '<td>'+objCell+'</td>'+
        '<td>'+changeCell+'</td>'+
        '<td>'+refCell+'</td>'+
        '<td><span class="fs-tag '+stCls+'">'+r.status+'</span></td>'+
        '<td><span class="remark-cell">'+r.remark+'</span></td>'+
        '<td><div class="actions"><span class="action-link" onclick="viewDetail('+baseIdx+')">详情</span></div></td>'+
      '</tr>';
    });
  }
  document.getElementById('tableBody').innerHTML=html;
  document.getElementById('tableInfo').textContent='共 '+list.length+' 条';
  renderPagination('pagination',page,totalPages,function(p){page=p;renderTable();});
  var jpi=document.getElementById('jumpPageInput');jpi.max=totalPages;jpi.value=page;
}

function renderPagination(containerId,pg,totalPages,cb){
  var html='';
  html+='<button class="page-btn '+(pg<=1?'disabled':'')+'" data-p="'+(pg-1)+'">‹</button>';
  var ms=5,sp=Math.max(1,pg-Math.floor(ms/2)),ep=Math.min(totalPages,sp+ms-1);
  if(ep-sp<ms-1)sp=Math.max(1,ep-ms+1);
  for(var i=sp;i<=ep;i++)html+='<button class="page-btn '+(i===pg?'active':'')+'" data-p="'+i+'">'+i+'</button>';
  html+='<button class="page-btn '+(pg>=totalPages?'disabled':'')+'" data-p="'+(pg+1)+'">›</button>';
  var c=document.getElementById(containerId);c.innerHTML=html;
  c.querySelectorAll('.page-btn[data-p]').forEach(function(b){b.addEventListener('click',function(){var p=parseInt(this.getAttribute('data-p'));if(p>=1&&p<=totalPages)cb(p);});});
}

function dr(label,value,cls){return '<div class="detail-row"><span class="detail-label">'+label+'</span><span class="detail-value '+(cls||'')+'">'+value+'</span></div>';}

    dr('用户',u.name)+
    dr('手机号',u.phone,'mono')+'</div></div>';

    var ti=POINTS_TYPE[r.type];

    html+='<div class="detail-section"><div class="detail-section-title">积分变动</div><div class="detail-grid">'+
      dr('时间',r.time,'mono')+dr('业务','<span class="biz-tag biz-points">积分</span>')+
      dr('类型','<span class="type-tag '+ti.cls+'">'+ti.label+'</span>')+dr('积分期限','<span class="term-tag">'+r.obj+'</span>')+
      dr('变动积分','<span class="amount-cell '+amtCls+'" style="font-size:14px;">'+amtStr+'</span>')+dr('变动后余额',r.after,'mono')+
      dr('流水状态','<span class="fs-tag '+stCls+'">'+r.status+'</span>')+dr('关联单号',r.ref==='-'?'-':'<span class="ref-cell" title="点击复制" onclick="copyRef(this)">'+r.ref+'</span>')+
      dr('备注',r.remark)+'</div></div>';
  }else{
    var ti2=COUPON_TYPE[r.type];var si=SOURCE_MAP[r.source]||{label:'-',cls:''};
    html+='<div class="detail-section"><div class="detail-section-title">卡券变动</div><div class="detail-grid">'+
      dr('时间',r.time,'mono')+dr('业务','<span class="biz-tag biz-coupon">卡券</span>')+
      dr('类型','<span class="type-tag '+ti2.cls+'">'+ti2.label+'</span>')+dr('卡券名称',r.obj)+
      dr('面值/内容',r.face)+dr('来源','<span class="source-tag '+si.cls+'">'+si.label+'</span>')+
      dr('变动','<span class="amount-cell">'+r.change+'张</span>')+dr('实际抵扣金额',r.deduct||'-')+dr('流水状态','<span class="fs-tag '+statusCls(r.status)+'">'+r.status+'</span>')+
      dr('关联单号',r.ref==='-'?'-':'<span class="ref-cell" title="点击复制" onclick="copyRef(this)">'+r.ref+'</span>')+dr('备注',r.remark)+'</div></div>';
  }
  document.getElementById('detailBody').innerHTML=html;
  document.getElementById('detailModal').classList.add('open');
}
function closeDetailModal(){document.getElementById('detailModal').classList.remove('open');}

function exportData(){
  var biz=document.getElementById('fBiz').value;
  showToast('success','演示：开始导出用户 '+getUser(currentUid).name+' 的'+(biz==='points'?'积分':(biz==='coupon'?'卡券':'积分+卡券'))+'统一流水');
}

// ===== 用户资产明细（点击用户卡片） =====
function openUserAssetModal(){
  assetTab='points';
  renderAssetModal();
  document.getElementById('userAssetModal').classList.add('open');
}
function closeUserAssetModal(){document.getElementById('userAssetModal').classList.remove('open');}
function switchAssetTab(t){assetTab=t;renderAssetModal();}
function holdingsOf(uid){return COUPON_HOLDINGS.filter(function(c){return c.uid===uid;});}
function holdingDeduct(c){
  if(c.status!=='已核销')return '-';
  var f=c.face||'';
  if(f.indexOf('满200减50')>=0)return '¥50';
  if(f.indexOf('满100减20')>=0)return '¥20';
  if(f.indexOf('满50减10')>=0)return '¥10';
  if(f.indexOf('8折')>=0)return '¥50';
  if(f.indexOf('5次')>=0)return '¥35';
  if(f.indexOf('15元')>=0||f.indexOf('¥15')>=0)return '¥15';
  if(f.indexOf('5元')>=0||f.indexOf('¥5')>=0)return '¥5';
  if(f.indexOf('10元')>=0||f.indexOf('¥10')>=0)return '¥10';
  return '-';
}
function renderAssetModal(){
  var u=getUser(currentUid);if(!u)return;
  document.getElementById('userAssetTitle').textContent='用户资产明细 · '+u.name+'（'+u.phone+'）';
  var total=u.terms.reduce(function(s,t){return s+t.amt;},0);
  var expiringAmt=u.terms.filter(function(t){return t.expiring;}).reduce(function(s,t){return s+t.amt;},0);
  var holdings=holdingsOf(currentUid);
  var unused=holdings.filter(function(c){return c.status==='未使用';});
  var used=holdings.filter(function(c){return c.status!=='未使用';});

  var tabs='<div class="asset-tabs">'+
    '<div class="asset-tab '+(assetTab==='points'?'active':'')+'" onclick="switchAssetTab(\'points\')">积分剩余明细<span class="at-count">'+u.terms.length+'</span></div>'+
    '<div class="asset-tab '+(assetTab==='unused'?'active':'')+'" onclick="switchAssetTab(\'unused\')">剩余卡券<span class="at-count">'+unused.length+'</span></div>'+
    '<div class="asset-tab '+(assetTab==='used'?'active':'')+'" onclick="switchAssetTab(\'used\')">已使用卡券<span class="at-count">'+used.length+'</span></div>'+
  '</div>';

  var body='';
  if(assetTab==='points'){
    body='<div class="asset-summary">'+
      '<div class="summary-chip"><div class="sc-label">积分总余额</div><div class="sc-value">'+total.toLocaleString()+'</div></div>'+
      '<div class="summary-chip warn"><div class="sc-label">即将过期</div><div class="sc-value">'+expiringAmt.toLocaleString()+'</div></div>'+
      '<div class="summary-chip muted"><div class="sc-label">期限批次数</div><div class="sc-value">'+u.terms.length+'</div></div>'+
    '</div>';
    body+='<table class="asset-table"><thead><tr><th>积分期限</th><th>批次</th><th>剩余积分</th><th>有效期</th><th>状态</th></tr></thead><tbody>';
    var sortedTerms=u.terms.slice().sort(function(a,b){
      if(a.expireDate==='-')return 1;
      if(b.expireDate==='-')return -1;
      return a.expireDate.localeCompare(b.expireDate);
    });
    sortedTerms.forEach(function(t){
      var st,cls;
      if(t.expireDate==='-'){st='有效';}
      else if(t.amt===0){st='已过期';}
      else if(t.expiring){st='即将过期';}
      else{st='有效';}
      var cls=statusCls(st);
      var expDisplay=t.expireDate==='-'?'长期':t.expireDate;
      body+='<tr>'+
        '<td><span class="term-tag'+(t.expiring?' expiring':'')+'">'+t.t+'</span></td>'+
        '<td><span class="time-cell">'+(t.batch||'-')+'</span></td>'+
        '<td><span class="amount-cell">'+t.amt.toLocaleString()+'</span></td>'+
        '<td><span class="time-cell">'+expDisplay+'</span></td>'+
        '<td><span class="fs-tag '+cls+'">'+st+'</span></td>'+
      '</tr>';
    });
    body+='</tbody></table>';
  }else if(assetTab==='unused'){
    if(!unused.length){
      body='<div class="asset-empty">该用户暂无未使用的卡券</div>';
    }else{
      body='<div class="asset-summary">'+
        '<div class="summary-chip"><div class="sc-label">未使用卡券</div><div class="sc-value">'+unused.length+' 张</div></div>'+
      '</div>';
      body+='<table class="asset-table"><thead><tr><th>卡券名称</th><th>面值/内容</th><th>来源</th><th>获得时间</th><th>有效期</th><th>状态</th></tr></thead><tbody>';
      unused.forEach(function(c){
        var si=SOURCE_MAP[c.source]||{label:'-',cls:''};
        body+='<tr>'+
          '<td>'+c.name+'</td>'+
          '<td style="color:var(--text-secondary);">'+c.face+'</td>'+
          '<td><span class="source-tag '+si.cls+'">'+si.label+'</span></td>'+
          '<td><span class="time-cell">'+c.getTime+'</span></td>'+
          '<td><span class="time-cell">'+(c.expireDate||'-')+'</span></td>'+
          '<td><span class="fs-tag '+statusCls(c.status)+'">'+c.status+'</span></td>'+
        '</tr>';
      });
      body+='</tbody></table>';
      body+='<div class="asset-note">说明：次卡首次订单支付即核销，未使用次卡显示总次数；积分卡发放后积分即到账，不在此展示。</div>';
    }
  }else{
    if(!used.length){
      body='<div class="asset-empty">该用户暂无已使用/已失效的卡券</div>';
    }else{
      var byStatus={};
      used.forEach(function(c){byStatus[c.status]=(byStatus[c.status]||0)+1;});
      var chips=Object.keys(byStatus).map(function(k){return '<div class="summary-chip muted"><div class="sc-label">'+k+'</div><div class="sc-value">'+byStatus[k]+'</div></div>';}).join('');
      body='<div class="asset-summary">'+chips+'</div>';
      body+='<table class="asset-table"><thead><tr><th>卡券名称</th><th>面值/内容</th><th>来源</th><th>获得时间</th><th>核销时间</th><th>状态</th><th>实际抵扣金额</th><th>关联单号</th></tr></thead><tbody>';
      used.forEach(function(c){
        var si=SOURCE_MAP[c.source]||{label:'-',cls:''};
        var faceCell=c.face+(c.remaining!=null?' · 剩'+c.remaining+'次':'');
        body+='<tr>'+
          '<td>'+c.name+'</td>'+
          '<td style="color:var(--text-secondary);">'+faceCell+'</td>'+
          '<td><span class="source-tag '+si.cls+'">'+si.label+'</span></td>'+
          '<td><span class="time-cell">'+c.getTime+'</span></td>'+
          '<td><span class="time-cell">'+(c.disposeTime||'-')+'</span></td>'+
          '<td><span class="fs-tag '+statusCls(c.status)+'">'+c.status+'</span></td>'+
          '<td>'+holdingDeduct(c)+'</td>'+
          '<td>'+(c.ref&&c.ref!=='-'?'<span class="ref-cell" title="点击复制" onclick="copyRef(this)">'+c.ref+'</span>':'<span style="color:var(--text-muted);">-</span>')+'</td>'+
        '</tr>';
      });
      body+='</tbody></table>';
      body+='<div class="asset-note">说明：次卡首次订单支付即核销，核销后若仍有剩余次数，在"面值/内容"列展示剩余次数；作废/过期卡券的"核销时间"为作废/过期时间。</div>';
    }
  }
  document.getElementById('userAssetBody').innerHTML=tabs+body;
}

document.querySelectorAll('.modal-overlay').forEach(function(o){o.addEventListener('click',function(e){if(e.target===o)o.classList.remove('open');});});
